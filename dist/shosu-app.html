  /* 数の入力欄（タップでえらび、数字キーで入れる） */
  function NumField(o) {
    var val = o.value || '';
    var el = h('button', 'mk-num' + (o.cls ? ' ' + o.cls : ''));
    el.type = 'button';
    if (o.label) el.appendChild(h('span', 'mk-num-label', o.label));
    var v = h('span', 'mk-num-val');
    el.appendChild(v);
    function render() {
      v.textContent = val || '？';
      el.classList.toggle('empty', !val);
    }
    render();
    return {
      el: el,
      get: function () { return val; },
      set: function (s) { val = s; render(); },
      focus: function (on) { el.classList.toggle('on', !!on); el.setAttribute('aria-pressed', on ? 'true' : 'false'); }
    };
  }

  /* 数字キーの1回分を反映。エラーならメッセージを返す */
  function applyKey(val, k, maxDec, maxInt) {
    maxInt = maxInt || 3;
    if (k === '←') return { val: val.slice(0, -1) };
    if (k === '.') {
      if (val.indexOf('.') >= 0) return { val: val, err: '小数点は1つだけだよ。' };
      return { val: (val || '0') + '.' };
    }
    var i = val.indexOf('.');
    if (i >= 0 && val.length - i - 1 >= maxDec) {
      return { val: val, err: maxDec === 2 ? 'たし算・ひき算の筆算は、小数第二位（1/100の位）までにしよう。' : '小数第三位（1/1000の位）までにしよう。' };
    }
    if (i < 0 && val.replace(/^0+/, '').length >= maxInt && val !== '0') return { val: val, err: '整数の部分は' + maxInt + 'けたまでにしよう。' };
    if (val === '0') return { val: k };
    return { val: val + k };
  }

  /* ---------- 星（Shosu.Stars：担当H） ---------- */
  function starBadge() {
    if (!(S.Stars && S.Stars.badge)) return null;
    try { var b = S.Stars.badge(); if (!b) return null; var w = h('span', 'topbar-stars'); w.appendChild(b); return w; }
    catch (e) { console.error('Stars.badge', e); return null; }
  }
  function starLog(type, data) {
    if (!(S.Stars && S.Stars.log)) return [];
    try { return S.Stars.log(type, data) || []; } catch (e) { console.error('Stars.log', e); return []; }
  }

  function deviceId() {
    try { return S.Session && S.Session.deviceId ? S.Session.deviceId() : null; } catch (e) { return null; }
  }

  /* ---------- 作りかけ（ページ内で覚えておく） ---------- */
  var draft = null; // {kind, up, editId}

  function blankUp(kind) {
    var up = { v: 1, kind: kind, author: null, hint: null };
    if (kind === 'hissan') { up.op = '+'; up.a = ''; up.b = ''; }
    if (kind === 'fill') { up.q = null; up.answer = ''; up.unit = 'L'; }
    if (kind === 'compare') { up.a = ''; up.b = ''; }
    if (kind === 'masu') { up.level = 2; up.L = 1; up.d1 = 2; up.d2 = 6; up.d3 = 0; }
    if (kind === 'numberline') { up.min = '0'; up.max = '1'; up.step = '0.1'; up.labelEvery = 10; up.arrows = []; }
    return up;
  }

  /* 答えの計算 */
  function hissanAns(up) {
    if (!N.valid(up.a) || !N.valid(up.b)) return null;
    return up.op === '-' ? N.sub(up.a, up.b) : N.add(up.a, up.b);
  }
  function masuAns(up) {
    var s = String(up.L || 0) + '.' + (up.d1 || 0) + (up.d2 || 0) + (up.level === 3 ? (up.d3 || 0) : '');
    return N.fromInt(N.toInt(s), N.scale(s));
  }
  function sym(c) { return c > 0 ? '＞' : c < 0 ? '＜' : '＝'; }
  function sortedArrows(up) {
    return (up.arrows || []).slice().sort(function (a, b) { return N.cmp(a, b); });
  }
  function answerText(up) {
    switch (up.kind) {
      case 'hissan': var a = hissanAns(up); return a == null ? '' : a;
      case 'fill': return up.answer ? up.answer + (up.unit ? ' ' + up.unit : '') : '';
      case 'compare': return N.valid(up.a) && N.valid(up.b) ? up.a + ' ' + sym(N.cmp(up.a, up.b)) + ' ' + up.b : '';
      case 'masu': return masuAns(up) + ' L';
      case 'numberline':
        return sortedArrows(up).map(function (v, i) { return ARROW_NAMES[i] + '　' + v; }).join('、　');
    }
    return '';
  }

  /* 検証：[{where, msg}] を返す（空なら OK） */
  function problems(up) {
    var out = [];
    function bad(where, msg) { out.push({ where: where, msg: msg }); }
    if (up.kind === 'hissan') {
      if (!up.a) bad('a', up.op === '-' ? 'ひかれる数を入れてね。' : '上の数を入れてね。');
      else if (!N.valid(up.a)) bad('a', '上の数が、とちゅうになっているよ。');
      if (!up.b) bad('b', up.op === '-' ? 'ひく数を入れてね。' : '下の数を入れてね。');
      else if (!N.valid(up.b)) bad('b', '下の数が、とちゅうになっているよ。');
      if (!out.length) {
        if (N.cmp(up.a, '0') === 0 || N.cmp(up.b, '0') === 0) bad('b', '0 ではない数にしよう。');
        else if (up.op === '-' && N.cmp(up.a, up.b) < 0) bad('b', 'ひかれる数のほうが小さいと、答えがマイナスになって計算できないよ。2つの数を入れかえよう。');
        else if (N.scale(up.a) === 0 && N.scale(up.b) === 0) bad('a', 'どちらかを小数にしよう。');
      }
    } else if (up.kind === 'fill') {
      if (!inkHasStrokes(up.q)) bad('q', '問題文を書いてね。');
      if (!up.answer) bad('answer', '答えの数を入れてね。');
      else if (!N.valid(up.answer)) bad('answer', '答えの数が、とちゅうになっているよ。');
    } else if (up.kind === 'compare') {
      if (!up.a) bad('a', '左の数を入れてね。'); else if (!N.valid(up.a)) bad('a', '左の数が、とちゅうになっているよ。');
      if (!up.b) bad('b', '右の数を入れてね。'); else if (!N.valid(up.b)) bad('b', '右の数が、とちゅうになっているよ。');
      if (!out.length && N.scale(up.a) === 0 && N.scale(up.b) === 0) bad('a', 'どちらかを小数にしよう。');
    } else if (up.kind === 'masu') {
      if (N.cmp(masuAns(up), '0') === 0) bad('masu', '水を入れてね（＋をおそう）。');
    } else if (up.kind === 'numberline') {
      if (!up.arrows || !up.arrows.length) bad('arrows', '数直線の目もりをタップして、↑をおいてね。');
    }
    if (!inkHasStrokes(up.author)) bad('author', '名前を書いてね。');
    return out;
  }

  /* ---------- 画面 ---------- */
  function mount(el, route) {
    var alive = true;
    var cleanups = [];
    route = String(route || 'make').replace(/^#?\/?/, '');
    var parts = route.split('/');

    function clear() {
      while (cleanups.length) { try { cleanups.pop()(); } catch (e) { console.error(e); } }
      el.innerHTML = '';
    }
    function topbar(title, backLabel, backHref, right) {
      var bar = h('header', 'topbar mk-topbar');
      var back = typeof backHref === 'string' ? link(backLabel, 'btn back', backHref) : button(backLabel, 'back', backHref);
      bar.appendChild(back);
      var t = h('div', 'topbar-title');
      t.appendChild(h('h1', null, title));
      bar.appendChild(t);
      var sb = starBadge();
      if (sb) bar.appendChild(sb);
      if (right) bar.appendChild(right);
      return bar;
    }

    /* ===== 1. 種類をえらぶ ===== */
    function viewChoose() {
      clear();
      var myN = 0;
      try { myN = store() && store().myList ? store().myList().length : 0; } catch (e) {}
      var right = link('つくった問題' + (myN ? '（' + myN + '）' : ''), 'btn back mk-my-link', '#/my');
      el.appendChild(topbar('もんだいをつくる', '◀ ホーム', '#/', right));
      var main = h('main', 'mk mk-choose');
      main.appendChild(h('p', 'mk-lead', 'どんな問題を作るか、えらんでね。作った問題は、友だちにリンクで送れるよ。'));
      if (draft && !draft.editId && draft.up && draft.up.kind) {
        var info = kindInfo(draft.up.kind);
        var nb = h('div', 'mk-draft-note');
        nb.appendChild(h('span', null, '作りかけの「' + (info ? info.label : '') + '」の問題があるよ。'));
        nb.appendChild(link('つづきを作る', 'btn primary small', '#/make/' + draft.up.kind));
        nb.appendChild(button('すてる', 'small', function () { draft = null; nb.remove(); }));
        main.appendChild(nb);
      }
      var grid = h('div', 'mk-kind-grid');
      KINDS.forEach(function (k) {
        var c = link('', 'mk-kind-card', '#/make/' + k.id);
        c.style.setProperty('--kc', k.color);
        var pic = h('div', 'mk-kind-pic');
        pic.appendChild(kindPicture(k.id));
        c.appendChild(pic);
        c.appendChild(h('div', 'mk-kind-name', k.label));
        c.appendChild(h('div', 'mk-kind-desc', k.desc));
        grid.appendChild(c);
      });
      main.appendChild(grid);
      el.appendChild(main);
    }

    function kindPicture(id) {
      var d = h('div', 'mk-pic mk-pic-' + id);
      if (id === 'hissan') {
        d.innerHTML = '<div class="mk-pic-h"><span></span><span>4.25</span><span>＋</span><span>2.18</span><i></i><span></span><span class="r">6.43</span></div>';
      } else if (id === 'fill') {
        d.innerHTML = '<div class="mk-pic-f"><span class="scrib">ジュースが…</span><span class="ans"><b>□</b> L</span></div>';
      } else if (id === 'compare') {
        d.innerHTML = '<div class="mk-pic-c"><span>0.43</span><b>＞</b><span>0.425</span></div>';
      } else if (id === 'masu' && S.Figures) {
        d.appendChild(S.Figures.render({ kind: 'masu', unit: 'L', level: 2, L: 1, d1: 2, d2: 6, labels: false }));
      } else if (id === 'numberline' && S.Figures) {
        d.appendChild(S.Figures.render({ kind: 'numberline', min: 0, max: 1, step: 0.1, labelEvery: 10, arrows: [{ v: 0.3, label: 'あ' }] }));
      }
      return d;
    }

    /* ===== 2. 作る ===== */
    function viewEdit(kind, editId) {
      clear();
      var info = kindInfo(kind);
      if (!info) { viewChoose(); return; }
      if (!draft || !draft.up || draft.up.kind !== kind || (draft.editId || null) !== (editId || null)) {
        if (!editId) draft = { up: blankUp(kind), editId: null };
      }
      var up = draft.up;
      el.appendChild(topbar((editId ? 'なおす：' : '作る：') + info.label, editId ? '◀ つくった問題' : '◀ えらびなおす', editId ? '#/my' : '#/make'));
      var main = h('main', 'mk mk-edit mk-k-' + kind);
      main.style.setProperty('--kc', info.color);
      el.appendChild(main);

      var keyTarget = null;  // 数字キーの入力先 {field, key, maxDec}
      var numFields = [];
      var msgEl = h('div', 'mk-msg');
      msgEl.setAttribute('role', 'status');
      var ansEl = h('div', 'mk-answer');
      var refresh = function () {};
      var pads = {};

      function say(msg) { msgEl.textContent = msg || ''; msgEl.classList.toggle('show', !!msg); }
      function selectField(nf) {
        keyTarget = nf;
        numFields.forEach(function (f) { f.field.focus(f === nf); });
      }
      function addField(opts) {
        var nf = { field: NumField({ label: opts.label, value: up[opts.key], cls: opts.cls }), key: opts.key, maxDec: opts.maxDec || 3, maxInt: opts.maxInt || 3 };
        nf.field.el.addEventListener('click', function () { selectField(nf); say(''); });
        numFields.push(nf);
        return nf;
      }
      function onKey(k) {
        if (!keyTarget) { say('入れたいところを先にタップしてね。'); return; }
        var r = applyKey(String(up[keyTarget.key] || ''), k, keyTarget.maxDec, keyTarget.maxInt);
        say(r.err || '');
        up[keyTarget.key] = r.val;
        keyTarget.field.set(r.val);
        keyTarget.field.el.classList.remove('mk-need-f');
        changed();
      }
      function onDocKey(e) {
        var t = e.target;
        if (t && (t.tagName === 'TEXTAREA' || t.tagName === 'INPUT')) return;
        if (!numFields.length || document.querySelector('.mk-modal-back, .modal-back')) return;
        if (/^[0-9.]$/.test(e.key)) { onKey(e.key); e.preventDefault(); }
        else if (e.key === 'Backspace') { onKey('←'); e.preventDefault(); }
        else if (e.key === 'Tab' && numFields.length > 1) {
          var i = numFields.indexOf(keyTarget);
          selectField(numFields[(i + 1) % numFields.length]); e.preventDefault();
        }
      }
      document.addEventListener('keydown', onDocKey);
      cleanups.push(function () { document.removeEventListener('keydown', onDocKey); });

      var top = h('div', 'mk-top');
      main.appendChild(top);
      var left = h('section', 'mk-card mk-left');
      var right = h('section', 'mk-card mk-right');
      top.appendChild(left); top.appendChild(right);

      /* --- 種類ごと --- */
      if (kind === 'hissan') {
        left.appendChild(h('h2', 'mk-h', '① たし算かひき算かをえらぶ　② 数を入れる'));
        var seg = h('div', 'mk-seg');
        var bAdd = button('たし算 ＋', 'mk-seg-btn', function () { setOp('+'); });
        var bSub = button('ひき算 −', 'mk-seg-btn', function () { setOp('-'); });
        seg.appendChild(bAdd); seg.appendChild(bSub);
        left.appendChild(seg);
        var fa = addField({ key: 'a', maxDec: 2, cls: 'mk-num-h' });
        var fb = addField({ key: 'b', maxDec: 2, cls: 'mk-num-h' });
        var opEl = h('div', 'mk-h-op');
        var grid = h('div', 'mk-hissan');
        grid.appendChild(h('div', 'mk-h-op'));
        grid.appendChild(fa.field.el);
        grid.appendChild(opEl);
        grid.appendChild(fb.field.el);
        grid.appendChild(h('div', 'mk-h-line'));
        grid.appendChild(h('div', 'mk-h-op'));
        var hAns = h('div', 'mk-h-ans');
        grid.appendChild(hAns);
        left.appendChild(grid);
        var swap = withIcon(button('', 'small mk-swap', function () {
          var t = up.a; up.a = up.b; up.b = t; fa.field.set(up.a); fb.field.set(up.b); say(''); changed();
        }), 'swap', '2つの数を入れかえる');
        left.appendChild(swap);
        var setOp = function (op) {
          up.op = op;
          bAdd.classList.toggle('on', op === '+'); bSub.classList.toggle('on', op === '-');
          opEl.textContent = op === '-' ? '−' : '＋';
          say(''); changed();
        };
        refresh = function () {
          bAdd.classList.toggle('on', up.op !== '-'); bSub.classList.toggle('on', up.op === '-');
          opEl.textContent = up.op === '-' ? '−' : '＋';
          var a = hissanAns(up);
          var neg = a != null && a.charAt(0) === '-';
          hAns.textContent = a == null ? '' : neg ? '？' : a;
          swap.hidden = !(up.op === '-' && neg);
          setAnswer(a == null ? '' : neg ? '' : a, neg ? 'ひかれる数のほうが小さいよ。「2つの数を入れかえる」をおそう。' : '');
        };
        selectField(up.a ? fb : fa);
      } else if (kind === 'compare') {
        left.appendChild(h('h2', 'mk-h', 'くらべる2つの数を入れよう'));
        var ca = addField({ key: 'a', cls: 'mk-num-c', maxInt: 4 });
        var cb = addField({ key: 'b', cls: 'mk-num-c', maxInt: 4 });
        var row = h('div', 'mk-compare');
        var symEl = h('div', 'mk-c-sym', '□');
        row.appendChild(ca.field.el); row.appendChild(symEl); row.appendChild(cb.field.el);
        left.appendChild(row);
        left.appendChild(h('p', 'mk-tip', '□には ＞・＜・＝ のどれかが入るよ。ともだちはそれをえらんで答えるよ。'));
        refresh = function () {
          var ok = N.valid(up.a) && N.valid(up.b);
          symEl.textContent = ok ? sym(N.cmp(up.a, up.b)) : '□';
          symEl.classList.toggle('done', ok);
          setAnswer(ok ? answerText(up) : '');
        };
        selectField(up.a ? cb : ca);
      } else if (kind === 'fill') {
        pads.q = InkPad({ w: INK.q.w, h: INK.q.h, ink: up.q, label: '問題文', note: '（手で書こう）', cls: 'mk-pad-q', placeholder: 'ここに問題文を書こう。答えのところは □ にしてね。', lineWidth: 4.5 });
        pads.q.onChange(function () { up.q = pads.q.isEmpty() ? null : pads.q.ink(); pads.q.flag(false); changed(); });
        cleanups.push(pads.q.destroy);
        left.appendChild(pads.q.el);
      } else if (kind === 'masu') {
        buildMasu(left, right);
      } else if (kind === 'numberline') {
        buildLine(left, right);
      }

      /* 右側：数字キー（数を入れる種類） */
      if (kind === 'hissan' || kind === 'compare' || kind === 'fill') {
        if (kind === 'fill') {
          right.appendChild(h('h2', 'mk-h', '答え'));
          var fAns = addField({ key: 'answer', cls: 'mk-num-ans', label: '数', maxInt: 4 });
          var unitWrap = h('div', 'mk-units');
          var ubtns = UNITS.map(function (u) {
            var b = button(u[1], 'mk-unit', function () { up.unit = u[0]; markUnits(); changed(); });
            unitWrap.appendChild(b);
            return b;
          });
          var markUnits = function () { ubtns.forEach(function (b, i) { b.classList.toggle('on', UNITS[i][0] === (up.unit || '')); }); };
          var ansRow = h('div', 'mk-ans-row');
          ansRow.appendChild(fAns.field.el);
          var unitShow = h('span', 'mk-unit-show');
          ansRow.appendChild(unitShow);
          right.appendChild(ansRow);
          right.appendChild(h('div', 'mk-sub', '単位'));
          right.appendChild(unitWrap);
          refresh = function () { markUnits(); unitShow.textContent = up.unit || ''; ansEl.hidden = true; };
          selectField(fAns);
        }
        if (kind === 'fill') right.appendChild(msgEl);
        right.appendChild(keypad(onKey));
      }
      if (kind !== 'fill') left.appendChild(msgEl);
      if (kind !== 'fill') left.appendChild(ansEl);

      /* --- ヒント・名前 --- */
      var bottom = h('div', 'mk-bottom');
      pads.hint = InkPad({ w: INK.hint.w, h: INK.hint.h, ink: up.hint, label: 'ヒント', note: '（なくてもいいよ）', cls: 'mk-pad-hint', placeholder: 'こまったときのヒントを書けるよ', lineWidth: 4.5 });
      pads.hint.onChange(function () { up.hint = pads.hint.isEmpty() ? null : pads.hint.ink(); changed(); });
      pads.author = InkPad({ w: INK.author.w, h: INK.author.h, ink: up.author, label: '作った人の名前', note: '（かならず）', cls: 'mk-pad-name', placeholder: '名前を書いてね', compact: true, lineWidth: 4 });
      pads.author.onChange(function () { up.author = pads.author.isEmpty() ? null : pads.author.ink(); pads.author.flag(false); changed(); });
      cleanups.push(pads.hint.destroy, pads.author.destroy);
      var hb = h('section', 'mk-card mk-hint-card'); hb.appendChild(pads.hint.el);
      var nb = h('section', 'mk-card mk-name-card'); nb.appendChild(pads.author.el);
      bottom.appendChild(hb); bottom.appendChild(nb);
      main.appendChild(bottom);

      /* --- 下のバー：長さの目安・ためしに解く --- */
      var foot = h('div', 'mk-foot');
      var meter = h('div', 'mk-meter');
      var meterBar = h('div', 'mk-meter-bar'), meterFill = h('div', 'mk-meter-fill'), meterText = h('span', 'mk-meter-text');
      meterBar.appendChild(meterFill);
      meter.appendChild(h('span', 'mk-meter-label', 'リンクの長さ'));
      meter.appendChild(meterBar); meter.appendChild(meterText);
      if (!share() || !share().encode) meter.hidden = true;
      var footMsg = h('div', 'mk-foot-msg');
      var goBtn = button('ためしに解く ▶', 'primary mk-go', tryIt);
      foot.appendChild(meter); foot.appendChild(footMsg); foot.appendChild(goBtn);
      main.appendChild(foot);

      var tooLong = false, measureTimer = null, measureSeq = 0;
      function measure() {
        var sh = share();
        if (!sh || !sh.encode) return;
        var seq = ++measureSeq;
        // とちゅうの問題でも長さを測れるように、足りないところは仮の値で埋める（長さは絵でほぼ決まる）
        var test = clone(finalUp(up));
        var dot = function (w, hh) { return { w: w, h: hh, strokes: [[{ x: 10, y: 10 }, { x: 20, y: 20 }]] }; };
        if (!inkHasStrokes(test.author)) test.author = dot(INK.author.w, INK.author.h);
        if (test.kind === 'fill' && !inkHasStrokes(test.q)) test.q = dot(INK.q.w, INK.q.h);
        ['a', 'b', 'answer'].forEach(function (k) { if (k in test && !N.valid(test[k])) test[k] = '1'; });
        if (test.kind === 'hissan' && N.cmp(test.a, test.b) < 0) { var t0 = test.a; test.a = test.b; test.b = t0; }
        if (test.kind === 'numberline' && !test.arrows.length) test.arrows = [test.min];
        var max = sh.MAX_LEN || 6000;
        var p;
        try { p = sh.encode(test); } catch (e) { p = Promise.reject(e); }
        Promise.resolve(p).then(function (token) {
          if (!alive || seq !== measureSeq) return;
          showMeter(String(token || '').length, max, false);
        }, function (err) {
          if (!alive || seq !== measureSeq) return;
          var m = String(err && (err.code || err.message) || err);
          if (/TOO_LONG/i.test(m)) showMeter(max + 1, max, true);
          // それ以外（とちゅうの問題で検証に通らない等）は表示を変えない
        });
      }
      function showMeter(len, max, over) {
        var r = len / max;
        tooLong = over || r > 1;
        meterFill.style.width = Math.min(100, Math.round(r * 100)) + '%';
        meter.classList.toggle('mid', !tooLong && r >= 0.7);
        meter.classList.toggle('full', tooLong);
        meterText.textContent = tooLong ? 'いっぱい！もう少し短く書こう' : r >= 0.7 ? 'そろそろいっぱい' : 'もう少し書ける';
      }
      function changed() {
        refresh();
        footMsg.textContent = '';
        if (measureTimer) clearTimeout(measureTimer);
        measureTimer = setTimeout(measure, 600);
      }
      cleanups.push(function () { if (measureTimer) clearTimeout(measureTimer); });

      function setAnswer(text, warn) {
        ansEl.innerHTML = '';
        ansEl.hidden = false;
        if (warn) { ansEl.appendChild(h('span', 'mk-answer-warn', warn)); return; }
        ansEl.appendChild(h('span', 'mk-answer-label', '答え：'));
        if (text) {
          ansEl.appendChild(h('span', 'mk-answer-val', text));
          ansEl.appendChild(h('span', 'mk-answer-note', '（アプリが計算したよ）'));
        } else {
          ansEl.appendChild(h('span', 'mk-answer-note', kind === 'numberline' ? '↑をおくと、アプリが答えを出すよ' : kind === 'masu' ? '水を入れると、アプリが答えを出すよ' : '数を入れると、アプリが答えを出すよ'));
        }
      }

      function tryIt() {
        var errs = problems(up);
        main.querySelectorAll('.mk-need-f').forEach(function (e) { e.classList.remove('mk-need-f'); });
        if (errs.length) {
          footMsg.textContent = errs[0].msg + (errs.length > 1 ? '（ほかにも ' + (errs.length - 1) + 'つ）' : '');
          errs.forEach(function (er) {
            if (er.where === 'author') pads.author.flag(true);
            if (er.where === 'q' && pads.q) pads.q.flag(true);
            numFields.forEach(function (f) { if (f.key === er.where) f.field.el.classList.add('mk-need-f'); });
          });
          var first = errs[0].where;
          var target = first === 'author' ? pads.author.el : first === 'q' && pads.q ? pads.q.el : null;
          numFields.forEach(function (f) { if (f.key === first) { target = f.field.el; selectField(f); } });
          if (first !== 'author' && first !== 'q') say(errs[0].msg);
          if (target && target.scrollIntoView) target.scrollIntoView({ block: 'center', behavior: 'smooth' });
          return;
        }
        if (tooLong) { footMsg.textContent = 'リンクが長すぎるよ。問題文やヒントを、もう少し短く書こう。'; return; }
        var sh = share();
        if (sh && sh.validate) {
          var v;
          try { v = sh.validate(finalUp(up)); } catch (e) { v = { ok: false, error: String(e) }; }
          if (v && v.ok === false) {
            console.warn('Share.validate', v.error);
            footMsg.textContent = 'この問題はまだ作れないみたい。もう一度たしかめてね。';
            return;
          }
        }
        viewTry(kind, editId);
      }

      /* ますの図 */
      function buildMasu(left, right) {
        left.appendChild(h('h2', 'mk-h', 'ますの図（プレビュー）'));
        var fig = h('div', 'mk-fig mk-fig-masu');
        left.appendChild(fig);
        right.appendChild(h('h2', 'mk-h', 'ますに水を入れよう'));
        var lv = h('div', 'mk-seg');
        var b2 = button('0.01Lまで', 'mk-seg-btn', function () { setLevel(2); });
        var b3 = button('0.001Lまで', 'mk-seg-btn', function () { setLevel(3); });
        lv.appendChild(b2); lv.appendChild(b3);
        right.appendChild(lv);
        var rows = h('div', 'mk-steps');
        right.appendChild(rows);
        function setLevel(n) {
          if (up.level === n) return;
          if (n === 3) { up.d3 = 0; } else { up.d3 = 0; }
          up.level = n; buildRows(); changed();
        }
        function stepRow(label, key, max, color) {
          var r = h('div', 'mk-step');
          var lab = h('div', 'mk-step-label');
          lab.innerHTML = label;
          r.appendChild(lab);
          var minus = button('−', 'mk-round', function () { if (up[key] > 0) { up[key]--; upd(); changed(); } });
          var val = h('span', 'mk-step-val');
          if (color) val.style.background = color;
          var plus = button('＋', 'mk-round', function () { if (up[key] < max) { up[key]++; upd(); changed(); } else say(max === 3 ? '1Lますは3こまでにしよう。' : '9こまでだよ。10こになったら、1つ上の大きいますにしよう。'); });
          minus.setAttribute('aria-label', 'へらす'); plus.setAttribute('aria-label', 'ふやす');
          function upd() { val.textContent = up[key] || 0; minus.disabled = !(up[key] > 0); }
          upd();
          r.appendChild(minus); r.appendChild(val); r.appendChild(plus);
          return r;
        }
        function buildRows() {
          rows.innerHTML = '';
          b2.classList.toggle('on', up.level !== 3); b3.classList.toggle('on', up.level === 3);
          var pc = function (p) { return S.Figures && S.Figures.util ? S.Figures.util.placeColor(p) : '#fff'; };
          rows.appendChild(stepRow('1Lます', 'L', 3, pc(0)));
          rows.appendChild(stepRow('0.1Lます', 'd1', 9, pc(-1)));
          if (up.level === 3) {
            rows.appendChild(stepRow('0.01Lます', 'd2', 9, pc(-2)));
            rows.appendChild(stepRow('0.001L<small>（0.01Lますの目もり）</small>', 'd3', 9, pc(-3)));
          } else {
            rows.appendChild(stepRow('0.01L<small>（0.1Lますの目もり）</small>', 'd2', 9, pc(-2)));
          }
        }
        buildRows();
        refresh = function () {
          fig.innerHTML = '';
          if (S.Figures) fig.appendChild(S.Figures.render({ kind: 'masu', unit: 'L', level: up.level, L: up.L, d1: up.d1, d2: up.d2, d3: up.level === 3 ? up.d3 : 0 }));
          var a = masuAns(up);
          setAnswer(N.cmp(a, '0') === 0 ? '' : a + ' L');
        };
      }

      /* 数直線 */
      function buildLine(left, right) {
        right.remove();
        top.classList.add('mk-top-wide');
        left.appendChild(h('h2', 'mk-h', '① はんいをえらぶ'));
        var chips = h('div', 'mk-chips');
        var cbtns = LINES.map(function (L) {
          var b = button('', 'mk-chip', function () {
            if (up.min === L.min && up.max === L.max && up.step === L.step) return;
            up.min = L.min; up.max = L.max; up.step = L.step; up.labelEvery = 10; up.arrows = [];
            say(''); changed();
          });
          b.appendChild(h('b', null, L.label));
          b.appendChild(h('small', null, L.sub));
          chips.appendChild(b);
          return b;
        });
        left.appendChild(chips);
        left.appendChild(h('h2', 'mk-h', '② 目もりをタップして ↑ をおく（1〜3本。もう一度タップで消える）'));
        var fig = h('div', 'mk-fig mk-fig-line');
        left.appendChild(fig);
        var D = 0, minI = 0, stI = 1, ticks = [];
        fig.addEventListener('click', function (e) {
          var svg = fig.querySelector('svg');
          if (!svg || !ticks.length || !svg.getScreenCTM) return;
          var m = svg.getScreenCTM();
          if (!m) return;
          var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
          var x = pt.matrixTransform(m.inverse()).x;
          var best = 0, bd = Infinity;
          ticks.forEach(function (tx, i) { var d = Math.abs(tx - x); if (d < bd) { bd = d; best = i; } });
          var gapPx = ticks.length > 1 ? Math.abs(ticks[1] - ticks[0]) : 50;
          if (bd > Math.max(gapPx * 0.6, 14)) return;
          var v = N.fromInt(minI + best * stI, D);
          var arr = up.arrows || [];
          var idx = -1;
          arr.forEach(function (a, i) { if (N.cmp(a, v) === 0) idx = i; });
          if (idx >= 0) { arr.splice(idx, 1); say(''); }
          else if (arr.length >= 3) { say('↑は3本までだよ。消したい↑の目もりを、もう一度タップしてね。'); return; }
          else { arr.push(v); say(''); }
          up.arrows = arr;
          changed();
        });
        refresh = function () {
          cbtns.forEach(function (b, i) { var L = LINES[i]; b.classList.toggle('on', up.min === L.min && up.max === L.max && up.step === L.step); });
          D = Math.max(N.scale(up.step), N.scale(up.min), N.scale(up.max));
          minI = N.toInt(up.min, D); stI = N.toInt(up.step, D);
          fig.innerHTML = '';
          var arrows = sortedArrows(up).map(function (v, i) { return { v: parseFloat(v), label: ARROW_NAMES[i] }; });
          if (S.Figures) {
            var svg = S.Figures.render({ kind: 'numberline', min: parseFloat(up.min), max: parseFloat(up.max), step: parseFloat(up.step), labelEvery: up.labelEvery || 10, arrows: arrows });
            fig.appendChild(svg);
            ticks = [];
            var lines = svg.querySelectorAll ? svg.querySelectorAll('line') : [];
            for (var i = 1; i < lines.length; i++) {
              if (lines[i].getAttribute('stroke') !== '#222') continue;
              if (lines[i].getAttribute('x1') !== lines[i].getAttribute('x2')) continue;
              ticks.push(parseFloat(lines[i].getAttribute('x1')));
            }
          }
          setAnswer(arrows.length ? answerText(up) : '');
        };
      }

      refresh();
      changed();
    }

    /* 保存・送信用に整える */
    function finalUp(up) {
      var o = { v: 1, kind: up.kind, author: up.author, hint: inkHasStrokes(up.hint) ? up.hint : null };
      var aid = deviceId();
      if (aid) o.aid = aid; // 作った端末（ともだちの問題で「作った人」を区別する）
      if (up.kind === 'hissan') { o.op = up.op === '-' ? '-' : '+'; o.a = up.a; o.b = up.b; }
      if (up.kind === 'fill') { o.q = up.q; o.answer = up.answer; o.unit = up.unit || ''; }
      if (up.kind === 'compare') { o.a = up.a; o.b = up.b; }
      if (up.kind === 'masu') { o.level = up.level === 3 ? 3 : 2; o.L = up.L | 0; o.d1 = up.d1 | 0; o.d2 = up.d2 | 0; o.d3 = o.level === 3 ? (up.d3 | 0) : 0; }
      if (up.kind === 'numberline') { o.min = up.min; o.max = up.max; o.step = up.step; o.labelEvery = up.labelEvery || 10; o.arrows = sortedArrows(up); } // あ・い・う は小さい順
      return o;
    }

    /* ===== 3. ためしに解く ===== */
    function viewTry(kind, editId) {
      clear();
      var up = finalUp(draft.up);
      var info = kindInfo(kind);
      var right = button('できあがり ▶', 'primary mk-bar-go', function () { viewDone(kind, editId); });
      el.appendChild(topbar('ためしに解く：' + info.label, '◀ なおす', function () { viewEdit(kind, editId); }, right));
      var main = h('main', 'mk mk-try');
      main.appendChild(h('p', 'mk-lead', '自分の問題を解いてみよう。まちがいを見つけたら「なおす」で直せるよ。'));
      var card = h('section', 'mk-card mk-try-card');
      var area = h('div', 'mk-try-area');
      card.appendChild(area);
      main.appendChild(card);
      var foot = h('div', 'mk-try-foot');
      foot.appendChild(button('◀ なおす', '', function () { viewEdit(kind, editId); }));
      foot.appendChild(button('できあがり ▶', 'primary mk-go', function () { viewDone(kind, editId); }));
      main.appendChild(foot);
      el.appendChild(main);
      var sh = share();
      if (!sh || !sh.toProblem || !S.Problems) {
        area.appendChild(h('div', 'empty-note', 'ためしに解く画面は、いま使えません。「できあがり」に進んでね。'));
        return;
      }
      var handle = null;
      try {
        var p = sh.toProblem(up);
        handle = S.Problems.render(area, p, {
          onResult: function () {},
          onNext: function () { viewDone(kind, editId); }
        });
      } catch (e) {
        console.error('toProblem', e);
        area.appendChild(h('div', 'empty-note', 'この問題をひょうじできませんでした。「なおす」でたしかめてね。'));
      }
      cleanups.push(function () { if (handle && handle.destroy) handle.destroy(); });
    }

    /* リンクを作る（encode） */
    function encodeUp(up) {
      var sh = share();
      if (!sh || !sh.encode) return Promise.reject(new Error('NO_SHARE'));
      try { return Promise.resolve(sh.encode(up)); } catch (e) { return Promise.reject(e); }
    }
    function urlOf(token) {
      var sh = share();
      if (sh && sh.url) return sh.url(token);
      return location.origin + location.pathname + '#/q/' + token;
    }
    function encodeErr(err, msgEl) {
      var m = String(err && (err.code || err.message) || err);
      console.warn('Share.encode', err);
      var t = /TOO_LONG/i.test(m) ? 'リンクが長すぎるよ。問題文やヒントを、もう少し短く書こう。' : 'リンクを作れませんでした。';
      if (msgEl) msgEl.textContent = t; else toast(t);
    }
    /* リンクをコピー。失敗したら textarea に出して全選択 */
    function copyLink(up, holder) {
      return encodeUp(up).then(function (token) {
        var url = urlOf(token);
        function fallback() {
          holder.innerHTML = '';
          holder.hidden = false;
          holder.appendChild(h('div', 'mk-linkbox-msg', 'うまくコピーできなかったよ。下のリンクがえらばれているので、Ctrl＋C でコピーしてね。'));
          var ta = h('textarea', 'mk-linkbox-ta');
          ta.value = url; ta.readOnly = true; ta.rows = 3;
          ta.addEventListener('focus', function () { ta.select(); });
          holder.appendChild(ta);
          setTimeout(function () { ta.focus(); ta.select(); }, 30);
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          return navigator.clipboard.writeText(url).then(function () {
            toast('リンクをコピーしたよ。Teams や Classroom にはりつけてね。');
            holder.hidden = true;
            made(up, token);
          }, function () { fallback(); made(up, token); });
        }
        fallback();
        made(up, token);
      }, function (err) { encodeErr(err); });
    }
    // 問題を作った（ほぞん・リンクのコピー）。星は同じ token で1回だけ（担当Hの Stars が判定）
    function made(up, token) {
      starLog('made', { kind: up.kind, token: token });
    }
    // 自分の問題を「みんなに見せる」
    function showToAll(up) {
      return encodeUp(up).then(function (token) {
        starLog('present', { token: token });
        location.hash = '#/q/' + token;
      }, function (err) { encodeErr(err); });
    }

    /* ===== 4. できあがり ===== */
    function viewDone(kind, editId) {
      clear();
      var up = finalUp(draft.up);
      var info = kindInfo(kind);
      el.appendChild(topbar('できあがり！', '◀ ためしに解く', function () { viewTry(kind, editId); }));
      var main = h('main', 'mk mk-done');
      main.style.setProperty('--kc', info.color);
      var card = h('section', 'mk-card mk-done-card');
      card.appendChild(h('div', 'mk-done-title', '問題ができたね！'));
      var sum = h('div', 'mk-done-sum');
      sum.appendChild(h('span', 'mk-badge', info.label));
      sum.appendChild(h('span', 'mk-done-ans', '答え：' + answerText(up)));
      card.appendChild(sum);
      var who = h('div', 'mk-done-who');
      who.appendChild(h('span', 'mk-sub', '作った人'));
      var nameImg = h('span', 'mk-name-img');
      nameImg.appendChild(drawInk(up.author, { width: 260, height: 78, trim: true, lineWidth: 6 }));
      who.appendChild(nameImg);
      card.appendChild(who);

      var acts = h('div', 'mk-done-acts');
      var bShow = button('', 'mk-big-act act-show', function () { draft.shown = true; showToAll(up); });
      bShow.innerHTML = '<span class="mk-act-t">みんなに見せる</span><small>大きな画面に問題を出す</small>';
      var linkBox = h('div', 'mk-linkbox'); linkBox.hidden = true;
      var bCopy = button('', 'mk-big-act act-copy', function () { copyLink(up, linkBox); });
      bCopy.innerHTML = '<span class="mk-act-t">リンクをコピー</span><small>Teams・Classroom にはって送る</small>';
      var saved = h('div', 'mk-saved');
      var bSave = button('', 'mk-big-act act-save', function () {
        var st = store();
        if (!st || !st.mySave) { toast('この端末にはほぞんできません。'); return; }
        try {
          var id = st.mySave(up, editId || undefined);
          if (!id) { toast('ほぞんできませんでした。この端末の空きがないかもしれません。'); return; }
          editId = id;
          draft.editId = editId;
          encodeUp(up).then(function (token) { made(up, token); }, function () {});
          bSave.classList.add('done');
          bSave.querySelector('small').textContent = 'ほぞんしたよ！';
          saved.innerHTML = '';
          saved.appendChild(link('つくった問題の一覧を見る ▶', 'btn small', '#/my'));
          toast('ほぞんしたよ');
        } catch (e) {
          console.error('mySave', e);
          toast('ほぞんできませんでした');
        }
      });
      bSave.innerHTML = '<span class="mk-act-t">ほぞん</span><small>' + (editId ? 'なおした問題を上書きする' : 'この端末の「つくった問題」に入れる') + '</small>';
      acts.appendChild(bShow); acts.appendChild(bCopy); acts.appendChild(bSave);
      card.appendChild(acts);
      card.appendChild(linkBox);
      card.appendChild(saved);
      main.appendChild(card);
      var more = h('div', 'mk-done-more');
      more.appendChild(button('◀ もう一度なおす', '', function () { viewEdit(kind, editId); }));
      more.appendChild(button('べつの問題を作る', '', function () { draft = null; if (location.hash === '#/make') viewChoose(); else location.hash = '#/make'; }));
      main.appendChild(more);
      el.appendChild(main);
    }

    /* ===== 5. つくった問題 ===== */
    function viewMy() {
      clear();
      el.appendChild(topbar('つくった問題', '◀ ホーム', '#/', link('＋ 新しく作る', 'btn back', '#/make')));
      var main = h('main', 'mk mk-my');
      el.appendChild(main);
      var st = store();
      var list = [];
      try { list = st && st.myList ? st.myList() : []; } catch (e) { console.error(e); }
      if (!list.length) {
        var em = h('div', 'empty-note mk-empty');
        em.appendChild(h('div', null, 'まだないよ。問題を作って「ほぞん」すると、ここにならぶよ。'));
        em.appendChild(link('もんだいをつくる', 'btn primary', '#/make'));
        main.appendChild(em);
        return;
      }
      list = list.slice().sort(function (a, b) { return (b.updated || b.created || 0) - (a.updated || a.created || 0); });
      var ul = h('div', 'mk-list');
      list.forEach(function (it) {
        var up = it.up || {};
        var info = kindInfo(up.kind) || { label: '？', color: '#888' };
        var row = h('div', 'mk-row');
        row.style.setProperty('--kc', info.color);
        row.appendChild(h('span', 'mk-badge', info.label));
        var nm = h('span', 'mk-row-name');
        if (up.author) nm.appendChild(drawInk(up.author, { width: 150, height: 44, trim: true, lineWidth: 6 }));
        row.appendChild(nm);
        var mid = h('span', 'mk-row-mid');
        mid.appendChild(h('span', 'mk-row-ans', '答え：' + answerText(up)));
        mid.appendChild(h('span', 'mk-row-date', fmtDate(it.created) + ' に作った' + (it.updated && it.updated !== it.created ? '（' + fmtDate(it.updated) + ' になおした）' : '')));
        row.appendChild(mid);
        var acts = h('span', 'mk-row-acts');
        var lb = h('div', 'mk-linkbox mk-row-linkbox'); lb.hidden = true;
        acts.appendChild(button('みせる', 'small primary', function () { showToAll(up); }));
        acts.appendChild(button('リンク', 'small', function () { copyLink(up, lb); }));
        acts.appendChild(link('なおす', 'btn small', '#/edit/' + encodeURIComponent(it.id)));
        acts.appendChild(button('けす', 'small danger', function () {
          confirmDialog('この問題をけします。もとにもどせないよ。いいですか？', 'けす', function () {
            try { st.myDelete(it.id); } catch (e) { console.error(e); }
            if (draft && draft.editId === it.id) draft = null;
            toast('けしました');
            viewMy();
          });
        }));
        row.appendChild(acts);
        ul.appendChild(row);
        ul.appendChild(lb);
      });
      main.appendChild(ul);
    }

    /* ===== 6. なおす ===== */
    function viewEditSaved(id) {
      var st = store(), found = null;
      try { (st && st.myList ? st.myList() : []).forEach(function (it) { if (String(it.id) === String(id)) found = it; }); } catch (e) {}
      if (!found || !found.up || !kindInfo(found.up.kind)) {
        clear();
        el.appendChild(topbar('なおす', '◀ つくった問題', '#/my'));
        var m = h('main', 'mk');
        m.appendChild(h('div', 'empty-note', 'この問題は見つかりませんでした。'));
        el.appendChild(m);
        return;
      }
      if (!draft || draft.editId !== found.id) {
        var up = Object.assign(blankUp(found.up.kind), clone(found.up));
        if (up.kind === 'numberline') up.arrows = (up.arrows || []).map(String);
        draft = { up: up, editId: found.id };
      }
      if (draft.shown) { draft.shown = false; viewDone(found.up.kind, found.id); }
      else viewEdit(found.up.kind, found.id);
    }

    /* ルート */
    try {
      if (parts[0] === 'my') viewMy();
      else if (parts[0] === 'edit' && parts[1]) viewEditSaved(decodeURIComponent(parts[1]));
      else if (parts[0] === 'make' && parts[1] && kindInfo(parts[1])) {
        // 「みんなに見せる」からもどってきたときは、作りかけ（ほぞん後も）をそのまま開く
        if (draft && draft.up && draft.up.kind === parts[1]) {
          if (draft.shown) { draft.shown = false; viewDone(parts[1], draft.editId); }
          else viewEdit(parts[1], draft.editId);
        } else viewEdit(parts[1], null);
      }
      else {
        if (draft && draft.editId) draft = null; // ほぞんずみなら、えらぶ画面では作りかけにしない
        viewChoose();
      }
    } catch (e) {
      console.error('Maker', e);
      el.appendChild(h('div', 'empty-note', '画面を表示できませんでした。'));
    }

    return {
      destroy: function () {
        alive = false;
        clear();
        document.querySelectorAll('.mk-modal-back').forEach(function (m) { m.remove(); });
      }
    };
  }

  S.Maker = { mount: mount, kinds: KINDS.map(function (k) { return { id: k.id, label: k.label }; }), _answerText: answerText };
})(window.Shosu = window.Shosu || {});

</script>
<script>/* js/planner.js */
/* Shosu.Planner — じぶんで計画（担当L）
 * ゴール（先生が決めた日）から逆算した「旅の地図」、今日の計画（1分で立てる）、めあての候補、ホームの「きょうの計画」。
 *
 *   Planner.goal() / setGoal(goal)              保存 'shosu.goal'（SHOSU_PRESET.goal が新しければ最初の goal() で上書き）
 *   Planner.settings() / setSettings(o)         {extraMinutes:0|10|15|20|30, extraDays:'everyday'|'weekdays'|[曜日]}
 *   Planner.ITEMS()                             アプリの中の学習の一覧（done(date) と stars つき）

      gt.appendChild(h('div', 'pl-goal-name', g.name));
      gt.appendChild(h('div', 'pl-goal-date', 'ゴールの日：' + dateLong(g.date)));
      head.appendChild(gt);
      var cnt = h('div', 'pl-goal-left');
      if (left > 0) { cnt.appendChild(h('span', 'pl-goal-left-s', 'あと')); cnt.appendChild(h('span', 'pl-goal-left-n', String(left))); cnt.appendChild(h('span', 'pl-goal-left-s', '日')); }
      else cnt.appendChild(h('span', 'pl-goal-left-s', left === 0 ? 'きょうがゴールの日' : 'ゴールの日はおわったよ'));
      head.appendChild(cnt);
      root0.appendChild(head);

      // 設定：授業のほかに使える時間
      var st = settings();
      var set = h('div', 'pl-panel pl-settings');
      var r1 = h('div', 'pl-set-row');
      r1.appendChild(h('span', 'pl-set-label', '授業のほかに使える時間（1日）'));
      EXTRA_MINUTES.forEach(function (m) {
        var b = h('button', 'pl-chip' + (st.extraMinutes === m ? ' on' : ''), m ? m + '分' : 'なし');
        b.type = 'button';
        b.setAttribute('aria-pressed', st.extraMinutes === m ? 'true' : 'false');
        b.addEventListener('click', function () { changeSettings({ extraMinutes: m }); });
        r1.appendChild(b);
      });
      set.appendChild(r1);
      var r2 = h('div', 'pl-set-row');
      r2.appendChild(h('span', 'pl-set-label', 'その日'));
      [['everyday', '毎日'], ['weekdays', '平日だけ']].forEach(function (x) {
        var on = st.extraDays === x[0];
        var b = h('button', 'pl-chip' + (on ? ' on' : ''), x[1]);
        b.type = 'button';
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
        b.disabled = !st.extraMinutes;
        b.addEventListener('click', function () { changeSettings({ extraDays: x[0] }); });
        r2.appendChild(b);
      });
      set.appendChild(r2);
      var acts = h('div', 'pl-set-acts');
      acts.appendChild(button('下書きを作り直す', 'pl-redraft', function () {
        var r = draft();
        if (r) { saveRoadmap(r); note = '下書きを作り直したよ'; open = null; render(); }
      }));
      var lo = leftovers(rm);
      var carry = button('のこりを次の日に回す' + (lo.length ? '（' + lo.length + 'こ）' : ''), 'pl-carry', function () {
        var res = carryOver(rm);
        if (res.roadmap) { saveRoadmap(res.roadmap); note = res.moved + 'こ を次の日からに回したよ' + (res.unplaced ? '（入りきらない ' + res.unplaced + 'こ は下にあるよ）' : ''); render(); }
      });
      carry.disabled = !lo.length;
      acts.appendChild(carry);
      set.appendChild(acts);
      if (note) { set.appendChild(h('div', 'pl-note', note)); note = ''; }
      root0.appendChild(set);

      // 航路
      var line = h('ol', 'pl-route');
      var days = rm.days.filter(function (d) { return d.date >= t; });
      var dateList = days.map(function (d) { return d.date; });
      if (!days.length) line.appendChild(h('li', 'pl-day pl-day-empty', '今日からゴールまでの、使える日がありません。授業のほかに使える時間をえらんでね。'));
      days.forEach(function (d, di) {
        var li = h('li', 'pl-day pl-day-' + d.type + (d.date === t ? ' pl-day-today' : ''));
        li.dataset.date = d.date;
        li.appendChild(h('span', 'pl-node'));
        var card = h('div', 'pl-day-card');
        var dh = h('div', 'pl-day-head');
        var dl = h('span', 'pl-day-date', (d.date === t ? '今日 ' : '') + dateShort(d.date));
        dh.appendChild(dl);
        dh.appendChild(typeBadge(d.type, d.lesson));
        if (d.note) dh.appendChild(h('span', 'pl-day-note', d.note));
        card.appendChild(dh);
        // あしたが「第○時」の授業なら、「みる」を見ておくおすすめ
        var nx = days[di + 1];
        if (nx && nx.type === 'class' && nx.lesson && diffDays(d.date, nx.date) === 1 && !(lessonInfo(nx.lesson).stars >= 3)) {
          card.appendChild(h('div', 'pl-tip', 'あしたは第' + nx.lesson + '時の授業。「みる」を先に見ておくといいよ'));
        }
        var list = h('div', 'pl-cards');
        d.items.forEach(function (id) {
          var it = items[id];
          if (!it) return;
          list.appendChild(itemCard(it, d, dateList));
        });
        var add = h('button', 'pl-add');
        add.type = 'button';
        add.setAttribute('aria-label', dateShort(d.date) + 'に学習をくわえる');
        add.appendChild(svg('plus'));
        add.appendChild(h('span', null, 'くわえる'));
        add.addEventListener('click', function () { openAdd(d.date); });
        list.appendChild(add);
        card.appendChild(list);
        card.appendChild(timeBar(minutesOf(d.items, items), d.minutes));
        if (d.date === t) {
          var undoneToday = d.items.filter(function (id) { return items[id] && !itemDone(items[id], d.date); });
          if (undoneToday.length && di < days.length - 1) {
            card.appendChild(button('今日ののこりを次の日に回す', 'small pl-carry-today', function () {
              var res = carryOver(rm, t);
              if (res.roadmap) { saveRoadmap(res.roadmap); note = res.moved + 'こ を次の日からに回したよ'; render(); }
            }));
          }
        }
        li.appendChild(card);
        line.appendChild(li);
      });
      var gl = h('li', 'pl-day pl-day-goal');
      gl.appendChild(h('span', 'pl-node pl-node-goal'));
      var gc = h('div', 'pl-day-card');
      var gh = h('div', 'pl-day-head');
      gh.appendChild(h('span', 'pl-day-date', dateShort(g.date)));
      var gb = h('span', 'pl-badge pl-badge-goal');
      gb.appendChild(svg('flag'));
      gb.appendChild(document.createTextNode('ゴール：' + g.name));
      gh.appendChild(gb);
      gc.appendChild(gh);
      gl.appendChild(gc);
      line.appendChild(gl);
      root0.appendChild(line);

      if (rm.unplaced.length) {
        var up = h('div', 'pl-panel pl-unplaced');
        up.appendChild(h('div', 'pl-unplaced-title', '入りきらなかった学習（タップして日をえらぼう）'));
        var ul = h('div', 'pl-cards');
        rm.unplaced.forEach(function (id) { if (items[id]) ul.appendChild(itemCard(items[id], null, dateList)); });
        up.appendChild(ul);
        root0.appendChild(up);
      }
      var foot = h('div', 'pl-row pl-foot');
      var tp = h('a', 'btn primary', '今日の計画を立てる ▶'); tp.href = '#/plan/today';
      foot.appendChild(arrows(tp));
      root0.appendChild(foot);
    }

    function itemCard(it, day, dateList) {
      var date = day ? day.date : null;
      var done = it.kind === 'lesson' ? itemDone(it) : (date ? itemDone(it, date) : false);
      var wrap = h('div', 'pl-card-wrap');
      var b = h('button', 'pl-card pl-k-' + it.kind + (done ? ' pl-card-done' : ''));
      b.type = 'button';
      var nm = h('span', 'pl-card-name', it.label);
      b.appendChild(nm);
      var ft = h('span', 'pl-card-foot');
      ft.appendChild(h('span', 'pl-card-min', '約' + it.minutes + '分'));
      if (done) { var dm = svg('star', 'pl-card-donemark'); dm.setAttribute('title', 'おわり'); ft.appendChild(dm); ft.appendChild(h('span', 'pl-card-donetext', 'おわり')); }
      b.appendChild(ft);
      var isOpen = open && open.id === it.id && open.date === date;
      b.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      b.addEventListener('click', function () { open = isOpen ? null : { id: it.id, date: date }; render(); });
      wrap.appendChild(b);
      if (isOpen) wrap.appendChild(cardMenu(it, date, dateList));
      return wrap;
    }
    function cardMenu(it, date, dateList) {
      var m = h('div', 'pl-menu');
      var row = h('div', 'pl-menu-row');
      var go = h('a', 'btn small primary', 'はじめる ▶'); go.href = it.href;
      row.appendChild(arrows(go));
      row.appendChild(button('けす', 'small danger', function () {
        update(function (rm) {
          if (date) rm.days.forEach(function (d) { if (d.date === date) { var i = d.items.indexOf(it.id); if (i >= 0) d.items.splice(i, 1); } });
          else rm.unplaced = rm.unplaced.filter(function (x) { return x !== it.id; });
        });
      }));
      row.appendChild(button('やめる', 'small', function () { open = null; render(); }));
      m.appendChild(row);
      m.appendChild(h('div', 'pl-menu-label', '別の日に動かす'));
      var dr = h('div', 'pl-menu-dates');
      dateList.forEach(function (ds) {
        if (ds === date) return;
        var b = h('button', 'pl-chip pl-chip-date', dateShort(ds));
        b.type = 'button';
        b.addEventListener('click', function () {
          update(function (rm) {
            if (date) rm.days.forEach(function (d) { if (d.date === date) { var i = d.items.indexOf(it.id); if (i >= 0) d.items.splice(i, 1); } });
            else rm.unplaced = rm.unplaced.filter(function (x) { return x !== it.id; });
            rm.days.forEach(function (d) { if (d.date === ds && d.items.indexOf(it.id) < 0) d.items.push(it.id); });
          });
        });
        dr.appendChild(b);
      });
      m.appendChild(dr);
      return m;
    }
    function update(fn) {
      var rm = roadmap();
      if (!rm) return;
      fn(rm);
      rm.edited = now().toISOString();
      saveRoadmap(rm);
      open = null;
      render();
    }
    function openAdd(date) {
      var body = h('div', 'pl-add-body');
      body.appendChild(h('p', 'pl-add-note', dateShort(date) + 'にくわえる学習をタップしてね'));
      var cur = (roadmap().days.filter(function (d) { return d.date === date; })[0] || { items: [] }).items;
      body.appendChild(pickerEl(function (id) { return cur.indexOf(id) >= 0; }, function (id) {
        update(function (rm) {
          rm.days.forEach(function (d) { if (d.date === date && d.items.indexOf(id) < 0) d.items.push(id); });
          rm.unplaced = rm.unplaced.filter(function (x) { return x !== id; });
        });
        if (dlg) dlg.close();
      }, date));
      dlg = modal('学習をくわえる', body, function () { dlg = null; });
    }
    function changeSettings(o) {
      setSettings(o);
      var r = draft();
      if (r) saveRoadmap(r);
      note = '使える時間にあわせて、下書きを作り直したよ';
      open = null;
      render();
    }
    render();
    return { destroy: function () { if (dlg) dlg.close(); if (root0.parentNode) root0.parentNode.removeChild(root0); } };
  }

  /* ---------- 今日の計画（1分で立てる） ---------- */
  function mountToday(el) {
    if (!hasDOM || !el) return { destroy: function () {} };
    var root0 = h('div', 'pl-root pl-today');
    el.appendChild(root0);
    var td = today();
    var prev = td.plan;
    var selected = prev ? prev.items.slice() : td.items.slice();
    var recommended = td.items.slice();
    var meate = prev && prev.meate ? (prev.meate.choices || []).slice(0, 2) : [];
    var showList = false;
    var pad = null;
    var padInk = prev && prev.meate ? prev.meate.ink : null;

    // 手書きは描き直しても消えないように、1つだけ作って使い回す
    var meateBox = h('div', 'pl-panel pl-meate');
    var candWrap = h('div', 'pl-cands');
    meateBox.appendChild(h('h3', 'pl-h', 'めあて'));
    meateBox.appendChild(h('p', 'pl-sub', 'えらぶ（2つまで）か、自分のことばで書こう。どちらも使えるよ'));
    meateBox.appendChild(candWrap);
    var inkLabel = h('div', 'pl-ink-label');
    inkLabel.appendChild(iconOr('pen', 'plus'));
    inkLabel.appendChild(document.createTextNode('自分のことばで書く（書かなくてもOK）'));
    meateBox.appendChild(inkLabel);
    pad = inkPad(110, padInk);
    meateBox.appendChild(pad.el);

    var topArea = h('div');
    var bottom = h('div', 'pl-row pl-start-row');
    root0.appendChild(topArea);
    root0.appendChild(meateBox);
    root0.appendChild(bottom);

    function render() {
      topArea.innerHTML = '';
      var items = itemMap();
      var head = h('div', 'pl-panel pl-today-head');
      var hl = h('div', 'pl-today-date');
      hl.appendChild(h('span', 'pl-today-day', '今日 ' + dateLong(td.date)));
      hl.appendChild(typeBadge(td.type, td.lesson));
      head.appendChild(hl);
      var g = goal();
      if (g) {
        var left = diffDays(td.date, g.date);
        if (left > 0) head.appendChild(h('div', 'pl-today-goal', g.name + 'まで あと' + left + '日'));
      }
      topArea.appendChild(head);

      var sec = h('div', 'pl-panel pl-todo');
      sec.appendChild(h('h3', 'pl-h', 'きょう やること'));
      var list = h('div', 'pl-todo-list');
      var shown = recommended.concat(selected.filter(function (id) { return recommended.indexOf(id) < 0; }));
      if (!shown.length) list.appendChild(h('div', 'pl-empty', td.type ? '地図には今日の予定がないよ。下の一覧からえらぼう' : '下の一覧から、やりたい学習をえらぼう'));
      shown.forEach(function (id) {
        var it = items[id];
        if (!it) return;
        var on = selected.indexOf(id) >= 0;
        var row = h('button', 'pl-todo-item' + (on ? ' on' : ''));
        row.type = 'button';
        row.setAttribute('role', 'checkbox');
        row.setAttribute('aria-checked', on ? 'true' : 'false');
        var box = h('span', 'pl-check');
        if (on) box.appendChild(svg('check'));
        row.appendChild(box);
        var nm = h('span', 'pl-todo-name', it.label);
        if (recommended.indexOf(id) >= 0) nm.appendChild(h('span', 'pl-tag', '地図のおすすめ'));
        row.appendChild(nm);
        row.appendChild(h('span', 'pl-todo-min', '約' + it.minutes + '分'));
        row.appendChild(starsRow(it.stars));
        row.addEventListener('click', function () { toggle(id); });
        list.appendChild(row);
      });
      sec.appendChild(list);
      var tg = button(showList ? '一覧をとじる' : 'ほかの学習を一覧からくわえる', 'pl-more' + (showList ? '' : ' pl-more-open'), function () { showList = !showList; render(); });
      if (!showList) tg.insertBefore(svg('plus'), tg.firstChild);
      sec.appendChild(tg);
      if (showList) sec.appendChild(pickerEl(function (id) { return selected.indexOf(id) >= 0; }, toggle, td.date));
      sec.appendChild(timeBar(minutesOf(selected, items), td.minutes));
      if (!td.minutes) sec.appendChild(h('div', 'pl-note-soft', '今日は使える時間が決まっていない日。できる分だけやろう'));
      topArea.appendChild(sec);

      // めあての候補
      candWrap.innerHTML = '';
      var cands = meateCandidates(selected);
      meate.forEach(function (m) { if (cands.indexOf(m) < 0) cands.unshift(m); });
      cands.forEach(function (c) {
        var on = meate.indexOf(c) >= 0;
        var b = h('button', 'pl-cand' + (on ? ' on' : ''));
        b.type = 'button';
        b.setAttribute('aria-pressed', on ? 'true' : 'false');
        var bx = h('span', 'pl-check pl-check-s');
        if (on) bx.appendChild(svg('check'));
        b.appendChild(bx);
        b.appendChild(h('span', null, c));
        b.disabled = !on && meate.length >= 2;
        b.addEventListener('click', function () {
          var i = meate.indexOf(c);
          if (i >= 0) meate.splice(i, 1); else if (meate.length < 2) meate.push(c);
          render();
        });
        candWrap.appendChild(b);
      });

      bottom.innerHTML = '';
      var start = button('スタート ▶', 'primary pl-start', function () {
        var tp = { date: td.date, items: selected.slice(), meate: { choices: meate.slice(), ink: pad ? pad.ink() : null }, started: now().toISOString() };
        savePlan(tp);
        try { if (S.Stars && S.Stars.log) S.Stars.log('plan', { date: td.date }); } catch (e) {}
        location.hash = '#/';
      });
      start.disabled = !selected.length;
      bottom.appendChild(start);
      var mp = h('a', 'btn', 'ゴールまでの地図を見る'); mp.href = '#/plan';
      bottom.appendChild(mp);
    }
    function toggle(id) {
      var i = selected.indexOf(id);
      if (i >= 0) selected.splice(i, 1); else selected.push(id);
      render();
    }
    render();
    return { destroy: function () { if (pad) pad.destroy(); if (root0.parentNode) root0.parentNode.removeChild(root0); } };
  }

  /* ---------- ホーム上部「きょうの計画」 ---------- */
  function todayPanel() {
    if (!hasDOM) return null;
    var date = todayStr();
    var p = plan(date);
    var box = h('section', 'pl-root pl-home');
    if (!p) {
      box.classList.add('pl-home-empty');
      var a = h('a', 'pl-home-make');
      a.href = '#/plan/today';
      a.appendChild(iconOr('rocket', 'flag', 'pl-home-make-ic'));
      var tx = h('span', 'pl-home-make-text');
      tx.appendChild(h('span', 'pl-home-make-title', '今日の計画を立てよう'));
      tx.appendChild(h('span', 'pl-home-make-sub', '1分でできるよ。やることと、めあてをきめよう'));
      a.appendChild(tx);
      a.appendChild(arrows(h('span', 'pl-home-make-go', 'たてる ▶')));
      box.appendChild(a);
      return box;
    }
    var items = itemMap();
    var head = h('div', 'pl-home-head');
    head.appendChild(h('h2', 'pl-home-title', 'きょうの計画'));
    var edit = h('a', 'btn small pl-home-edit', 'なおす'); edit.href = '#/plan/today';
    head.appendChild(edit);
    box.appendChild(head);
    var body = h('div', 'pl-home-body');
    var mt = h('div', 'pl-home-meate');
    mt.appendChild(h('span', 'pl-home-label', 'めあて'));
    var mtx = h('div', 'pl-home-meate-list');
    (p.meate && p.meate.choices || []).forEach(function (c) { mtx.appendChild(h('span', 'pl-home-meate-item', c)); });
    if (p.meate && p.meate.ink) {
      var cv = drawInk(p.meate.ink, 260, 48);
      cv.classList.add('pl-home-ink');
      mtx.appendChild(cv);
    }
    if (!mtx.childNodes.length) mtx.appendChild(h('span', 'pl-home-meate-none', '（めあては まだないよ）'));
    mt.appendChild(mtx);
    body.appendChild(mt);
    var ul = h('ul', 'pl-home-list');
    var nDone = 0;
    p.items.forEach(function (id) {
      var it = items[id];
      if (!it) return;
      var done = it.kind === 'lesson' ? itemDone(it) : itemDone(it, date);
      if (done) nDone++;
      var li = h('li');
      var a = h('a', 'pl-home-item' + (done ? ' done' : ''));
      a.href = it.href;
      var c = h('span', 'pl-check');
      if (done) c.appendChild(svg('check'));
      a.appendChild(c);
      a.appendChild(h('span', 'pl-home-item-name', it.label));
      a.appendChild(h('span', 'pl-home-item-min', done ? 'できた' : '約' + it.minutes + '分'));
      li.appendChild(a);
      ul.appendChild(li);
    });
    body.appendChild(ul);
    var side = h('div', 'pl-home-side');
    side.appendChild(h('div', 'pl-home-count', nDone + ' / ' + p.items.length + ' できた'));
    var rf = h('a', 'btn primary pl-home-reflect');
    rf.href = '#/reflect';
    rf.appendChild(iconOr('pen', 'check'));
    rf.appendChild(document.createTextNode('ふりかえりを書く'));
    side.appendChild(rf);
    body.appendChild(side);
    box.appendChild(body);
    return box;
  }

  var Planner = {
    goal: goal, setGoal: setGoal,
    settings: settings, setSettings: setSettings,
    ITEMS: ITEMS,
    draft: draft, roadmap: roadmap, saveRoadmap: saveRoadmap,
    leftovers: leftovers, carryOver: carryOver,
    today: today, savePlan: savePlan, plan: plan,
    meateCandidates: meateCandidates,
    weakness: weakness,
    mountRoadmap: mountRoadmap, mountToday: mountToday, todayPanel: todayPanel,
    EXTRA_MINUTES: EXTRA_MINUTES,
    // テスト用
    _setClock: function (fn) { clockFn = typeof fn === 'function' ? fn : null; },
    _resetPreset: function () { presetChecked = false; },
    _dates: { addDays: addDays, diffDays: diffDays, todayStr: todayStr, dateLong: dateLong }
  };
  S.Planner = Planner;
  if (typeof module === 'object' && module.exports) module.exports = Planner;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* js/reflect.js */
/* Shosu.Reflect — YWTふりかえり・ふりかえりボックス（担当M）
 *
 * Reflect.history(date) -> { date, items:[{itemId,label,done,correct,total,hints,planned,tags}], problems:{total,correct,hints},
 *                            stars:[{id,label,kind}], made:n, friend:n, friendCorrect:n, plan:{items,meate,done,total,allDone}|null, ... }
 *   その日の学習を集める。Store の記録（'shosu.rec.<key>' の entries[pid].t = 最後に答えた時刻ms）と、
 *   Stars の記録（もらった星の時刻・出来事 ev の時刻）、Store.myList の created を使う。
 * Reflect.save(r) / list() / get(date)      localStorage 'shosu.reflect'（日付ごと。同じ日は上書き）
 * Reflect.nextSuggestions(beforeDate?) -> [text]   直近の T（手書きがあれば「前回書いたこと（手書き）」も）
 * Reflect.lastT(beforeDate?) -> {date, choices, ink, items}|null
 * Reflect.mountYWT(el, date) -> {destroy()}  Reflect.mountBox(el) -> {destroy()}
 * Reflect.profileName() / setProfileName(ink)  localStorage 'shosu.reflect.name'
 *
 * Reflection = { v:1, date, name:Ink|null, meate:{choices,ink}, y:{auto:[text], extra:[text]},
 *                w:{eval:'double'|'single'|'triangle', choices:[text], ink}, t:{choices:[text], ink, items:[itemId]}, aid, saved:'ISO' }
 * classic script。Node でも require できる（DOM を使う部分は呼ばなければ動かない）。絵文字は使わない。
 */
(function (root) {
  'use strict';
  var S = root.Shosu = root.Shosu || {};
  var hasDOM = typeof document !== 'undefined' && !!document.createElement;
  var KEY = 'shosu.reflect', NAME_KEY = 'shosu.reflect.name', BOX_KEY = 'shosu.reflectBox';

  /* ---------- 保存（localStorage がなければメモリ） ---------- */
  var mem = {};
  function ls() { try { return root.localStorage || null; } catch (e) { return null; } }
  function rawGet(k) {
    if (mem[k] != null) return mem[k]; // 保存しきれなかった新しい内容（このページの間だけ）
    var s = ls();
    try { if (s) return s.getItem(k); } catch (e) {}
    return null;
  }
  // 書けたら true。容量超過などで書けなければ false（例外は投げない）
  function rawSet(k, v) {
    var s = ls();
    if (!s) { mem[k] = v; return true; }

      if (inkHas(meate.ink)) q.appendChild(drawInk(meate.ink, { width: 140, height: 34, trim: true, lineWidth: 6 }));
      q.appendChild(h('span', 'rf-quote-post', 'は、どうだった？'));
    } else q.appendChild(h('span', 'rf-quote-post', '今日の学習は、どうだった？'));
    colW.appendChild(q);
    var evRow = h('div', 'rf-evals');
    evRow.setAttribute('role', 'radiogroup');
    evRow.setAttribute('aria-label', 'じぶんのひょうか');
    var evalv = prev ? prev.w.eval : null, evBtns = {};
    ['double', 'single', 'triangle'].forEach(function (k) {
      var b = h('button', 'rf-eval rf-eval-' + k);
      b.type = 'button';
      b.setAttribute('role', 'radio');
      b.setAttribute('aria-label', EVALS[k]);
      b.innerHTML = evalSvg(k);
      b.appendChild(h('span', 'rf-eval-label', EVALS[k]));
      b.addEventListener('click', function () { setEval(k); });
      evBtns[k] = b; evRow.appendChild(b);
    });
    function setEval(k) {
      evalv = k;
      for (var kk in evBtns) { evBtns[kk].classList.toggle('on', kk === k); evBtns[kk].setAttribute('aria-checked', kk === k ? 'true' : 'false'); }
      evRow.classList.remove('rf-need');
      drawT();
    }
    colW.appendChild(evRow);
    colW.appendChild(h('div', 'rf-sub', 'タップしてえらべるよ'));
    var wList = h('div', 'rf-list');
    var wCands = wCandidates(hist, meate);
    (prev ? prev.w.choices : []).forEach(function (c) { if (wCands.indexOf(c) < 0) wCands.push(c); });
    var wChips = wCands.map(function (t) { var c = chip(t, !!(prev && prev.w.choices.indexOf(t) >= 0)); wList.appendChild(c.el); return c; });
    colW.appendChild(wList);
    colW.appendChild(h('div', 'rf-sub', 'じぶんのことばで書こう'));
    var wPad = InkPad({ w: 600, h: 180, ink: prev && prev.w.ink, placeholder: 'わかったこと・できたことを書こう' });
    pads.push(wPad);
    colW.appendChild(wPad.el);
    cols.appendChild(colW);

    // ===== T =====
    var colT = h('section', 'rf-col rf-t');
    colT.appendChild(colHead('T', '次にやりたいこと', 'えらんだことは、次の計画に出てくるよ'));
    var tList = h('div', 'rf-list');
    colT.appendChild(tList);
    var tSel = {}; // text -> itemId|null（えらんだもの）
    if (prev) prev.t.choices.forEach(function (c, i) { tSel[c] = null; });
    var tItemsPrev = prev ? prev.t.items : [];
    function drawT() {
      tList.innerHTML = '';
      var sug = tSuggestions(hist, meate, evalv);
      Object.keys(tSel).forEach(function (c) { if (!sug.some(function (s) { return s.text === c; })) sug.push({ text: c, item: tSel[c] }); });
      sug.forEach(function (s) {
        if (s.item == null && tItemsPrev.length && tSel.hasOwnProperty(s.text)) s.item = tSel[s.text];
        var c = chip(s.text, tSel.hasOwnProperty(s.text), function (on) { if (on) tSel[s.text] = s.item; else delete tSel[s.text]; });
        tList.appendChild(c.el);
      });
    }
    if (evalv) setEval(evalv); else drawT();
    colT.appendChild(h('div', 'rf-sub', 'じぶんで書いて たす'));
    var tPad = InkPad({ w: 600, h: 180, ink: prev && prev.t.ink, placeholder: '次にやりたいことを書こう' });
    pads.push(tPad);
    colT.appendChild(tPad.el);
    cols.appendChild(colT);

    // ===== ほぞん・先生に送る =====
    var bar = h('section', 'rf-bar');
    var msg = h('div', 'rf-msg');
    msg.setAttribute('role', 'status');
    var saveB = button('ほぞん', 'primary rf-save', doSave);
    var sendB = button('先生に送る', 'rf-send', doSend);
    sendB.disabled = !prev;
    var codeBox = h('div', 'rf-codebox');
    codeBox.hidden = true;
    bar.appendChild(msg); bar.appendChild(saveB); bar.appendChild(sendB);
    wrap.appendChild(bar);
    wrap.appendChild(codeBox);
    var saved = prev;

    function build() {
      var tChoices = Object.keys(tSel);
      var items = [];
      tChoices.forEach(function (c) { if (tSel[c]) uniqPush(items, tSel[c]); });
      return {
        v: 1, date: date, name: nameInk,
        meate: { choices: meate.choices.slice(), ink: meate.ink || null },
        y: { auto: autoChips.filter(function (c) { return c.on(); }).map(function (c) { return c.text; }),
          extra: exChips.filter(function (c) { return c.on(); }).map(function (c) { return c.text; }) },
        w: { eval: evalv, choices: wChips.filter(function (c) { return c.on(); }).map(function (c) { return c.text; }), ink: wPad.ink() },
        t: { choices: tChoices, ink: tPad.ink(), items: items },
        aid: deviceId(), saved: new Date().toISOString()
      };
    }
    function doSave() {
      if (namePad && !namePad.isEmpty()) { nameInk = namePad.ink(); setProfileName(nameInk); namePad.destroy(); namePad = null; drawName(); }
      var need = [];
      if (!nameInk) { need.push('なまえ'); if (namePad) namePad.flag(true); }
      if (!evalv) { need.push('◎○△'); evRow.classList.add('rf-need'); }
      if (need.length) { msg.textContent = need.join('と') + 'を わすれずに！'; msg.className = 'rf-msg warn'; return; }
      var r = build();
      var ok = save(r);
      saved = get(date) || cleanReflection(r);
      var info = { date: date, eval: evalv, planDone: !!(hist.plan && hist.plan.allDone), usedPrevT: usedPrevT(hist, date) };
      if (S.Stars && S.Stars.log) { try { S.Stars.log('reflect', info); } catch (e) { if (root.console) console.error('Stars.log', e); } }
      msg.textContent = ok ? 'ほぞんしたよ。つぎは「先生に送る」をおそう。' : 'この端末がいっぱいで、ほぞんしきれなかったかも。先生に送っておこう。';
      msg.className = 'rf-msg' + (ok ? ' good' : ' warn');
      sendB.disabled = false;
      sendB.classList.add('primary');
      saveB.classList.remove('primary');
      saveB.textContent = 'ほぞんしなおす';
    }
    function doSend() {
      var sh = S.Share;
      if (!saved) return;
      if (!sh || typeof sh.encodeReflection !== 'function') { msg.textContent = '送る機能は、まだじゅんび中です。'; msg.className = 'rf-msg warn'; return; }
      sendB.disabled = true;
      Promise.resolve().then(function () { return sh.encodeReflection(saved); }).then(function (token) {
        var text = typeof sh.codeText === 'function' ? sh.codeText(token) : token;
        function fallback() {
          msg.textContent = '下のコードをコピーして、Teams の先生へのチャットに はりつけてね。';
          msg.className = 'rf-msg good';
          codeBox.innerHTML = '';
          codeBox.hidden = false;
          codeBox.appendChild(h('div', 'rf-code-msg', 'うまくコピーできなかったよ。下のコードがえらばれているので、Ctrl＋C でコピーして、Teams にはりつけてね。'));
          var ta = h('textarea', 'rf-code-ta');
          ta.value = text; ta.readOnly = true; ta.rows = 3;
          ta.addEventListener('focus', function () { ta.select(); });
          codeBox.appendChild(ta);
          setTimeout(function () { ta.focus(); ta.select(); }, 30);
        }
        sendB.disabled = false;
        var cb = root.navigator && root.navigator.clipboard;
        if (cb && cb.writeText) {
          return cb.writeText(text).then(function () {
            codeBox.hidden = true;
            msg.textContent = 'コードをコピーしたよ。Teams の先生へのチャットに はりつけてね。';
            msg.className = 'rf-msg good';
            toast('コピーしたよ。Teams にはりつけてね。');
          }, fallback);
        }
        fallback();
      }).catch(function (e) {
        sendB.disabled = false;
        msg.textContent = /TOO_LONG/i.test(String(e && e.message)) ? '手書きが長すぎるみたい。少しみじかく書きなおしてね。' : 'コードを作れませんでした。';
        msg.className = 'rf-msg warn';
      });
    }
    return {
      destroy: function () { pads.forEach(function (p) { try { p.destroy(); } catch (e) {} }); if (wrap.parentNode) wrap.parentNode.removeChild(wrap); }
    };
  }

  /* ---------- 先生：ふりかえりボックス ---------- */
  function boxList() {
    var v = getJSON(BOX_KEY, []);
    if (!Array.isArray(v)) return [];
    var out = [];
    v.forEach(function (x) { if (!isObj(x)) return; var r = cleanReflection(x.r); if (r) out.push({ key: str(x.key, 80) || boxKey(r), r: r, added: Number(x.added) || 0 }); });
    return out;
  }
  function inkSig(ink) { if (!ink) return ''; var n = 0, s = 0; ink.strokes.forEach(function (st) { n += st.length; st.forEach(function (p) { s = (s * 31 + p.x * 7 + p.y) % 1000003; }); }); return n + '.' + s; }
  function boxKey(r) { return (r.aid || ('n' + inkSig(r.name))) + '|' + r.date; }
  function newer(a, b) { // a が b より新しいか（saved がなければ、あとから来たほうを新しいとする）
    if (a.saved && b.saved) return Date.parse(a.saved) >= Date.parse(b.saved);
    return true;
  }
  // [Reflection] を入れる。戻り値 {added, updated, same}
  function boxAdd(rs) {
    var l = boxList(), idx = {}, res = { added: 0, updated: 0, same: 0 };
    l.forEach(function (x, i) { idx[x.key] = i; });
    var now = Date.now();
    rs.forEach(function (r0) {
      var r = cleanReflection(r0);
      if (!r) return;
      var k = boxKey(r);
      if (k in idx) {
        var cur = l[idx[k]];
        if (JSON.stringify(cur.r) === JSON.stringify(r)) { res.same++; return; }
        if (newer(r, cur.r)) { l[idx[k]] = { key: k, r: r, added: now }; res.updated++; } else res.same++;
      } else { idx[k] = l.length; l.push({ key: k, r: r, added: now }); res.added++; }
    });
    res.ok = boxWrite(l);
    return res;
  }
  function boxWrite(l) { return rawSet(BOX_KEY, JSON.stringify(l)); }
  function boxRemove(key) { return boxWrite(boxList().filter(function (x) { return x.key !== key; })); }
  function boxClear() { return boxWrite([]); }

  function mountBox(el) {
    var alive = true;
    var wrap = h('main', 'rf rf-boxview');
    el.appendChild(wrap);
    var sec1 = h('section', 'rf-panel');
    sec1.appendChild(h('h2', null, 'ふりかえりのコードをとりこむ'));
    sec1.appendChild(h('p', 'rf-note', 'Teams のチャットを、そのままコピーしてはりつけてください。中にある「ふりかえり」のコードを全部見つけて、この端末に保存します。同じ子の同じ日のものは、新しいほうにまとめます。'));
    var ta = h('textarea', 'rf-paste');
    ta.setAttribute('aria-label', 'コードをはりつける');
    ta.placeholder = 'ここにはりつけ（Ctrl + V）';
    sec1.appendChild(ta);
    var row = h('div', 'rf-row');
    var importB = button('とりこむ', 'primary', importText);
    var msg = h('span', 'rf-msg');
    msg.setAttribute('role', 'status');
    row.appendChild(importB); row.appendChild(msg);
    sec1.appendChild(row);
    wrap.appendChild(sec1);
    var sec2 = h('section', 'rf-panel');
    wrap.appendChild(sec2);
    var filter = null; // 日付 or null（ぜんぶ）

    function setMsg(t, warn) { msg.textContent = t; msg.className = 'rf-msg' + (warn ? ' warn' : ' good'); }
    function importText() {
      var sh = S.Share, text = ta.value || '';
      if (!sh || typeof sh.extractTokens !== 'function' || typeof sh.decodeReflection !== 'function') { setMsg('ふりかえりのコードを読む機能が、まだありません。', true); return; }
      var toks = [];
      try { toks = sh.extractTokens(text) || []; } catch (e) { toks = []; }
      if (typeof sh.kindOf === 'function') toks = toks.filter(function (t) { return tryCall(function () { return sh.kindOf(t); }, null) === 'reflection'; });
      if (!toks.length) { setMsg('ふりかえりのコードが見つかりませんでした。', true); return; }
      importB.disabled = true;
      setMsg('とりこみ中…');
      Promise.all(toks.map(function (t) {
        return Promise.resolve().then(function () { return sh.decodeReflection(t); }).then(function (r) { return cleanReflection(r); }, function () { return null; });
      })).then(function (rs) {
        if (!alive) return;
        importB.disabled = false;
        var ok = rs.filter(Boolean), bad = rs.length - ok.length;
        var res = boxAdd(ok);
        var parts = [];
        if (res.added) parts.push(res.added + '人分 追加');
        if (res.updated) parts.push(res.updated + '人分 新しくした');
        if (res.same) parts.push(res.same + 'こは同じでした');
        if (bad) parts.push(bad + 'こは開けませんでした');
        if (res.ok === false) parts.push('端末がいっぱいで保存できませんでした');
        setMsg(parts.join('、') || 'とりこめませんでした。', !(res.added || res.updated) || res.ok === false);
        if (res.added || res.updated) { ta.value = ''; filter = ok.map(function (r) { return r.date; }).sort().pop(); }
        drawList();
      });
    }
    function cellList(arr, cls) {
      var ul = h('ul', 'rf-cell-list' + (cls ? ' ' + cls : ''));
      arr.forEach(function (t) { ul.appendChild(h('li', null, t)); });
      return ul;
    }
    function drawList() {
      sec2.innerHTML = '';
      var all = boxList();
      var dates = {};
      all.forEach(function (x) { dates[x.r.date] = (dates[x.r.date] || 0) + 1; });
      var dlist = Object.keys(dates).sort().reverse();
      if (filter && !dates[filter]) filter = null;
      var shown = all.filter(function (x) { return !filter || x.r.date === filter; })
        .sort(function (a, b) { return a.r.date < b.r.date ? 1 : a.r.date > b.r.date ? -1 : (a.added - b.added); });
      var head = h('div', 'rf-box-head');
      head.appendChild(h('h2', null, '集まったふりかえり（' + shown.length + '人分' + (filter ? '・' + fmtDate(filter) : '') + '）'));
      if (all.length) head.appendChild(button('ぜんぶけす', 'danger small', function () {
        confirmDialog('ふりかえりボックスを、ぜんぶ消します。よろしいですか？', 'ぜんぶけす', function () { boxClear(); setMsg('ぜんぶ消しました。'); drawList(); });
      }));
      sec2.appendChild(head);
      if (!all.length) { sec2.appendChild(h('p', 'rf-note', 'まだありません。上の欄にチャットをはりつけて「とりこむ」をおしてください。')); return; }
      var fr = h('div', 'rf-filter');
      fr.appendChild(h('span', 'rf-filter-label', '日付'));
      var fa = button('ぜんぶ（' + all.length + '）', 'small' + (!filter ? ' on' : ''), function () { filter = null; drawList(); });
      fr.appendChild(fa);
      dlist.forEach(function (d) { fr.appendChild(button(fmtDate(d) + '（' + dates[d] + '）', 'small' + (filter === d ? ' on' : ''), function () { filter = d; drawList(); })); });
      sec2.appendChild(fr);
      var tw = h('div', 'rf-table-wrap');
      var tb = h('table', 'rf-table');
      var thead = h('tr');
      ['なまえ', '日付', 'めあて', 'Y やったこと', 'ひょうか', 'W わかった・できた', 'T 次にやりたいこと', ''].forEach(function (t) { thead.appendChild(h('th', null, t)); });
      tb.appendChild(thead);
      shown.forEach(function (x) {
        var r = x.r, tr = h('tr');
        var c1 = h('td', 'rf-c-name');
        if (r.name) c1.appendChild(inkThumb(r.name, { width: 130, height: 40, label: 'なまえ' })); else c1.appendChild(h('span', 'rf-muted', '（なし）'));
        tr.appendChild(c1);
        tr.appendChild(h('td', 'rf-c-date', fmtDate(r.date)));
        var c3 = h('td', 'rf-c-meate'); c3.appendChild(meateNode(r.meate, true)); tr.appendChild(c3);
        var c4 = h('td', 'rf-c-y');
        if (r.y.auto.length) c4.appendChild(cellList(r.y.auto));
        if (r.y.extra.length) c4.appendChild(cellList(r.y.extra, 'rf-cell-extra'));
        if (!r.y.auto.length && !r.y.extra.length) c4.appendChild(h('span', 'rf-muted', '—'));
        tr.appendChild(c4);
        var c5 = h('td', 'rf-c-eval');
        if (r.w.eval) { var ev = h('span', 'rf-eval-mini'); ev.innerHTML = evalSvg(r.w.eval, 'rf-eval-svg'); ev.setAttribute('role', 'img'); ev.setAttribute('aria-label', EVALS[r.w.eval]); c5.appendChild(ev); c5.appendChild(h('div', 'rf-eval-cap', EVALS[r.w.eval])); }
        tr.appendChild(c5);
        var c6 = h('td', 'rf-c-w');
        if (r.w.choices.length) c6.appendChild(cellList(r.w.choices));
        if (r.w.ink) c6.appendChild(inkThumb(r.w.ink, { width: 200, height: 60, label: 'わかったこと・できたこと（手書き）' }));
        tr.appendChild(c6);
        var c7 = h('td', 'rf-c-t');
        if (r.t.choices.length) c7.appendChild(cellList(r.t.choices));
        if (r.t.ink) c7.appendChild(inkThumb(r.t.ink, { width: 200, height: 60, label: '次にやりたいこと（手書き）' }));
        tr.appendChild(c7);
        var c8 = h('td', 'rf-c-act');
        c8.appendChild(button('けす', 'small', function () {
          confirmDialog(fmtDate(r.date) + 'のこのふりかえりを消します。よろしいですか？', 'けす', function () { boxRemove(x.key); drawList(); });
        }));
        tr.appendChild(c8);
        tb.appendChild(tr);
      });
      tw.appendChild(tb);
      sec2.appendChild(tw);
    }
    drawList();
    return { destroy: function () { alive = false; if (wrap.parentNode) wrap.parentNode.removeChild(wrap); } };
  }

  var Reflect = {
    history: history,
    save: save, list: list, get: get,
    nextSuggestions: nextSuggestions, lastT: lastT,
    profileName: profileName, setProfileName: setProfileName,
    mountYWT: hasDOM ? mountYWT : function () { return { destroy: function () {} }; },
    mountBox: hasDOM ? mountBox : function () { return { destroy: function () {} }; },
    boxList: boxList, boxAdd: boxAdd, boxRemove: boxRemove, boxClear: boxClear,
    EVALS: EVALS, EXTRA: EXTRA.slice(),
    // テスト・つなぎ用
    _: { yAuto: yAuto, wCandidates: wCandidates, tSuggestions: tSuggestions, usedPrevT: usedPrevT, cleanReflection: cleanReflection,
      cleanInk: cleanInk, dateKey: dateKey, probCandidate: probCandidate, mem: mem }
  };

        b.textContent = 'ヒント（' + f.hintsUsed + '/' + hints.length + '）';
        b.disabled = f.hintsUsed >= hints.length;
      }
      upd();
      return b;
    };
    var memoObj = null;
    f.memoButton = function () {
      return button('けいさんメモ', 'memo-toggle', function () {
        if (!memoObj) {
          memoObj = S.Pad && S.Pad.memo ? S.Pad.memo({ height: 220 }) : null;
          if (memoObj) f.memoEl.appendChild(memoObj.el);
        } else {
          f.memoEl.hidden = !f.memoEl.hidden;
        }
      });
    };
    f.setActions = function (list) {
      f.actions.innerHTML = '';
      list.forEach(function (b) { if (b) f.actions.appendChild(b); });
    };
    f.setStatus = function (nodeOrText, cls) {
      f.status.innerHTML = '';
      f.status.className = 'p-status' + (cls ? ' ' + cls : '');
      if (nodeOrText == null) return;
      if (typeof nodeOrText === 'string') f.status.textContent = nodeOrText;
      else f.status.appendChild(nodeOrText);
    };
    f.showMark = function (state) {
      markEl.className = 'p-mark' + (state ? ' show ' + state : '');
      markEl.textContent = '';
    };
    f.report = function (correct, method, override) {
      if (f.reported && !override) return;
      f.reported = true;
      if (opts.onResult) {
        try { opts.onResult({ correct: !!correct, method: method, hints: f.hintsUsed }); } catch (e) { console.error(e); }
      }
    };
    f.showExplain = function () {
      if (problem.explain && !f.explainEl.firstChild) {
        f.explainEl.appendChild(h('span', 'explain-label', 'せつめい'));
        f.explainEl.appendChild(document.createTextNode(problem.explain));
      }
    };
    f.nextButton = function () {
      if (!opts.onNext) return null;
      return button('つぎへ ▶', 'primary next', function () { opts.onNext(); });
    };
    /* 正しい答えを見せて、子どもが自分で ○/× を選ぶ */
    f.selfJudge = function (answerNode, onDone, title) {
      f.answerEl.innerHTML = '';
      var box = h('div', 'answer-box');
      box.appendChild(h('div', 'answer-title', title || '正しい答え'));
      var a = h('div', 'answer-main');
      a.appendChild(answerNode);
      box.appendChild(a);
      box.appendChild(h('div', 'answer-ask', '自分の答えとくらべてみよう。'));
      var row = h('div', 'self-row');
      row.appendChild(button('あっていた（○）', 'self-ok', function () { done(true); }));
      row.appendChild(button('ちがっていた（×）', 'self-ng', function () { done(false); }));
      box.appendChild(row);
      f.answerEl.appendChild(box);
      function done(ok) {
        row.remove();
        box.querySelector('.answer-ask').textContent = ok ? '○をつけたよ。' : '×をつけたよ。どこがちがったか見なおそう。';
        f.showMark(ok ? 'ok' : 'ng');
        f.report(ok, 'self', true);
        if (ok) f.showExplain();
        if (onDone) onDone(ok);
      }
    };
    f.revealAnswer = function (answerNode) {
      f.answerEl.innerHTML = '';
      var box = h('div', 'answer-box');
      box.appendChild(h('div', 'answer-title', '正しい答え'));
      var a = h('div', 'answer-main');
      a.appendChild(answerNode);
      box.appendChild(a);
      f.answerEl.appendChild(box);
      f.showExplain();
    };
    f.modeNote = function () {
      if (f.mode === 'self' && f.wantedAuto) {
        f.root.appendChild(h('div', 'p-note', '（いまは読み取りの準備ができていないので、自分で丸をつけてね）'));
      }
    };
    return f;
  }

  /* 読み取った答えの表示（自信の低い文字は黄色） */
  function readNode(chars, label) {
    var w = h('span', 'read');
    w.appendChild(h('span', 'read-label', label || 'よみとった答え：'));
    var v = h('span', 'read-value');
    chars.forEach(function (c) {
      var s = h('span', c.unsure ? 'rc unsure' : 'rc', c.ch);
      v.appendChild(s);
    });
    w.appendChild(v);
    return w;
  }

  /* ================= fill ================= */
  function renderFill(container, p, opts) {
    var f = Frame(container, p, opts, 'fill');
    var size = boxSize();
    var slots = []; // {a, items:[{box}|{dot}]}
    var line = h('div', 'fill-line');
    line.style.setProperty('--box', size + 'px');
    (p.parts || []).forEach(function (part) {
      if (typeof part === 'string') {
        line.appendChild(h('span', 'fill-text', part));
      } else if (part && part.a != null) {
        var slot = { a: String(part.a), items: [] };
        var se = h('span', 'slot');
        String(part.a).split('').forEach(function (ch) {
          if (/\d/.test(ch)) {
            var b = S.Pad.digitBox({ size: size });
            se.appendChild(b.el);
            slot.items.push({ box: b });
          } else {
            se.appendChild(h('span', ch === '.' ? 'print-dot' : 'print-ch', ch === '.' ? '.' : ch));
            slot.items.push({ ch: ch });
          }
        });
        line.appendChild(se);
        slots.push(slot);
      }
    });
    f.body.appendChild(line);

    function allBoxes() {
      var r = [];
      slots.forEach(function (s) { s.items.forEach(function (it) { if (it.box) r.push(it.box); }); });
      return r;
    }
    function fullAnswerNode() {
      var w = h('span', 'answer-sentence');
      (p.parts || []).forEach(function (part) {
        if (typeof part === 'string') w.appendChild(h('span', null, part));
        else if (part && part.a != null) w.appendChild(h('span', 'answer-num', String(part.a)));
      });
      return w;
    }

    function initialActions() {
      allBoxes().forEach(function (b) { b.mark(null); });
      f.showMark(null);
      if (f.mode === 'auto') f.setActions([button('こたえあわせ', 'primary check', check), f.hintButton(), f.memoButton()]);
      else f.setActions([button('答えを見る', 'primary show', selfShow), f.hintButton(), f.memoButton()]);
    }
    // ボタンは1つを使い回す（ヒントの数え方を保つため）
    var hintB = f.hintButton(), memoB = f.memoButton();
    f.hintButton = function () { return hintB; };
    f.memoButton = function () { return memoB; };

    function misreadButton() {
      return button('読みまちがい？', 'misread', function () {
        f.selfJudge(fullAnswerNode(), function (ok) {
          f.setActions([ok ? null : button('もう一度', 'retry', retry), f.nextButton()]);
        }, '正しい答え（自分で丸をつけよう）');
      });
    }
    function retry() {
      f.answerEl.innerHTML = '';
      f.setStatus(null);
      slots.forEach(function (s) {
        s.items.forEach(function (it) { if (it.box && it.box.box.classList.contains('mark-ng')) it.box.clear(); });
      });
      initialActions();
    }

    function check() {
      var boxes = allBoxes();
      var empty = boxes.filter(function (b) { return b.isEmpty(); });
      if (empty.length) {
        empty.forEach(function (b) { b.mark('unsure'); });
        f.setStatus('まだ書いていないマスがあるよ。', 'warn');
        return;
      }
      var anyUnsure = false, readParts = [], slotOk = [];
      slots.forEach(function (s, si) {
        var str = '', chars = [];
        s.items.forEach(function (it) {
          if (it.box) {
            var r = recognizeBox(it.box);
            it.res = r;
            var unsure = r.digit == null || r.conf < UNSURE;
            if (unsure) { anyUnsure = true; it.box.mark('unsure'); }
            var c = r.digit == null ? '?' : String(r.digit);
            str += c;
            chars.push({ ch: c, unsure: unsure });
          } else { str += it.ch; chars.push({ ch: it.ch }); }
        });
        if (si > 0) readParts.push({ ch: '、' });
        readParts = readParts.concat(chars);
        s.read = str;
        slotOk.push(str.indexOf('?') < 0 && numEq(str, s.a));
      });
      var rn = readNode(readParts);
      if (anyUnsure) {
        var w = h('div');
        w.appendChild(rn);
        w.appendChild(h('div', 'msg', '黄色のマスを、もう一度ていねいに書いてね。'));
        f.setStatus(w, 'warn');
        f.setActions([button('こたえあわせ', 'primary check', check), f.hintButton(), misreadButton()]);
        return;
      }
      var ok = slotOk.every(Boolean);
      var w2 = h('div');
      w2.appendChild(rn);
      if (ok) {
        allBoxes().forEach(function (b) { b.mark('ok'); });
        w2.appendChild(h('div', 'msg praise', pick(PRAISE)));
        f.setStatus(w2, 'good');
        f.showMark('ok');
        f.report(true, 'auto');
        f.showExplain();
        f.setActions([misreadButton(), f.nextButton()]);
      } else {
        slots.forEach(function (s, i) {
          if (!slotOk[i]) s.items.forEach(function (it) { if (it.box) it.box.mark('ng'); });
        });
        w2.appendChild(h('div', 'msg', 'ざんねん。もう一度考えてみよう。'));
        f.setStatus(w2, 'bad');
        f.showMark('ng');
        f.report(false, 'auto');
        f.setActions([button('もう一度', 'retry', retry), f.hintButton(), button('答えを見る', 'show', function () {
          f.revealAnswer(fullAnswerNode());
          f.setActions([button('もう一度', 'retry', retry), misreadButton(), f.nextButton()]);
        }), misreadButton()]);
      }
    }

    function selfShow() {
      f.selfJudge(fullAnswerNode(), function (ok) {
        f.setActions([ok ? null : button('もう一度', 'retry', function () { f.answerEl.innerHTML = ''; initialActions(); }), f.hintButton(), f.nextButton()]);
      });
    }

    initialActions();
    f.modeNote();
    return f;
  }

  /* ================= choice ================= */
  function renderChoice(container, p, opts) {
    var f = Frame(container, p, opts, 'choice');
    var row = h('div', 'choice-row');
    var btns = [];
    var solved = false;
    (p.options || []).forEach(function (o) {
      var b = button(String(o), 'choice-btn', function () { choose(o, b); });
      btns.push(b);
      row.appendChild(b);
    });
    f.body.appendChild(row);
    var hintB = f.hintButton();
    function choose(o, b) {
      if (solved) return;
      btns.forEach(function (x) { x.classList.remove('ng'); });
      if (String(o) === String(p.a)) {
        solved = true;
        b.classList.add('ok');
        btns.forEach(function (x) { x.disabled = x !== b; });
        f.showMark('ok');
        f.setStatus(pick(PRAISE), 'good');
        f.report(true, 'auto');
        f.showExplain();
        f.setActions([f.nextButton()]);
      } else {
        b.classList.add('ng');
        f.showMark('ng');
        f.setStatus('ざんねん。もう一度えらんでみよう。', 'bad');
        f.report(false, 'auto');
        f.setActions([hintB, button('答えを見る', 'show', function () {
          f.revealAnswer(h('span', 'answer-num', String(p.a)));
          f.setActions([f.nextButton()]);
        })]);
      }
    }
    f.setActions([hintB]);
    return f;
  }

  /* ================= order ================= */
  function renderOrder(container, p, opts) {
    var f = Frame(container, p, opts, 'order');
    var dir = p.dir === 'asc' ? 'asc' : 'desc';
    var items = (p.items || []).map(function (v, i) { return { v: String(v), i: i }; });
    var placed = [];
    var guide = h('div', 'order-guide', dir === 'desc' ? '大きい数から順にタップしよう。' : '小さい数から順にタップしよう。');
    var pool = h('div', 'order-pool');
    var ans = h('div', 'order-answer');
    f.body.appendChild(guide);
    f.body.appendChild(pool);
    f.body.appendChild(ans);
    var hintB = f.hintButton();
    var checkB = button('こたえあわせ', 'primary check', check);
    var resetB = button('やりなおし', 'retry', function () { placed = []; draw(); f.setStatus(null); f.showMark(null); f.answerEl.innerHTML = ''; f.setActions([checkB, resetB, hintB]); });
    var locked = false;

    function draw() {
      pool.innerHTML = '';
      ans.innerHTML = '';
      items.forEach(function (it) {
        var used = placed.indexOf(it) >= 0;
        var b = button(it.v, 'order-item' + (used ? ' used' : ''), function () {
          if (used || locked) return;
          placed.push(it); draw();
        });
        b.disabled = used || locked;
        pool.appendChild(b);
      });
      for (var k = 0; k < items.length; k++) {
        if (k > 0) ans.appendChild(h('span', 'order-sign', dir === 'desc' ? '>' : '<'));
        var it = placed[k];
        if (it) {
          (function (it, k) {
            var b = button(it.v, 'order-item placed', function () {
              if (locked) return;
              placed.splice(k, 1); draw();
            });
            b.dataset.pos = k;
            ans.appendChild(b);
          })(it, k);
        } else {
          ans.appendChild(h('span', 'order-slot', String(k + 1)));
        }
      }
      checkB.disabled = placed.length < items.length || locked;
    }
    function sortedValues() {
      var c = items.slice();
      c.sort(function (x, y) { return dir === 'desc' ? num(y.v) - num(x.v) : num(x.v) - num(y.v); });
      return c.map(function (x) { return x.v; });
    }
    function check() {
      if (placed.length < items.length) return;
      var ok = true, firstBad = -1;
      for (var k = 1; k < placed.length; k++) {
        var a = num(placed[k - 1].v), b = num(placed[k].v);
        if (dir === 'desc' ? a < b : a > b) { ok = false; if (firstBad < 0) firstBad = k; }
      }
      if (ok) {
        locked = true; draw();
        Array.prototype.forEach.call(ans.querySelectorAll('.placed'), function (b) { b.classList.add('ok'); });
        f.showMark('ok');
        f.setStatus(pick(PRAISE), 'good');
        f.report(true, 'auto');
        f.showExplain();
        f.setActions([f.nextButton()]);
      } else {
        var bad = ans.querySelector('[data-pos="' + firstBad + '"]');
        if (bad) bad.classList.add('ng');
        f.showMark('ng');
        f.setStatus('ざんねん。色がついたところから見なおそう。ならべた数をタップすると、もどせるよ。', 'bad');
        f.report(false, 'auto');
        f.setActions([checkB, resetB, hintB, button('答えを見る', 'show', function () {
          f.revealAnswer(h('span', 'answer-num', sortedValues().join(dir === 'desc' ? '  >  ' : '  <  ')));
          f.setActions([checkB, resetB, f.nextButton()]);
        })]);
      }
    }
    draw();
    f.setActions([checkB, resetB, hintB]);
    return f;
  }

  /* ================= hissan ================= */
  function splitNum(s) {
    s = String(s);
    var i = s.indexOf('.');
    return i < 0 ? { int: s, dec: '' } : { int: s.slice(0, i) || '0', dec: s.slice(i + 1) };
  }
  /* 答えを計算（整数にして計算するので誤差が出ない） */
  function hissanAnswer(op, a, b) {
    var A = splitNum(a), B = splitNum(b);
    var nd = Math.max(A.dec.length, B.dec.length);
    function toInt(x) { var d = x.dec; while (d.length < nd) d += '0'; return parseInt(x.int + d, 10) || 0; }
    var r = op === '-' ? toInt(A) - toInt(B) : toInt(A) + toInt(B);
    var neg = r < 0; r = Math.abs(r);
    var s = String(r);
    while (s.length <= nd) s = '0' + s;
    var full = nd ? s.slice(0, s.length - nd) + '.' + s.slice(s.length - nd) : s; // 末尾の0あり（例 9.70）
    var canon = full.indexOf('.') >= 0 ? full.replace(/0+$/, '').replace(/\.$/, '') : full;
    return { full: (neg ? '-' : '') + full, canon: (neg ? '-' : '') + canon, value: (neg ? -1 : 1) * r / Math.pow(10, nd) };
  }
  function sigDigits(s) { return String(s).replace(/[^\d]/g, '').replace(/^0+/, '').replace(/0+$/, ''); }

  function renderHissan(container, p, opts) {
    if (!p.hints || !p.hints.length) {
      p = Object.assign({}, p, {
        hints: [
          '位をそろえて（小数点をたてにそろえて）考えよう。',
          'いちばん右の位から、位ごとに計算しよう。' + (p.op === '-' ? 'ひけないときは、となりの位から1かりてこよう。' : 'くり上がりに気をつけよう。'),
          '答えの小数点は、上の小数点にそろえて打とう。'
        ]
      });
    }
    var f = Frame(container, p, opts, 'hissan');
    var op = p.op === '-' ? '-' : '+';
    var A = splitNum(p.a), B = splitNum(p.b);
    var nInt = Math.max(A.int.length, B.int.length) + (op === '+' ? 1 : 0); // たし算はくり上がり用に1列多く
    var nDec = Math.max(A.dec.length, B.dec.length);
    if (p.showZeros === undefined && op === '-' && A.dec.length < B.dec.length) {
      p = Object.assign({}, p, { showZeros: true }); // 6−0.52 は 6.00 とみる
    }
    var nCols = nInt + nDec;
    var ans = hissanAnswer(op, p.a, p.b);
    var size = boxSize();
    var gapW = 34;

    if (!p.q) {
      f.root.insertBefore(h('div', 'p-q', '筆算でしましょう。　' + p.a + ' ' + (op === '-' ? '−' : '＋') + ' ' + p.b), f.body);
    }

    var grid = h('div', 'hissan-grid');
    var tmpl = ['44px'];
    for (var c = 0; c < nCols; c++) { tmpl.push(size + 'px'); if (c < nCols - 1) tmpl.push(gapW + 'px'); }
    grid.style.gridTemplateColumns = tmpl.join(' ');
    grid.style.setProperty('--cell', size + 'px');

    function colGrid(c) { return 2 + c * 2; }       // 数字の列の grid 列番号
    function gapGrid(g) { return 3 + g * 2; }       // 列 g と g+1 の間
    function place(el, row, col, span) {
      el.style.gridRow = row;
      el.style.gridColumn = span ? col + ' / span ' + span : col;
      grid.appendChild(el);
      return el;
    }
    function placeClass(c) {
      var k = nInt - 1 - c; // 0=一の位, 1=十の位, -1=1/10 …
      return ({ 2: 'pv-hundreds', 1: 'pv-tens', 0: 'pv-ones', '-1': 'pv-tenths', '-2': 'pv-hundredths', '-3': 'pv-thousandths' })[k] || '';
    }

    // 1行目：くり上がり・くり下がりメモ（読み取りなし）
    var carryMemos = [];
    for (c = 0; c < nCols; c++) {
      var m = S.Pad.memo({ width: size, height: 38, toolbar: false, lineWidth: 3 });
      m.el.classList.add('carry-memo');
      carryMemos.push(m);
      place(m.el, 1, colGrid(c));
    }
    var carryLabel = place(h('div', 'carry-label', 'メモ'), 1, 1);
    carryLabel.title = 'くり上がり・くり下がりのメモ';

    // 2・3行目：問題の数
    function numberRow(x, row, raw) {
      var hasDot = x.dec.length > 0;
      var intStart = nInt - x.int.length;
      for (var c = 0; c < nCols; c++) {
        var ch = '', faint = false;
        if (c < nInt) { if (c >= intStart) ch = x.int[c - intStart]; }
        else {
          var di = c - nInt;
          if (di < x.dec.length) ch = x.dec[di];
          else if (p.showZeros) { ch = '0'; faint = true; }
        }
        place(h('div', 'h-digit ' + placeClass(c) + (faint ? ' faint' : ''), ch), row, colGrid(c));
      }
      if (nDec > 0 && (hasDot || p.showZeros)) {
        place(h('div', 'h-dot' + (hasDot ? '' : ' faint'), '.'), row, gapGrid(nInt - 1));
      }
    }
    numberRow(A, 2, p.a);
    place(h('div', 'h-op', op === '-' ? '−' : '＋'), 3, 1);
    numberRow(B, 3, p.b);
    // 4行目：横線
    place(h('div', 'h-line'), 4, 1, tmpl.length);

    // 5行目：答え（手書きマス＋小数点を打つ場所）
    var boxes = [];
    for (c = 0; c < nCols; c++) {
      var b = S.Pad.digitBox({ size: size });
      b.el.classList.add('h-ans');
      boxes.push(b);
      place(b.el, 5, colGrid(c));
    }
    var point = null;
    var zones = [];
    for (var g = 0; g < nCols - 1; g++) {
      (function (g) {
        var z = h('button', 'dot-zone');
        z.type = 'button';
        z.setAttribute('aria-label', '小数点を打つ');
        z.appendChild(h('span', 'dot-mark'));
        z.addEventListener('click', function () {
          point = point === g ? null : g;
          zones.forEach(function (zz, i) { zz.classList.toggle('on', i === point); });
          clearJudge();
        });
        zones.push(z);
        place(z, 5, gapGrid(g));
      })(g);
    }
    var wrap = h('div', 'hissan-wrap');
    wrap.appendChild(grid);
    var tools = h('div', 'hissan-tools');
    tools.appendChild(h('span', 'hissan-tip', '小数点は、数字と数字の間をタップして打とう。'));
    tools.appendChild(button('メモをけす', 'small', function () { carryMemos.forEach(function (m) { m.clear(); }); }));
    wrap.appendChild(tools);
    f.body.appendChild(wrap);

    function clearJudge() {
      boxes.forEach(function (b) { b.mark(null); });
      zones.forEach(function (z) { z.classList.remove('ng'); });
    }
    function answerNode() {
      var w = h('span', 'answer-sentence');
      w.appendChild(h('span', null, p.a + ' ' + (op === '-' ? '−' : '＋') + ' ' + p.b + ' ＝ '));
      w.appendChild(h('span', 'answer-num', ans.canon));
      if (ans.full !== ans.canon) w.appendChild(h('span', 'answer-note', '（筆算では ' + ans.full + ' の終わりの0を／で消す）'));
      return w;
    }
    function misreadButton() {
      return button('読みまちがい？', 'misread', function () {
        f.selfJudge(answerNode(), function (ok) {
          f.setActions([ok ? null : button('もう一度', 'retry', retry), f.nextButton()]);
        }, '正しい答え（自分で丸をつけよう）');
      });
    }
    var hintB = f.hintButton();
    var memoB = f.memoButton();
    function initialActions() {
      clearJudge();
      f.showMark(null);
      if (f.mode === 'auto') f.setActions([button('こたえあわせ', 'primary check', check), hintB, memoB]);
      else f.setActions([button('答えを見る', 'primary show', selfShow), hintB, memoB]);
    }
    function retry() {
      f.answerEl.innerHTML = '';
      f.setStatus(null);
      initialActions();
    }
    function selfShow() {
      f.selfJudge(answerNode(), function (ok) {
        f.setActions([ok ? null : button('もう一度', 'retry', retry), hintB, f.nextButton()]);
      });
    }
    function check() {
      clearJudge();
      var res = boxes.map(recognizeBox);
      var written = res.filter(function (r) { return !r.empty; });
      if (!written.length) { f.setStatus('答えの行に数字を書いてね。', 'warn'); return; }
      var s = '', chars = [], anyUnsure = false, seenDigit = false;
      res.forEach(function (r, i) {
        if (!r.empty) {
          var unsure = r.digit == null || r.conf < UNSURE;
          if (unsure) { anyUnsure = true; boxes[i].mark('unsure'); }
          var ch = r.digit == null ? '?' : String(r.digit);
          s += ch; chars.push({ ch: ch, unsure: unsure }); seenDigit = true;
        }
        if (point === i) { s += '.'; chars.push({ ch: '.' }); }
      });
      var rn = readNode(chars);
      if (anyUnsure) {
        var w = h('div');
        w.appendChild(rn);
        w.appendChild(h('div', 'msg', '黄色のマスを、もう一度ていねいに書いてね。'));
        f.setStatus(w, 'warn');
        f.setActions([button('こたえあわせ', 'primary check', check), hintB, misreadButton()]);
        return;
      }
      var val = parseFloat(s.charAt(0) === '.' ? '0' + s : s);
      var ok = isFinite(val) && Math.abs(val - ans.value) < 1e-9;
      var w2 = h('div');
      w2.appendChild(rn);
      if (ok) {
        res.forEach(function (r, i) { if (!r.empty) boxes[i].mark('ok'); });
        w2.appendChild(h('div', 'msg praise', pick(PRAISE)));
        if (s.indexOf('.') >= 0 && /(\.|0)$/.test(s.replace(/^[^.]*\./, '.'))) {
          w2.appendChild(h('div', 'msg tip', '答えの終わりの0' + (/\.0*$/.test(s) ? 'と小数点' : '') + 'は、／線で消しておこう。'));
        }
        f.setStatus(w2, 'good');
        f.showMark('ok');
        f.report(true, 'auto');
        f.showExplain();
        f.setActions([misreadButton(), f.nextButton()]);
      } else {
        var msg;
        var digitsSame = sigDigits(s) === sigDigits(ans.canon) && sigDigits(s) !== '';
        if (digitsSame || (ans.canon.indexOf('.') >= 0 && point === null)) {
          msg = '小数点の位置を見直そう。';
          if (point !== null) zones[point].classList.add('ng');
        } else {
          msg = 'ざんねん。位ごとの計算を見直そう。';
        }
        res.forEach(function (r, i) { if (!r.empty && !digitsSame) boxes[i].mark('ng'); });
        w2.appendChild(h('div', 'msg', msg));
        f.setStatus(w2, 'bad');
        f.showMark('ng');
        f.report(false, 'auto');
        f.setActions([button('もう一度', 'retry', retry), hintB, button('答えを見る', 'show', function () {
          f.revealAnswer(answerNode());
          f.setActions([button('もう一度', 'retry', retry), misreadButton(), f.nextButton()]);
        }), misreadButton()]);
      }
    }
    initialActions();
    f.modeNote();
    return f;
  }

  var RENDERERS = { fill: renderFill, choice: renderChoice, order: renderOrder, hissan: renderHissan };

  function render(container, problem, opts) {
    container.innerHTML = '';
    var fn = problem && RENDERERS[problem.type];
    if (!fn) {
      container.appendChild(h('div', 'problem p-unknown', 'この問題は表示できません（' + (problem && problem.type) + '）'));
      return { destroy: function () { container.innerHTML = ''; } };
    }
    var f;
    try { f = fn(container, problem, opts || {}); }
    catch (e) {
      console.error(e);
      container.innerHTML = '';
      container.appendChild(h('div', 'problem p-unknown', '問題を表示できませんでした。'));
    }
    return {
      root: f && f.root,
      destroy: function () { container.innerHTML = ''; }
    };
  }

  S.Problems = { render: render, hissanAnswer: hissanAnswer, types: Object.keys(RENDERERS) };
})(window.Shosu = window.Shosu || {});

</script>
<script>/* js/present.js */
/* Shosu.Present — 子どもが作った問題の提示画面（大型モニター用）と、手書きの絵の描画（担当G）
 *
 * Present.drawInk(ink, opts?) -> HTMLCanvasElement
 *   ink = { w, h, strokes: [[{x,y}, ...], ...] }
 *   opts = { width, height, color, lineWidth（絵の座標での太さ。表示サイズに比例して太くなる）, trim, pad, label }
 *   width だけなら幅に合わせ、height もあればその中に収まるように、縦横比を保って描く（DPR 対応）。
 *   trim:true なら書いた部分だけを切り出して描く（名前などを大きく見せるとき）。
 *
 * Present.mount(el, up, opts) -> { destroy() }
 *   opts = { token, onSolve(), list?: { index（0から）, total, onPrev(), onNext() },
 *            back?: { href, label }（左上の戻るボタン。ふだんは ◀ ホーム） }
 */
(function (S) {
  'use strict';

  var KIND_LABEL = { hissan: '筆算', fill: '文章題・□うめ', compare: '大小くらべ', masu: 'ますの図', numberline: '数直線' };

  /* ---------- 小さな道具 ---------- */
  function h(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function button(label, cls, fn) {
    var b = h('button', 'btn ' + (cls || ''), label);
    b.type = 'button';
    if (fn) b.addEventListener('click', fn);
    return arrows(b);
  }
  /* 自作のSVGアイコン（Shosu.Icons）。ないときは文字だけ */
  function arrows(el) { if (S.Icons && S.Icons.arrows) { try { S.Icons.arrows(el); } catch (e) {} } return el; }
  function withIcon(el, name, text, after) {
    if (S.Icons && S.Icons.label && S.Icons.has(name)) S.Icons.label(el, text, name, { after: after });
    else el.textContent = text;
    return el;
  }
  function dpr() { return Math.max(1, Math.min(3, window.devicePixelRatio || 1)); }
  function toast(msg) {
    var t = h('div', 'toast', msg);
    document.body.appendChild(t);
    setTimeout(function () { t.classList.add('show'); }, 10);
    setTimeout(function () { t.classList.remove('show'); setTimeout(function () { t.remove(); }, 400); }, 2200);
  }
  function opSign(op) { return op === '-' ? '−' : '＋'; }

  /* ---------- 手書きの絵 ---------- */
  function pt(p) {
    if (Array.isArray(p)) return { x: +p[0] || 0, y: +p[1] || 0 };
    return { x: +(p && p.x) || 0, y: +(p && p.y) || 0 };
  }
  function strokesOf(ink) {
    var out = [];
    ((ink && ink.strokes) || []).forEach(function (s) {
      var pts = (Array.isArray(s) ? s : (s && s.pts) || []).map(pt);
      if (pts.length) out.push(pts);
    });
    return out;
  }
  function isInk(ink) { return !!(ink && typeof ink === 'object' && Array.isArray(ink.strokes)); }
  function hasStrokes(ink) { return isInk(ink) && strokesOf(ink).length > 0; }

  function drawInk(ink, opts) {
    opts = opts || {};
    var strokes = strokesOf(ink);
    var iw = Math.max(1, +(ink && ink.w) || 800), ih = Math.max(1, +(ink && ink.h) || 300);
    var lw = opts.lineWidth || 5;
    var bx = 0, by = 0, bw = iw, bh = ih;
    if (opts.trim && strokes.length) {
      var x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
      strokes.forEach(function (s) { s.forEach(function (p) {
        if (p.x < x0) x0 = p.x; if (p.y < y0) y0 = p.y; if (p.x > x1) x1 = p.x; if (p.y > y1) y1 = p.y;
      }); });
      var pad = opts.pad != null ? opts.pad : lw * 2 + 6;
      bx = x0 - pad; by = y0 - pad; bw = Math.max(x1 - x0 + pad * 2, lw * 4); bh = Math.max(y1 - y0 + pad * 2, lw * 4);
      // 細長くなりすぎないように（「一」だけの名前など）
      if (bh < bw / 8) { by -= (bw / 8 - bh) / 2; bh = bw / 8; }
    }
    var scale;
    if (opts.width && opts.height) scale = Math.min(opts.width / bw, opts.height / bh);
    else if (opts.height) scale = opts.height / bh;
    else scale = (opts.width || bw) / bw;
    if (!isFinite(scale) || scale <= 0) scale = 1;
    var cw = Math.max(1, Math.round(bw * scale)), ch = Math.max(1, Math.round(bh * scale));
    var r = dpr();
    var c = document.createElement('canvas');
    c.className = 'ink-canvas' + (opts.className ? ' ' + opts.className : '');
    c.width = Math.round(cw * r);
    c.height = Math.round(ch * r);
    c.style.width = cw + 'px';
    c.style.height = ch + 'px';
    c.setAttribute('role', 'img');
    if (opts.label) c.setAttribute('aria-label', opts.label);
    var ctx = c.getContext('2d');
    if (!ctx) return c;
    ctx.setTransform(r * scale, 0, 0, r * scale, -bx * r * scale, -by * r * scale);
    var w = Math.max(lw, 1.3 / scale); // 小さく表示しても線が消えないように
    ctx.lineWidth = w;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = opts.color || '#1f2a44';
    ctx.fillStyle = opts.color || '#1f2a44';
    strokes.forEach(function (s) {
      if (s.length === 1) {
        ctx.beginPath(); ctx.arc(s[0].x, s[0].y, w / 2, 0, Math.PI * 2); ctx.fill();
        return;
      }
      ctx.beginPath();
      ctx.moveTo(s[0].x, s[0].y);
      if (s.length === 2) ctx.lineTo(s[1].x, s[1].y);
      for (var i = 1; i < s.length - 1; i++) {
        var mx = (s[i].x + s[i + 1].x) / 2, my = (s[i].y + s[i + 1].y) / 2;
        ctx.quadraticCurveTo(s[i].x, s[i].y, mx, my);
      }
      if (s.length > 2) ctx.lineTo(s[s.length - 1].x, s[s.length - 1].y);
      ctx.stroke();
    });
    return c;
  }

  /* ---------- 問題の形 ---------- */
  function share() { return S.Share || null; }
  function toProblem(up, token) {
    try { if (share() && share().toProblem) return share().toProblem(up, token) || {}; } catch (e) { console.error('Share.toProblem', e); }
    return {};
  }
  function answerText(up, p) {
    try { if (share() && share().answerText) return String(share().answerText(up)); } catch (e) { console.error('Share.answerText', e); }
    if (up.kind === 'compare') return up.a + ' ' + (p && p.a || '') + ' ' + up.b;
    if (up.kind === 'hissan' && S.Problems && S.Problems.hissanAnswer) return S.Problems.hissanAnswer(up.op, up.a, up.b).canon;
    if (up.kind === 'fill') return String(up.answer || '') + (up.unit || '');
    return '';
  }
  function splitNum(s) {
    s = String(s == null ? '' : s);
    var i = s.indexOf('.');
    return i < 0 ? { int: s, dec: '' } : { int: s.slice(0, i) || '0', dec: s.slice(i + 1) };
  }
  function compareSign(a, b) {
    var x = parseFloat(a), y = parseFloat(b);
    return x > y ? '>' : x < y ? '<' : '=';
  }

  /* 答えのマスの形（文の中の □）。fills[] に「答えを入れる」関数を集める */
  function answerShape(parts, fills) {
    var line = h('div', 'pr-ans-line');
    (parts || []).forEach(function (part) {
      if (typeof part === 'string') { if (part) line.appendChild(h('span', 'pr-ans-text', part)); return; }
      if (!part || part.a == null) return;
      var slot = h('span', 'pr-slot');
      String(part.a).split('').forEach(function (ch) {
        if (/\d/.test(ch)) {
          var b = h('span', 'pr-box');
          slot.appendChild(b);
          fills.push(function (on) { b.textContent = on ? ch : ''; b.classList.toggle('filled', on); });
        } else {
          slot.appendChild(h('span', ch === '.' ? 'pr-dot' : 'pr-ch', ch));
        }
      });
      line.appendChild(slot);
    });
    return line;
  }

  /* 筆算（数を縦にならべた大きな表示） */
  function hissanView(op, a, b, fills) {
    var A = splitNum(a), B = splitNum(b);
    var ans = (S.Problems && S.Problems.hissanAnswer) ? S.Problems.hissanAnswer(op, a, b) : null;
    var R = splitNum(ans ? ans.canon : '');
    var nInt = Math.max(A.int.length, B.int.length, R.int.length);
    var nDec = Math.max(A.dec.length, B.dec.length);
    var nCols = nInt + nDec;
    var g = h('div', 'pr-hissan');
    g.style.setProperty('--n', String(nCols + 1));
    var tmpl = ['1.1em'];
    for (var c = 0; c < nCols; c++) { tmpl.push('0.72em'); if (c < nCols - 1) tmpl.push('0.24em'); }
    g.style.gridTemplateColumns = tmpl.join(' ');
    function colOf(c) { return 2 + c * 2; }
    function put(el, row, col, span) {
      el.style.gridRow = row;
      el.style.gridColumn = span ? col + ' / span ' + span : col;
      g.appendChild(el);
      return el;
    }
    function row(x, r, cls) {
      var cells = [];
      var start = nInt - x.int.length;
      for (var c = 0; c < nCols; c++) {
        var ch = '';
        if (c < nInt) { if (c >= start) ch = x.int[c - start]; }
        else if (c - nInt < x.dec.length) ch = x.dec[c - nInt];
        cells.push(put(h('span', 'pr-hd ' + (cls || ''), ch), r, colOf(c)));
      }
      var dot = null;
      if (nDec > 0) dot = put(h('span', 'pr-hdot ' + (cls || ''), x.dec.length ? '.' : ''), r, 3 + (nInt - 1) * 2);
      return { cells: cells, dot: dot };
    }
    row(A, 1);
    put(h('span', 'pr-hop', opSign(op)), 2, 1);
    row(B, 2);
    put(h('span', 'pr-hline'), 3, 1, tmpl.length);
    if (ans) {
      row(R, 4, 'pr-hans');
      g.classList.add('ans-hidden');
      fills.push(function (on) { g.classList.toggle('ans-hidden', !on); });
    } else {
      row({ int: '', dec: '' }, 4);
    }
    return g;
  }

  /* ---------- 提示画面 ---------- */
  function mount(el, up, opts) {
    opts = opts || {};
    up = up || {};
    var p = toProblem(up, opts.token);
    var kind = up.kind;
    var destroyed = false;
    var observers = [];
    var fitters = [];
    var fills = [];

    var root = h('div', 'present kind-' + (kind || 'x'));
    root.setAttribute('role', 'region');
    root.setAttribute('aria-label', 'みんなに見せる画面');

    /* --- 上のバー --- */
    var top = h('div', 'pr-top');
    var back = opts.back || { href: '#/', label: '◀ ホーム' };
    var backA = arrows(h('a', 'btn pr-back', back.label));
    backA.href = back.href;
    backA.addEventListener('click', function () { exitFullscreen(); });
    top.appendChild(backA);
    top.appendChild(h('span', 'pr-kind', KIND_LABEL[kind] || 'もんだい'));
    var authorBox = h('div', 'pr-author');
    authorBox.appendChild(h('span', 'pr-author-label', 'つくった人'));
    var authorInk = h('span', 'pr-author-ink');
    authorBox.appendChild(authorInk);
    var aInk = p.authorInk || up.author;
    if (hasStrokes(aInk)) {
      top.appendChild(authorBox);
      fitters.push(function () {
        var hh = Math.max(36, Math.min(64, Math.round(window.innerHeight * 0.065)));
        authorInk.innerHTML = '';
        authorInk.appendChild(drawInk(aInk, { height: hh, width: Math.round(window.innerWidth * 0.3), trim: true, lineWidth: 6, label: 'つくった人の名前' }));
      });
    }
    top.appendChild(h('span', 'pr-spacer'));
    if (opts.list && opts.list.total) {
      top.appendChild(h('span', 'pr-count', (opts.list.index + 1) + ' / ' + opts.list.total));
    }
    if (S.Stars && S.Stars.badge) {
      try {
        var sb = S.Stars.badge();
        if (sb) { var sw = h('span', 'topbar-stars pr-stars'); sw.appendChild(sb); top.appendChild(sw); }
      } catch (e) { console.error('Stars.badge', e); }
    }
    var fsBtn = null;
    var fsTarget = document.documentElement;
    if (fsTarget.requestFullscreen && document.fullscreenEnabled !== false) {
      fsBtn = withIcon(button('', 'pr-fs', toggleFullscreen), 'expand', '全画面');
      top.appendChild(fsBtn);
    }
    root.appendChild(top);

    /* --- 問題（ステージ）と、ヒント・答え・リンク（横のパネル） --- */
    var body = h('div', 'pr-body');
    var stage = h('div', 'pr-stage');
    var side = h('aside', 'pr-side');
    side.hidden = true;
    body.appendChild(stage);
    body.appendChild(side);
    root.appendChild(body);

    buildStage();

    /* --- 下のボタン --- */
    var bottom = h('div', 'pr-bottom');
    var prevB = null, nextB = null;
    if (opts.list && opts.list.total) {
      prevB = button('◀ まえ', 'pr-nav', function () { if (opts.list.onPrev) opts.list.onPrev(); });
      prevB.disabled = opts.list.index <= 0;
      bottom.appendChild(prevB);
    }
    var mid = h('div', 'pr-actions');
    var hintInk = p.hintInk || up.hint;
    var textHints = (Array.isArray(p.hints) ? p.hints : []).filter(function (x) { return typeof x === 'string' && x; });
    var secHint = section('ヒント', 'pr-sec-hint');
    var hintB = button('ヒントを見せる', 'pr-hint', function () { toggle(secHint, hintB, 'ヒントを見せる', 'ヒントをかくす', fillHint); });
    if (!hasStrokes(hintInk) && !textHints.length) { hintB.disabled = true; hintB.textContent = 'ヒントなし'; }
    var secAns = section('答え', 'pr-sec-ans');
    var ansB = button('答えを見せる', 'pr-answer', function () {
      toggle(secAns, ansB, '答えを見せる', '答えをかくす', fillAnswer);
      var on = !secAns.hidden;
      fills.forEach(function (f) { f(on); });
    });
    var secLink = section('みんなの端末で解こう', 'pr-sec-link');
    var linkB = button('みんなの端末で解く', 'pr-link', function () { toggle(secLink, linkB, 'みんなの端末で解く', 'リンクをとじる', fillLink); });
    var solveB = withIcon(button('', 'primary pr-solve', null), 'pen', '自分で解く', true);
    solveB.addEventListener('click', function () { exitFullscreen(); if (opts.onSolve) opts.onSolve(); });
    if (!opts.onSolve) solveB.hidden = true;
    [hintB, ansB, linkB, solveB].forEach(function (b) { mid.appendChild(b); });
    bottom.appendChild(mid);
    if (opts.list && opts.list.total) {
      var last = opts.list.index >= opts.list.total - 1;
      nextB = button('つぎ ▶', 'pr-nav primary-nav', function () { if (opts.list.onNext) opts.list.onNext(); });
      nextB.disabled = last;
      bottom.appendChild(nextB);
    }
    root.appendChild(bottom);

    el.appendChild(root);

    function section(title, cls) {
      var s = h('section', 'pr-sec ' + cls);
      s.appendChild(h('h2', 'pr-sec-title', title));
      s.appendChild(h('div', 'pr-sec-body'));
      s.hidden = true;
      side.appendChild(s);
      return s;
    }
    function toggle(sec, btn, onLabel, offLabel, fill) {
      var show = sec.hidden;
      if (show && fill && !sec.dataset.filled) { sec.dataset.filled = '1'; fill(sec.querySelector('.pr-sec-body')); }
      sec.hidden = !show;
      btn.textContent = show ? offLabel : onLabel;
      btn.classList.toggle('on', show);
      side.hidden = !Array.prototype.some.call(side.children, function (c) { return !c.hidden; });
      root.classList.toggle('with-side', !side.hidden);
      refit();
    }
    function fillHint(box) {
      if (hasStrokes(hintInk)) {
        var holder = h('div', 'pr-hint-ink');
        box.appendChild(holder);
        fitters.push(function () {
          if (secHint.hidden) return;
          var w = Math.max(160, box.clientWidth - 4);
          holder.innerHTML = '';
          holder.appendChild(drawInk(hintInk, { width: w, height: Math.round(window.innerHeight * 0.36), trim: true, lineWidth: 5, label: 'ヒントの絵' }));
        });
      }
      textHints.forEach(function (t) { box.appendChild(h('div', 'pr-hint-text', t)); });
    }
    function fillAnswer(box) {
      box.appendChild(h('div', 'pr-answer-text', answerText(up, p)));
    }
    function fillLink(box) {
      var note = h('p', 'pr-link-note', 'このリンクを Teams や Classroom のチャットにはって、みんなの端末で開こう。');
      box.appendChild(note);
      var ta = h('textarea', 'pr-link-url');
      ta.readOnly = true;
      ta.rows = 3;
      ta.setAttribute('aria-label', '問題のリンク');
      ta.value = 'リンクを作っています…';
      ta.addEventListener('focus', function () { ta.select(); });
      ta.addEventListener('click', function () { ta.select(); });
      box.appendChild(ta);
      var copyB = button('リンクをコピー', 'primary pr-copy', function () { copy(ta.value, ta); });
      copyB.disabled = true;
      box.appendChild(copyB);
      var len = h('div', 'pr-link-len');
      box.appendChild(len);
      getToken().then(function (tok) {
        if (destroyed) return;
        var url = share() && share().url ? share().url(tok) : location.href.split('#')[0] + '#/q/' + tok;
        ta.value = url;
        copyB.disabled = false;
        len.textContent = '（' + url.length + '文字）';
      }).catch(function (e) {
        console.error(e);
        if (destroyed) return;
        ta.value = '';
        note.textContent = 'リンクを作れませんでした。';
      });
    }
    function getToken() {
      if (opts.token) return Promise.resolve(opts.token);
      if (share() && share().encode) return Promise.resolve(share().encode(up));
      return Promise.reject(new Error('Share がありません'));
    }

    /* --- ステージの中身 --- */
    function buildStage() {
      var head = h('div', 'pr-q');
      var visual = h('div', 'pr-visual');
      var foot = h('div', 'pr-foot');
      var qText = typeof p.q === 'string' ? p.q : '';
      var qInk = p.qInk || up.q;

      if (kind === 'hissan') {
        var op = up.op || p.op, a = up.a != null ? up.a : p.a, b = up.b != null ? up.b : p.b;
        head.textContent = '筆算でしましょう。　' + a + ' ' + opSign(op) + ' ' + b;
        visual.appendChild(hissanView(op, a, b, fills));
      } else if (kind === 'compare') {
        head.textContent = 'どちらが大きいかな。□にあてはまる記号は？';
        var sign = p.a && /^[<>=]$/.test(String(p.a)) ? String(p.a) : compareSign(up.a, up.b);
        var line = h('div', 'pr-compare');
        line.appendChild(h('span', 'pr-cnum', String(up.a)));
        var sq = h('span', 'pr-cbox');
        line.appendChild(sq);
        line.appendChild(h('span', 'pr-cnum', String(up.b)));
        visual.appendChild(line);
        fills.push(function (on) { sq.textContent = on ? sign : ''; sq.classList.toggle('filled', on); });
      } else {
        if (qText) head.textContent = qText;
        if (hasStrokes(qInk)) {
          var inkHolder = h('div', 'pr-qink');
          visual.appendChild(inkHolder);
          fitters.push(function () {
            var w = visual.clientWidth, hh = visual.clientHeight;
            if (!w || !hh) return;
            inkHolder.innerHTML = '';
            inkHolder.appendChild(drawInk(qInk, { width: w - 8, height: hh - 8, trim: true, lineWidth: 5, label: '問題文' }));
          });
        }
        if (p.fig && S.Figures && S.Figures.render) {
          try {
            var fe = S.Figures.render(p.fig);
            if (fe) {
              var fh = h('div', 'pr-fig');
              if (fe.style) { fe.style.width = '100%'; fe.style.height = '100%'; fe.style.maxWidth = 'none'; }
              fh.appendChild(fe);
              visual.appendChild(fh);
            }
          } catch (e) { console.error('Figures.render', e); }
        }
        if (Array.isArray(p.parts) && p.parts.length) foot.appendChild(answerShape(p.parts, fills));
        else if (kind === 'fill' && up.answer != null) foot.appendChild(answerShape([{ a: String(up.answer) }, up.unit || ''], fills));
        if (!visual.firstChild && !foot.firstChild) visual.appendChild(h('div', 'pr-empty', 'この問題は表示できません。'));
      }
      if (head.textContent) stage.appendChild(head);
      stage.appendChild(visual);
      if (foot.firstChild) stage.appendChild(foot);

      if (window.ResizeObserver) {
        var ro = new ResizeObserver(function () { refit(); });
        ro.observe(visual);
        ro.observe(side);
        observers.push(ro);
      }
    }

    var fitTimer = null;
    function refit() {
      if (fitTimer) cancelAnimationFrame(fitTimer);
      fitTimer = requestAnimationFrame(function () {
        fitTimer = null;
        if (destroyed) return;
        fitters.forEach(function (f) { try { f(); } catch (e) { console.error(e); } });
      });
    }

    /* --- 全画面 --- */
    function isFs() { return !!document.fullscreenElement; }
    function toggleFullscreen() {
      try {
        if (isFs()) document.exitFullscreen();
        else {
          var r = fsTarget.requestFullscreen();
          if (r && r.catch) r.catch(function () { toast('全画面にできませんでした'); });
        }
      } catch (e) { toast('全画面にできませんでした'); }
    }
    function exitFullscreen() {
      try { if (isFs() && document.exitFullscreen) { var r = document.exitFullscreen(); if (r && r.catch) r.catch(function () {}); } } catch (e) {}
    }
    function onFs() {
      if (fsBtn) { if (isFs()) withIcon(fsBtn, 'shrink', '全画面をやめる'); else withIcon(fsBtn, 'expand', '全画面'); }
      refit();
    }
    document.addEventListener('fullscreenchange', onFs);
    onFs();

    /* --- キー操作（プレゼン用リモコンの PageDown/PageUp も） --- */
    function onKey(e) {
      var t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      if (!opts.list) return;
      if ((e.key === 'ArrowRight' || e.key === 'PageDown') && nextB && !nextB.disabled) { e.preventDefault(); nextB.click(); }
      else if ((e.key === 'ArrowLeft' || e.key === 'PageUp') && prevB && !prevB.disabled) { e.preventDefault(); prevB.click(); }
    }
    document.addEventListener('keydown', onKey);
    window.addEventListener('resize', refit);

    function copy(text, ta) {
      function fallback() {
        try {
          ta.focus(); ta.select();
          var ok = document.execCommand && document.execCommand('copy');
          toast(ok ? 'リンクをコピーしました' : 'リンクをえらんで、コピーしてね');
        } catch (e) { toast('リンクをえらんで、コピーしてね'); }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { toast('リンクをコピーしました'); }, fallback);
      } else fallback();
    }

    refit();

    return {
      root: root,
      destroy: function () {
        destroyed = true;
        observers.forEach(function (o) { o.disconnect(); });
        document.removeEventListener('fullscreenchange', onFs);
        document.removeEventListener('keydown', onKey);
        window.removeEventListener('resize', refit);
        if (root.parentNode) root.parentNode.removeChild(root);
      }
    };
  }

  S.Present = { mount: mount, drawInk: drawInk, hasInk: hasStrokes, KIND_LABEL: KIND_LABEL };
})(window.Shosu = window.Shosu || {});

</script>
<script>/* js/generators.js */
/* generators.js — 似た問題の自動生成（担当D）
 * Shosu.Generators.make(name, rng?, {level:'easy'|'normal'|'hard'}?) -> problem
 *   level を省略（または 'normal'）すると今までと同じ問題（教科書レベル）。
 * Shosu.Generators.names()
 * 小数の計算は、浮動小数の誤差をさけるため整数（100倍・1000倍）で行い、文字列にする。
 * 生成した問題には src（再検証用の元データ）を付ける。
 */
(function (S) {
  'use strict';

  // ---------- 小数のための道具 ----------
  var POW = [1, 10, 100, 1000, 10000, 100000, 1000000];

  // 整数 n を 10^e でわった小数を文字列に（末尾の0は取る）
  function fmt(n, e) {
    if (e === undefined) e = 3;
    var neg = n < 0;
    var s = String(Math.abs(Math.round(n)));
    while (s.length <= e) s = '0' + s;
    var ip = s.slice(0, s.length - e);
    var fp = s.slice(s.length - e).replace(/0+$/, '');
    var out = fp ? ip + '.' + fp : ip;
    return neg ? '-' + out : out;
  }

  // 小数の文字列を 10^e 倍した整数に
  function parse(str, e) {
    if (e === undefined) e = 3;
    str = String(str);
    var m = /^(\d*)(?:\.(\d*))?$/.exec(str);
    if (!m) throw new Error('bad decimal: ' + str);
    var ip = m[1] || '0';
    var fp = m[2] || '';
    if (fp.length > e) throw new Error('too many decimals: ' + str + ' (e=' + e + ')');
    while (fp.length < e) fp += '0';
    return parseInt(ip, 10) * POW[e] + (fp ? parseInt(fp, 10) : 0);
  }

  function decimals(str) {
    var i = String(str).indexOf('.');
    return i < 0 ? 0 : String(str).length - i - 1;
  }

  function ri(rng, a, b) { return a + Math.floor(rng() * (b - a + 1)); }
  function pick(rng, arr) { return arr[Math.floor(rng() * arr.length)]; }
  function shuffle(rng, arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  // 重み付き選択 [[weight, value], ...]
  function wpick(rng, list) {
    var sum = 0, i;
    for (i = 0; i < list.length; i++) sum += list[i][0];
    var r = rng() * sum;
    for (i = 0; i < list.length; i++) {
      r -= list[i][0];
      if (r < 0) return list[i][1];
    }
    return list[list.length - 1][1];
  }

  function hashStr(s) {
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  }

  var PLACE_NAMES = ['一の位', '小数第一位', '小数第二位', '小数第三位'];
  var UNIT_STR = ['1', '0.1', '0.01', '0.001'];

  // 筆算のヒント（固定問題でも使う）
  function hissanHints(op, a, b) {
    var h = [];
    var da = decimals(a), db = decimals(b);
    if (da !== db) {
      h.push('小数点の位置をたてにそろえて書こう。' + (da === 0 || db === 0 ? '整数は「' + (da === 0 ? a : b) + '.00」と考えるといいよ。' : 'けたの数がちがうときは、右はしをそろえないよ。'));
    } else {
      h.push('小数点の位置をたてにそろえて書こう。');
    }
    if (op === '+') {
      h.push('整数のたし算と同じように、いちばん右の位から計算しよう。くり上がりに気をつけよう。');
    } else {
      h.push('整数のひき算と同じように、いちばん右の位から計算しよう。ひけないときは、1つ上の位からくり下げよう。');
    }
    h.push('答えの小数点は、上の小数点にそろえて打とう。小数点より右のいちばん後ろが0なら、0は消しておこう。');
    return h;
  }

  function finish(name, p) {
    p.id = 'G-' + name + '-' + hashStr(JSON.stringify(p.src) + p.type);
    p.src.gen = name;
    return p;
  }

  // ---------- 各生成器 ----------
  var gens = {};

  // ますの図を読む
  gens.masuRead = function (rng) {
    var level = rng() < 0.3 ? 3 : 2;
    var L, d1, d2, d3 = 0, total;
    for (var t = 0; t < 50; t++) {
      L = wpick(rng, [[2, 0], [4, 1], [3, 2], [2, 3]]);
      d1 = rng() < 0.15 ? 0 : ri(rng, 1, 9);
      d2 = ri(rng, 0, 9);
      if (level === 3) d3 = ri(rng, 1, 9);
      if (level === 2 && d2 === 0 && rng() < 0.8) d2 = ri(rng, 1, 9);
      total = L * 1000 + d1 * 100 + d2 * 10 + d3;
      if (total > 0 && !(level === 2 && d2 === 0 && d1 === 0)) break;
    }
    var fig = { kind: 'masu', unit: 'L', L: L, d1: d1, d2: d2, level: level };
    if (level === 3) fig.d3 = d3;
    var hints;
    if (level === 2) {
      hints = [
        '1Lますが何こ、0.1Lますが何こあるかな？',
        'いちばん右のますは、0.1Lを10等分しているよ。小さい目もり1つ分は0.01Lだね。',
        '0.01Lが何こ分かを数えて、1L・0.1Lの分と合わせよう。'
      ];
    } else {
      hints = [
        '1Lます、0.1Lます、0.01Lますがそれぞれ何こあるかな？',
        'いちばん右のますは、0.01Lを10等分しているよ。小さい目もり1つ分は0.001Lだね。',
        '0.001Lが何こ分かを数えて、ほかの分と合わせよう。'
      ];
    }
    return finish('masuRead', {
      type: 'fill', tag: 'hyoshikata',
      q: 'かさは何Lですか。',
      fig: fig,
      parts: [{ a: fmt(total, 3) }, 'L'],
      hints: hints,
      src: { L: L, d1: d1, d2: d2, d3: d3, level: level }
    });
  };

  // 単位のかんさん
  // 単位の大きさ（基本単位に対する10のべき）
  var UNITS = {
    km: { dim: 'len', k: 6 }, m: { dim: 'len', k: 3 }, cm: { dim: 'len', k: 1 }, mm: { dim: 'len', k: 0 },
    kg: { dim: 'wt', k: 3 }, g: { dim: 'wt', k: 0 },
    L: { dim: 'vol', k: 3 }, dL: { dim: 'vol', k: 2 }, mL: { dim: 'vol', k: 0 }
  };
  function unitAnswer(from, to) {
    // from: [[valueStr, unit], ...]
    var total = 0;
    for (var i = 0; i < from.length; i++) {
      var u = UNITS[from[i][1]];
      var dec = decimals(from[i][0]);
      total += parse(from[i][0], dec) * POW[u.k] / POW[dec];
    }
    return fmt(total, UNITS[to].k);
  }

  gens.unitConvert = function (rng) {
    var kind = wpick(rng, [
      [3, 'mcm'], [1, 'cm'], [2, 'mm'], [3, 'km'], [3, 'kgg'], [2, 'g'], [1, 'mL'], [2, 'rev']
    ]);
    var from, to, hints, n;
    switch (kind) {
      case 'mcm': // 2m83cm -> m
        n = ri(rng, 1, 99);
        from = [[String(ri(rng, 1, 9)), 'm'], [String(n), 'cm']];
        to = 'm';
        hints = ['1cm＝0.01m、10cm＝0.1m だよ。', n + 'cmは、0.01mが何こ分かな？', 'mの分と合わせて、小数で表そう。'];
        break;
      case 'cm':
        n = rng() < 0.4 ? ri(rng, 1, 9) : ri(rng, 11, 99);
        from = [[String(n), 'cm']];
        to = 'm';
        hints = ['1cm＝0.01m だよ。', n + 'cmは、0.01mが何こ分かな？'];
        break;
      case 'mm':
        n = rng() < 0.6 ? ri(rng, 1001, 9999) : ri(rng, 101, 999);
        if (n % 10 === 0) n += 1;
        from = [[String(n), 'mm']];
        to = 'm';
        hints = ['1mm＝0.001m だよ。', '1000mmで1mだね。' + n + 'mmは、1mが何こと、0.001mが何こ分かな？'];
        break;
      case 'km':
        n = wpick(rng, [[3, ri(rng, 1001, 9999)], [1, ri(rng, 10001, 99999)], [1, ri(rng, 101, 999)]]);
        if (n % 10 === 0 && rng() < 0.7) n += ri(rng, 1, 9);
        from = [[String(n), 'm']];
        to = 'km';
        hints = ['1m＝0.001km だよ。', '1000mで1kmだね。1kmが何こと、0.001kmが何こ分かな？', '位の表に数字をあてはめて考えよう。'];
        break;
      case 'kgg':
        n = rng() < 0.2 ? ri(rng, 1, 99) : ri(rng, 101, 999);
        from = [[String(rng() < 0.8 ? ri(rng, 1, 9) : ri(rng, 10, 49)), 'kg'], [String(n), 'g']];
        to = 'kg';
        hints = ['1g＝0.001kg だよ。', n + 'gは、0.001kgが何こ分かな？', 'kgの分と合わせて、小数で表そう。'];
        break;
      case 'g':
        n = ri(rng, 11, 999);
        from = [[String(n), 'g']];
        to = 'kg';
        hints = ['1g＝0.001kg だよ。', n + 'gは、0.001kgが何こ分かな？'];
        break;
      case 'mL':
        n = ri(rng, 11, 1999);
        from = [[String(n), 'mL']];
        to = 'L';
        hints = ['1000mL＝1L、1mL＝0.001L だよ。', n + 'mLは、0.001Lが何こ分かな？'];
        break;
      default: { // rev: km->m, kg->g, L->mL
        var r = pick(rng, [['km', 'm'], ['kg', 'g'], ['L', 'mL']]);
        var v = ri(rng, 1001, 9999);
        if (rng() < 0.5) v = v - (v % 10);
        var vs = fmt(v, 3);
        if (vs.indexOf('.') < 0) vs = fmt(v + 1, 3);
        from = [[vs, r[0]]];
        to = r[1];
        hints = ['1' + r[0] + '＝1000' + r[1] + ' だよ。', '0.001' + r[0] + 'は1' + r[1] + 'だね。' + vs + r[0] + 'は、0.001' + r[0] + 'が何こ分かな？'];
      }
    }
    var desc = from.map(function (f) { return f[0] + f[1]; }).join('');
    return finish('unitConvert', {
      type: 'fill', tag: 'hyoshikata',
      q: '□にあてはまる数を書きましょう。',
      parts: [desc + '＝', { a: unitAnswer(from, to) }, to],
      hints: hints,
      src: { from: from, to: to }
    });
  };

  // 1を□こ、0.1を□こ…合わせた数
  gens.compose = function (rng) {
    var c = [ri(rng, 0, 9), ri(rng, 0, 9), ri(rng, 0, 9), ri(rng, 1, 9)];
    if (rng() < 0.7 && c[1] === 0) c[1] = ri(rng, 1, 9);
    if (rng() < 0.7 && c[2] === 0) c[2] = ri(rng, 1, 9);
    if (rng() < 0.25) c[pick(rng, [1, 2])] = 0; // 空位
    if (rng() < 0.3) c[0] = 0;
    var useL3 = rng() < 0.2; // 小数第二位までの数
    if (useL3) c[3] = 0;
    if (c[0] + c[1] + c[2] + c[3] === 0) c[2] = 3;
    var txt = [];
    for (var i = 0; i < 4; i++) if (c[i]) txt.push(UNIT_STR[i] + 'を' + c[i] + 'こ');
    var total = c[0] * 1000 + c[1] * 100 + c[2] * 10 + c[3];
    var hints = [
      '1、0.1、0.01、0.001 は、それぞれ一の位、小数第一位、小数第二位、小数第三位だよ。',
      '位の表に、それぞれのこ数を書きこんでみよう。'
    ];
    if (c.indexOf(0) >= 0 && c.indexOf(0) < 3) hints.push('出てこない位には0を書くのをわすれないでね。');
    return finish('compose', {
      type: 'fill', tag: 'shikumi',
      q: '□にあてはまる数を書きましょう。',
      parts: [txt.join('、') + '合わせた数は', { a: fmt(total, 3) }, 'です。'],
      hints: hints,
      src: { counts: c }
    });
  };

  // 数を分ける（数の構成・位）
  gens.decompose = function (rng) {
    var d = [ri(rng, 1, 9), ri(rng, 1, 9), ri(rng, 0, 9), ri(rng, 1, 9)];
    if (rng() < 0.2) d[pick(rng, [1, 2])] = 0;
    var x = fmt(d[0] * 1000 + d[1] * 100 + d[2] * 10 + d[3], 3);
    var kind = wpick(rng, [[3, 'fill'], [2, 'choice'], [1, 'digit']]);
    var p;
    if (kind === 'fill') {
      var parts = [x + 'は、'];
      var first = true;
      for (var i = 0; i < 4; i++) {
        if (!d[i]) continue;
        parts.push((first ? '' : '、') + UNIT_STR[i] + 'を');
        parts.push({ a: String(d[i]) });
        parts.push('こ');
        first = false;
      }
      parts.push('合わせた数です。');
      p = {
        type: 'fill', tag: 'shikumi',
        q: '□にあてはまる数を書きましょう。',
        parts: parts,
        hints: ['位の表に' + x + 'を書いてみよう。', '一の位の数字は1のこ数、小数第一位の数字は0.1のこ数だよ。'],
        src: { x: x, kind: kind }
      };
    } else {
      // 数字が1回だけ出てくる位を選ぶ
      var cand = [];
      for (var j = 0; j < 4; j++) {
        var cnt = 0;
        for (var k = 0; k < 4; k++) if (d[k] === d[j]) cnt++;
        if (cnt === 1 && d[j] !== 0) cand.push(j);
      }
      if (!cand.length || kind === 'digit') {
        var pos = ri(rng, 1, 3);
        p = {
          type: 'fill', tag: 'shikumi',
          q: '□にあてはまる数字を書きましょう。',
          parts: [x + 'の' + PLACE_NAMES[pos] + 'の数字は', { a: String(d[pos]) }, 'です。'],
          hints: ['小数点のすぐ右が小数第一位（1/10の位）だよ。', 'そこから右へ、小数第二位（1/100の位）、小数第三位（1/1000の位）とつづくよ。'],
          src: { x: x, kind: 'digit', pos: pos }
        };
      } else {
        var pc = pick(rng, cand);
        p = {
          type: 'choice', tag: 'shikumi',
          q: x + 'の「' + d[pc] + '」は、何の位の数字ですか。',
          options: PLACE_NAMES.slice(),
          a: PLACE_NAMES[pc],
          hints: ['小数点のすぐ右が小数第一位（1/10の位）だよ。', '小数点から右へいくつ目かな？'],
          src: { x: x, kind: 'choice', pos: pc }
        };
      }
    }
    return finish('decompose', p);
  };

  // 0.01を何こ集めた数？
  gens.countUnits = function (rng) {
    var unitE = wpick(rng, [[1, 1], [3, 2], [3, 3]]); // 0.1 / 0.01 / 0.001
    var n = wpick(rng, [[3, ri(rng, 11, 99)], [4, ri(rng, 101, 999)], [2, ri(rng, 1001, 9999)]]);
    if (rng() < 0.15) n = ri(rng, 1, 9) * POW[unitE]; // 整数
    var x = fmt(n, unitE);
    var u = UNIT_STR[unitE];
    var reverse = rng() < 0.3;
    var p;
    if (!reverse) {
      p = {
        type: 'fill', tag: 'shikumi',
        q: '□にあてはまる数を書きましょう。',
        parts: [x + 'は、' + u + 'を', { a: String(n) }, 'こ集めた数です。'],
        hints: [
          '1は' + u + 'を' + POW[unitE] + 'こ集めた数だよ。',
          '位ごとに考えよう。それぞれの位の数は、' + u + 'が何こ分かな？',
          '全部のこ数を合わせよう。'
        ],
        src: { x: x, e: unitE, reverse: false }
      };
    } else {
      p = {
        type: 'fill', tag: 'shikumi',
        q: '□にあてはまる数を書きましょう。',
        parts: [u + 'を' + n + 'こ集めた数は', { a: x }, 'です。'],
        hints: [
          u + 'を' + POW[unitE] + 'こ集めると1になるよ。',
          n + 'こを、' + POW[unitE] + 'こずつのまとまりと、のこりに分けて考えよう。'
        ],
        src: { x: x, e: unitE, reverse: true, n: n }
      };
    }
    return finish('countUnits', p);
  };

  // 大小（不等号）
  function randDec(rng, maxInt, e) {
    return ri(rng, 0, maxInt) * 1000 + ri(rng, 0, POW[e] - 1) * POW[3 - e];
  }
  gens.compare = function (rng) {
    var x, y, t;
    var kind = wpick(rng, [[3, 'prefix'], [3, 'len'], [2, 'int'], [2, 'random']]);
    for (t = 0; t < 100; t++) {
      if (kind === 'prefix') { // 0.43 と 0.425 / 0.432
        var base = ri(rng, 0, 9) * 1000 + ri(rng, 1, 99) * 10;
        x = base;
        y = base + (rng() < 0.5 ? ri(rng, 1, 9) : -ri(rng, 1, 9));
      } else if (kind === 'len') { // 0.21 と 0.189
        var ip = ri(rng, 0, 9) * 1000;
        x = ip + ri(rng, 1, 9) * 100 + ri(rng, 0, 9) * 10;

      return wordProblem('wordSub', lv, sc, [fmt(a, 2), String(b)], '-', sc);
    }
    if (kind === 'two') {
      sc = pick(rng, WORD_SUB2);
      for (t = 0; t < 100; t++) {
        a = rd(rng, sc.r[0][0], sc.r[0][1], pick(rng, [0, 1]));
        b = rd(rng, sc.r[1][0], sc.r[1][1], 2);
        c = rd(rng, sc.r[2][0], sc.r[2][1], 1);
        if (a > b + c) break;
      }
      return wordProblem('wordSub', lv, sc, [fmt(a, 2), fmt(b, 2), fmt(c, 2)], '-');
    }
    sc = pick(rng, WORD_SUB);
    for (t = 0; t < 100; t++) {
      a = rd(rng, sc.r[0][0], sc.r[0][1], 0);
      b = rd(rng, sc.r[1][0], Math.min(sc.r[1][1], a - 1), e12(rng));
      if (a > b) break;
    }
    return wordProblem('wordSub', lv, sc, [fmt(a, 2), fmt(b, 2)], '-');
  }

  var NAMES = ['masuRead', 'unitConvert', 'compose', 'decompose', 'countUnits',
    'compare', 'order', 'times10', 'numberlineRead', 'hissanAdd', 'hissanSub', 'laws',
    'threeSum', 'wordAdd', 'wordSub'];
  var LEVELS = ['easy', 'normal', 'hard'];

  // make(name, rng?, {level}?)  level 省略・'normal' は今までと同じ問題
  function make(name, rng, opts) {
    if (!gens[name]) throw new Error('unknown generator: ' + name);
    var r = typeof rng === 'function' ? rng : Math.random;
    var lv = opts && (opts.level === 'easy' || opts.level === 'hard') ? opts.level : null;
    var p = lv && LV[lv][name] ? LV[lv][name](r) : gens[name](r, lv || undefined);
    if (p.fig === undefined) delete p.fig;
    return p;
  }

  var G = {
    make: make,
    names: function () { return NAMES.slice(); },
    LEVELS: LEVELS,
    hissanHints: hissanHints,
    util: { fmt: fmt, parse: parse, decimals: decimals, unitAnswer: unitAnswer, carryCount: carryCount, borrowCount: borrowCount }
  };
  S.Generators = G;
  if (typeof module !== 'undefined' && module.exports) module.exports = G;
})((function () {
  var root = typeof window !== 'undefined' ? window : globalThis;
  return (root.Shosu = root.Shosu || {});
})());

<script>/* js/matome.js */
/* matome.js — まとめモードの問題選びと時間（担当I）
 * Shosu.Matome.build({level, minutes, weak?, rng?}) -> { problems, seconds, total }
 * Shosu.Matome.estimate(problem, level) -> 秒
 * 7つの内容（TAGS）を順番にかわるがわる出す。×が多かった内容（weak）は少し多めに出す。
 * 問題そのもの（src つき）を返すので、つづきから用にはそのまま保存すればよい。
 */
(function (S) {
  'use strict';

  var LEVELS = [{ id: 'easy', label: 'かんたん' }, { id: 'normal', label: 'ふつう' }, { id: 'hard', label: 'むずかしい' }];
  var TIMES = [5, 10, 15, 20];
  var TAGS = ['hyoshikata', 'shikumi', 'daisho', 'jubai', 'tashizan', 'hikizan', 'kimari'];
  var TAG_LABELS = {
    hyoshikata: '表し方・単位', shikumi: 'しくみ・数の構成', daisho: '大小', jubai: '10倍・1/10',
    tashizan: 'たし算', hikizan: 'ひき算', kimari: '計算のきまり'
  };

  // 内容ごとの生成器と重み（レベル別）
  var POOLS = {
    easy: {
      hyoshikata: [['masuRead', 1], ['unitConvert', 1], ['numberlineRead', 1]],
      shikumi: [['compose', 1], ['decompose', 1], ['countUnits', 1]],
      daisho: [['compare', 1]],                         // かんたんは2つの数の大小だけ
      jubai: [['times10', 1]],
      tashizan: [['hissanAdd', 1]],
      hikizan: [['hissanSub', 1]],
      kimari: [['laws', 1]]
    },
    normal: {
      hyoshikata: [['masuRead', 1], ['unitConvert', 1], ['numberlineRead', 1]],
      shikumi: [['compose', 1], ['decompose', 1], ['countUnits', 1]],
      daisho: [['compare', 1], ['order', 1]],
      jubai: [['times10', 1]],
      tashizan: [['hissanAdd', 1]],
      hikizan: [['hissanSub', 1]],
      kimari: [['laws', 1]]
    },
    hard: {
      hyoshikata: [['masuRead', 1], ['unitConvert', 1], ['numberlineRead', 1]],
      shikumi: [['compose', 1], ['decompose', 1], ['countUnits', 1]],
      daisho: [['compare', 1], ['order', 1]],
      jubai: [['times10', 1]],
      tashizan: [['hissanAdd', 2], ['wordAdd', 2], ['threeSum', 1]],
      hikizan: [['hissanSub', 2], ['wordSub', 2]],
      kimari: [['laws', 1]]
    }
  };

  // 1問の目安（秒）。5分で6〜8問、20分で25〜30問になるように合わせてある
  var BASE = { fill: 40, choice: 35, order: 45, hissan: 60 };
  var WORD = 70, THREE = 55, EXTRA_SLOT = 10;
  var FACTOR = { easy: 0.9, normal: 0.95, hard: 0.97 };

  function G() {
    if (S.Generators) return S.Generators;
    if (typeof require === 'function') return require('./generators.js');
    throw new Error('Shosu.Generators がありません');
  }

  function estimate(p, level) {
    var gen = p && p.src && p.src.gen;
    var s;
    if (gen === 'wordAdd' || gen === 'wordSub') s = WORD;
    else if (gen === 'threeSum') s = THREE;
    else s = BASE[p.type] || 40;
    if (p.type === 'fill' && Array.isArray(p.parts)) {
      var n = p.parts.filter(function (x) { return x && typeof x === 'object'; }).length;
      if (n > 1) s += EXTRA_SLOT * Math.min(n - 1, 3);
    }
    return Math.round(s * (FACTOR[level] || 1));
  }

  // 同じ問題かどうか（数・文が同じなら同じ）
  function signature(p) {
    return JSON.stringify([p.type, p.q || '', p.parts || null, p.items ? p.items.slice().sort() : null, p.op || '', p.a || '', p.b || '', p.fig || null]);
  }

  function wpick(rng, list) {
    var sum = 0, i;
    for (i = 0; i < list.length; i++) sum += list[i][1];
    var r = rng() * sum;
    for (i = 0; i < list.length; i++) { r -= list[i][1]; if (r < 0) return list[i][0]; }
    return list[list.length - 1][0];
  }

  function build(opts) {
    opts = opts || {};
    var level = opts.level === 'easy' || opts.level === 'hard' ? opts.level : 'normal';
    var minutes = Number(opts.minutes) > 0 ? Number(opts.minutes) : 10;
    var rng = typeof opts.rng === 'function' ? opts.rng : Math.random;
    var weak = opts.weak || {};
    var pool = POOLS[level];
    var target = minutes * 60;
    var Gen = G();

    // 内容の重み：×の割合 0〜1 で 1〜1.5 倍
    var w = {}, credit = {}, sumW = 0;
    TAGS.forEach(function (t) {
      var x = Number(weak[t]);
      x = isFinite(x) ? Math.max(0, Math.min(1, x)) : 0;
      w[t] = 1 + 0.5 * x;
      credit[t] = rng() * 0.5; // はじめの順番をばらす
      sumW += w[t];
    });
    // にがてな内容は先に出しはじめる（短い時間でも1回多く出るように）
    TAGS.forEach(function (t) { credit[t] += (w[t] - 1) * sumW / 4; });

    var genUse = {};   // 内容ごとに、生成器を使った回数
    var lastGen = {};  // 内容ごとに、前に使った生成器
    var seen = {};
    var problems = [], seconds = [], total = 0, prevTag = null;

    for (var guard = 0; guard < 200; guard++) {
      // 次の内容：ためた点がいちばん多いもの（前と同じ内容はのぞく）
      TAGS.forEach(function (t) { credit[t] += w[t] + (rng() - 0.5) * 0.4; });
      var best = null;
      TAGS.forEach(function (t) {
        if (t === prevTag) return;
        if (best === null || credit[t] > credit[best]) best = t;
      });
      credit[best] -= sumW;

      var p = makeFor(best);
      if (!p) continue;
      var sec = estimate(p, level);
      // 目安の時間をこえすぎないところで止める（最低3問）
      if (problems.length >= 3 && total + sec / 2 > target) break;
      seen[signature(p)] = true;
      p.id = 'M-' + (problems.length + 1);
      problems.push(p);
      seconds.push(sec);
      total += sec;
      prevTag = best;
    }
    return { problems: problems, seconds: seconds, total: total };

    function makeFor(tag) {
      var list = pool[tag];
      var use = genUse[tag] || (genUse[tag] = {});
      // 使った回数が少ない生成器を優先し、前と同じ生成器はなるべくさける
      var cand = list.map(function (g) {
        var n = use[g[0]] || 0;
        var k = g[1] / (1 + n);
        if (list.length > 1 && lastGen[tag] === g[0]) k *= 0.25;
        return [g[0], k];
      });
      for (var t = 0; t < 40; t++) {
        var name = wpick(rng, cand);
        var p = Gen.make(name, rng, { level: level });
        if (seen[signature(p)]) continue;
        use[name] = (use[name] || 0) + 1;
        lastGen[tag] = name;
        if (!p.tag) p.tag = tag;
        return p;
      }
      return null;
    }
  }

  var M = {
    LEVELS: LEVELS,
    TIMES: TIMES,
    TAGS: TAGS,
    TAG_LABELS: TAG_LABELS,
    POOLS: POOLS,
    build: build,
    estimate: estimate,
    signature: signature
  };
  S.Matome = M;
  if (typeof module !== 'undefined' && module.exports) module.exports = M;
})((function () {
  var root = typeof window !== 'undefined' ? window : globalThis;
  return (root.Shosu = root.Shosu || {});
})());

</script>
<script>/* js/demos/core.js */
/* demos/core.js : 「みる」教材の登録・表示と、共通のUI部品
 * Shosu.Demos.register(id, {title, mount(el, opts) -> {destroy()}})
 * Shosu.Demos.mount(el, id, opts) -> {destroy()}
 * Shosu.Demos.list() -> [{id, title}]
 * Shosu.Demos.ui   : h, button, stepper, keypad, askNumbers, askNumber, segmented
 * Shosu.Demos.num  : 小数を整数で安全にあつかう道具
 */
(function (S) {
  'use strict';
  var registry = {}, order = [];

  /* ---------- 小数の道具（浮動小数の誤差を出さない） ---------- */
  var num = {
    /* 小数部分のけた数 */
    scale: function (str) {
      str = String(str); var i = str.indexOf('.');
      return i < 0 ? 0 : str.length - i - 1;
    },
    /* '4.05' を 10^sc 倍した整数に（sc 省略時は自分のけた数） */
    toInt: function (str, sc) {
      str = String(str).trim();
      if (sc == null) sc = num.scale(str);
      var neg = str.charAt(0) === '-'; if (neg) str = str.slice(1);
      var i = str.indexOf('.');
      var ip = i < 0 ? str : str.slice(0, i), dp = i < 0 ? '' : str.slice(i + 1);
      while (dp.length < sc) dp += '0';
      dp = dp.slice(0, sc);
      var v = parseInt((ip || '0') + dp, 10) || 0;
      return neg ? -v : v;
    },
    /* 整数 n / 10^sc を文字列に。keepZeros で末尾の0を残す */
    fromInt: function (n, sc, keepZeros) {
      var neg = n < 0; n = Math.abs(Math.round(n));
      var str = String(n);
      if (sc > 0) {
        while (str.length <= sc) str = '0' + str;
        str = str.slice(0, str.length - sc) + '.' + str.slice(str.length - sc);
        if (!keepZeros) str = str.replace(/0+$/, '').replace(/\.$/, '');
      }
      return (neg ? '-' : '') + str;
    },
    trim: function (str) { return num.fromInt(num.toInt(str), num.scale(str)); },
    add: function (a, b) {
      var sc = Math.max(num.scale(a), num.scale(b));
      return num.fromInt(num.toInt(a, sc) + num.toInt(b, sc), sc);
    },
    sub: function (a, b) {
      var sc = Math.max(num.scale(a), num.scale(b));
      return num.fromInt(num.toInt(a, sc) - num.toInt(b, sc), sc);
    },
    cmp: function (a, b) {
      var sc = Math.max(num.scale(a), num.scale(b));
      var x = num.toInt(a, sc), y = num.toInt(b, sc);
      return x < y ? -1 : x > y ? 1 : 0;
    },
    /* 10^k 倍（k は負でもよい） */
    shift: function (str, k) {
      var sc = num.scale(str), n = num.toInt(str, sc);
      sc -= k;
      if (sc < 0) { n = n * Math.pow(10, -sc); sc = 0; }
      return num.fromInt(n, sc);
    },
    valid: function (str) { return /^\d+(\.\d+)?$/.test(String(str)); },
    /* 読み方：1.26 -> 一点二六 */
    read: function (str) {
      var K = ['れい', '一', '二', '三', '四', '五', '六', '七', '八', '九'];
      str = String(str);
      var i = str.indexOf('.');
      var ip = i < 0 ? str : str.slice(0, i), dp = i < 0 ? '' : str.slice(i + 1);
      var n = parseInt(ip, 10) || 0, out = '';
      if (n === 0) out = 'れい';
      else {
        var units = [[1000, '千'], [100, '百'], [10, '十']];
        units.forEach(function (u) {
          var d = Math.floor(n / u[0]) % 10;
          if (d) out += (d === 1 ? '' : K[d]) + u[1];
        });
        if (n % 10) out += K[n % 10];
        if (n >= 10000) out = String(n);
      }
      if (dp) {
        out += '点';
        for (var j = 0; j < dp.length; j++) out += K[+dp.charAt(j)];
      }
      return out;
    }
  };

  /* ---------- DOM の道具 ---------- */
  function h(tag, attrs, kids) {
    var e = document.createElement(tag);
    if (attrs) for (var k in attrs) {
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') e.className = v;
      else if (k === 'text') e.textContent = v;
      else if (k === 'html') e.innerHTML = v;
      else if (k === 'style' && typeof v === 'object') for (var sk in v) e.style[sk] = v[sk];
      else if (k.slice(0, 2) === 'on' && typeof v === 'function') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v === true ? '' : v);
    }
    if (kids != null) (Array.isArray(kids) ? kids : [kids]).forEach(function (c) {
      if (c == null || c === false) return;
      e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
    });
    return e;
  }

  function button(label, onClick, opts) {
    opts = opts || {};
    var b = h('button', { type: 'button', 'class': 'sd-btn' + (opts.kind ? ' sd-btn-' + opts.kind : '') + (opts.cls ? ' ' + opts.cls : ''), title: opts.title, 'aria-label': opts.aria });
    if (label instanceof Node) b.appendChild(label); else b.textContent = label;
    // 「つぎへ ▶」の矢印は、自作のSVG（Shosu.Icons）にする
    if (!(label instanceof Node) && S.Icons && S.Icons.arrows) { try { S.Icons.arrows(b); } catch (e) {} }
    b.addEventListener('click', function (ev) { if (!b.disabled && onClick) onClick(ev); });
    return b;
  }

  /* ＋/− つきの数 */
  function stepper(o) {
    var val = o.value || 0;
    var minus = button('−', function () { set(val - (o.step || 1), true); }, { kind: 'round', aria: 'へらす' });
    var plus = button('＋', function () { set(val + (o.step || 1), true); }, { kind: 'round', aria: 'ふやす' });
    var disp = h('span', { 'class': 'sd-stepper-val' });
    var el = h('span', { 'class': 'sd-stepper' + (o.vertical ? ' sd-stepper-v' : '') }, o.vertical ? [plus, disp, minus] : [minus, disp, plus]);
    if (o.color) disp.style.background = o.color;
    function render() {
      disp.textContent = o.format ? o.format(val) : String(val);
      minus.disabled = !o.allowUnder && o.min != null && val <= o.min;
      plus.disabled = !o.allowOver && o.max != null && val >= o.max;
    }
    function set(v, user) {
      if (user && o.onTry) { var r = o.onTry(v, val); if (r === false) return; if (typeof r === 'number') v = r; }
      if (o.min != null && v < o.min) v = o.min;
      if (o.max != null && v > o.max) v = o.max;
      val = v; render();
      if (user && o.onChange) o.onChange(val);
    }
    render();
    return { el: el, get: function () { return val; }, set: function (v) { set(v, false); } };
  }

  /* 数字キーパッド */
  function keypad(o) {
    o = o || {};
    var keys = ['7', '8', '9', '4', '5', '6', '1', '2', '3', '0', '.', '←'];
    var el = h('div', { 'class': 'sd-keypad' });
    keys.forEach(function (k) {
      var bsIcon = k === '←' && S.Icons && S.Icons.has('backspace');
      var bsLabel = bsIcon ? document.createElement('span') : null;
      if (bsLabel) { bsLabel.className = 'sd-bs'; bsLabel.innerHTML = S.Icons.get('backspace'); }
      var b = button(k === '←' ? (bsLabel || 'けす') : k, function () { if (o.onKey) o.onKey(k); }, { cls: 'sd-key', aria: k === '←' ? '1文字けす' : k });
      if (k === '.' && o.allowDot === false) b.disabled = true;
      el.appendChild(b);
    });
    return el;
  }

  /* キーパッドつきの入力ダイアログ（いくつかの欄） */
  function askNumbers(o) {
    var fields = o.fields.map(function (f) { return { label: f.label, value: String(f.value == null ? '' : f.value), fresh: true }; });
    var cur = 0;
    var maxLen = o.maxLen || 7;
    var back = h('div', { 'class': 'sd-modal-back' });
    var msg = h('div', { 'class': 'sd-modal-msg' });
    var fieldEls = fields.map(function (f, i) {
      var v = h('span', { 'class': 'sd-field-val' });
      var e = h('button', { type: 'button', 'class': 'sd-field' }, [f.label ? h('span', { 'class': 'sd-field-label' }, f.label) : null, v]);
      e.addEventListener('click', function () { cur = i; render(); });
      return { el: e, v: v };
    });
    function render() {
      fieldEls.forEach(function (fe, i) {
        fe.v.textContent = fields[i].value || ' ';
        fe.el.classList.toggle('on', i === cur);
      });
    }
    function onKey(k) {
      var f = fields[cur];
      if (f.fresh) { f.fresh = false; if (k !== '←') f.value = ''; }
      msg.textContent = '';
      if (k === '←') f.value = f.value.slice(0, -1);
      else if (k === '.') { if (f.value.indexOf('.') < 0 && o.allowDot !== false) f.value = (f.value || '0') + '.'; }
      else if (f.value.length < maxLen) f.value = (f.value === '0' ? '' : f.value) + k;
      render();
    }
    function close() { document.removeEventListener('keydown', onDoc); if (back.parentNode) back.parentNode.removeChild(back); }
    function ok() {
      var vals = fields.map(function (f) { return f.value.replace(/\.$/, ''); });
      for (var i = 0; i < vals.length; i++) if (!num.valid(vals[i])) { cur = i; render(); msg.textContent = '数を入れてね'; return; }
      if (o.validate) { var err = o.validate(vals); if (err) { msg.textContent = err; return; } }
      close();
      if (o.onOK) o.onOK(vals);
    }
    function onDoc(ev) {
      if (/^[0-9.]$/.test(ev.key)) onKey(ev.key);
      else if (ev.key === 'Backspace') onKey('←');
      else if (ev.key === 'Enter') ok();
      else if (ev.key === 'Escape') close();
      else if (ev.key === 'Tab') { cur = (cur + 1) % fields.length; render(); ev.preventDefault(); }
    }
    document.addEventListener('keydown', onDoc);
    var box = h('div', { 'class': 'sd-modal', role: 'dialog' }, [
      h('div', { 'class': 'sd-modal-title' }, o.title || '数を入れよう'),
      h('div', { 'class': 'sd-fields' }, fieldEls.map(function (f) { return f.el; })),
      msg,
      keypad({ onKey: onKey, allowDot: o.allowDot }),
      h('div', { 'class': 'sd-row sd-modal-btns' }, [
        button('やめる', close, { kind: 'sub' }),
        button('けってい', ok, { kind: 'main' })
      ])
    ]);
    back.appendChild(box);
    back.addEventListener('click', function (ev) { if (ev.target === back) close(); });
    document.body.appendChild(back);
    render();
    return { close: close };
  }
  function askNumber(o) {
    return askNumbers({
      title: o.title, maxLen: o.maxLen, allowDot: o.allowDot,
      fields: [{ label: o.label, value: o.value }],
      validate: o.validate ? function (v) { return o.validate(v[0]); } : null,
      onOK: function (v) { if (o.onOK) o.onOK(v[0]); }
    });
  }

  /* えらぶボタンの列 */
  function segmented(options, value, onChange) {
    var el = h('div', { 'class': 'sd-seg', role: 'tablist' });
    var btns = options.map(function (op) {
      var b = button(op.label, function () { set(op.value, true); }, { cls: 'sd-seg-btn' });
      el.appendChild(b);
      return b;
    });
    function set(v, user) {
      value = v;
      btns.forEach(function (b, i) { b.classList.toggle('on', options[i].value === v); b.setAttribute('aria-selected', options[i].value === v); });
      if (user && onChange) onChange(v);
    }
    set(value, false);
    return { el: el, set: function (v) { set(v, false); }, get: function () { return value; } };
  }

  /* 位の名前（HTML） 例: p=-1 -> 1/10の位 */
  function placeNameEl(p, withSub) {
    var K = { '3': '千', '2': '百', '1': '十', '0': '一' };
    if (p >= 0) return h('span', { 'class': 'sd-pname' }, K[p] + 'の位');
    var sub = { '-1': '小数第一位', '-2': '小数第二位', '-3': '小数第三位' }[p];
    return h('span', { 'class': 'sd-pname' }, [
      h('span', { 'class': 'sd-frac' }, [h('span', null, '1'), h('span', null, String(Math.pow(10, -p)))]),
      'の位',
      withSub ? h('small', { 'class': 'sd-pname-sub' }, sub) : null
    ]);
  }

<script>/* js/demos/masu.js */
/* demos/masu.js : ますメーカー（opts.level 2|3） */
(function (S) {
  'use strict';
  var D = S.Demos, ui = D.ui, h = ui.h, num = D.num;

  D.register('masu', {
    title: 'ますメーカー',

<!DOCTYPE html>
<html lang="ja">
<head>
<!-- 小数アプリ（1ファイル版） 作成日 2026-11-21 -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小数コスモス 〜小数の星を集める旅〜</title>
<meta name="theme-color" content="#141a4a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23141a4a'/%3E%3Ccircle cx='12' cy='14' r='1.6' fill='%23fff'/%3E%3Ccircle cx='52' cy='52' r='1.4' fill='%23cfd6ff'/%3E%3Ccircle cx='28' cy='36' r='14' fill='%238a6cf0'/%3E%3Cellipse cx='28' cy='36' rx='25' ry='7' fill='none' stroke='%23ffd34d' stroke-width='3.4' transform='rotate(-20 28 36)'/%3E%3Cpath d='M14.6 33a14 14 0 0 1 27.2-5' fill='none' stroke='%238a6cf0' stroke-width='3.8'/%3E%3Cpath d='M49 5C50 12 52 14 59 15 52 16 50 18 49 25 48 18 46 16 39 15 46 14 48 12 49 5Z' fill='%23ffd34d'/%3E%3C/svg%3E">
<style>/* css/style.css */
/* 小数アプリ 共通スタイル（担当B）。宇宙のデザイン（夜空・星・ロゴ）は担当K */
:root {
  /* 位の色（教科書に近い色）。担当Cの図・教材もこの変数を使う */
  --c-hundreds: #a8d8ee;     /* 百の位：水色 */
  --c-tens: #a9dba4;         /* 十の位：緑 */
  --c-ones: #f8dc6b;         /* 一の位：黄 */
  --c-tenths: #ddd0f2;       /* 1/10の位：うす紫 */
  --c-hundredths: #b49ade;   /* 1/100の位：紫 */
  --c-thousandths: #b9b0c8;  /* 1/1000の位：灰紫 */

  /* 小単元の色 */
  --su-1: #4a7fc1;  /* 小数の表し方 */
  --su-2: #4e9a68;  /* 小数のしくみ */
  --su-3: #d27a2c;  /* 小数のたし算とひき算 */
  --su-4: #8a68b5;  /* 単元のまとめ */

  /* 小単元の色（夜空の上で使う明るい色） */
  --su-1-glow: #9cc4ff;
  --su-2-glow: #93e0ac;
  --su-3-glow: #ffbd80;
  --su-4-glow: #cdb8ff;

  /* 夜空（担当K）。夜空の上の文字は --night-ink / --night-soft、明るいパネルの中は --ink */
  --night-0: #0b1033;
  --night-1: #141a4a;
  --night-2: #241a5c;
  --night-3: #3a2378;
  --night-ink: #f1f2ff;
  --night-soft: #c6cbf2;
  --glass: rgba(255, 255, 255, .07);
  --glass-line: rgba(255, 255, 255, .18);
  --gold: #ffd34d;
  --gold-deep: #f5b81c;
  --gold-soft: #fff1b0;
  --aqua: #9fd8ff;
  --lavender: #c7b6ff;

  --bg: #f4f5fb;        /* 明るいパネルの地の色 */
  --card: #ffffff;
  --ink: #232b48;
  --ink-soft: #545e7e;
  --line: #d3d7e6;
  --primary: #4338a8;
  --primary-ink: #ffffff;
  --ok: #d23c3c;        /* ○は赤 */
  --ok-bg: #fdeeee;
  --good: #2f8a4c;
  --good-bg: #e9f6ec;
  --ng: #3a6fb0;        /* ×はおだやかな青 */
  --ng-bg: #e8f0fb;
  --warn: #b98a00;
  --warn-bg: #fff5c4;
  --radius: 12px;
  --font: "UD デジタル 教科書体 N-R", "UD Digi Kyokasho N-R", "UD デジタル 教科書体 NK-R", "BIZ UDPゴシック", "BIZ UDPGothic", Meiryo, "メイリオ", sans-serif;
  --num-font: "UD デジタル 教科書体 N-R", "UD Digi Kyokasho N-R", "BIZ UDPゴシック", Meiryo, sans-serif;
}

html { font-size: 18px; }
html.big-text { font-size: 22.5px; }  /* 提示モード：1.25倍 */
* { box-sizing: border-box; }
html { background: var(--night-1); }
body {
  margin: 0;
  min-height: 100vh;
  background: transparent;
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
a { color: inherit; }
[hidden] { display: none !important; }

/* ---------- ボタン ---------- */
.btn, button.tab, .seg-btn {
  font-family: inherit;
  font-size: 1rem;
  min-height: 48px;
  min-width: 48px;
  padding: 0.4em 1.1em;
  border-radius: 999px;
  border: 2px solid var(--line);
  background: var(--card);
  color: var(--ink);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.3em;
  text-decoration: none;
  touch-action: manipulation;
  user-select: none;
  transition: transform .08s, background .15s, border-color .15s;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.45; cursor: default; transform: none; }
.btn.primary { background: linear-gradient(135deg, #5245c4, #3a2f96); border-color: #3a2f96; color: var(--primary-ink); font-weight: bold; }
.btn.danger { background: #fff; border-color: #c84a4a; color: #b03030; }
.btn.small { min-height: 40px; font-size: 0.85rem; padding: 0.2em 0.9em; }
.btn:focus-visible { outline: 3px solid #f0a500; outline-offset: 2px; }

/* ---------- 上のバー ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 0.8rem;
  padding: 0.5rem 1.2rem;
  background: linear-gradient(100deg, rgba(12,16,56,.94) 0%, rgba(30,26,88,.94) 60%, rgba(52,32,112,.94) 100%);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  color: var(--night-ink);
  border-bottom: 1px solid rgba(255, 211, 77, .35);
  box-shadow: 0 3px 14px rgba(4, 6, 30, .45);
  min-height: 64px;
}
.topbar-title { flex: 1; display: flex; align-items: baseline; gap: 0.8rem; min-width: 0; }
.topbar h1 { font-size: 1.3rem; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-sub { font-size: 0.9rem; color: var(--night-soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .btn.back { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.38); color: #fff; }
.topbar .btn.back:hover { border-color: var(--gold); }

.gear {
  position: relative; width: 52px; height: 52px; border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,.22); background: rgba(255,255,255,.08); color: #e4e7ff; font-size: 1rem; cursor: pointer;
  touch-action: none; user-select: none; -webkit-user-select: none; flex: none;
  display: inline-flex; align-items: center; justify-content: center; padding: 0;
}
.gear-icon { position: relative; z-index: 1; opacity: 0.9; display: inline-flex; }
.gear-icon .ic { width: 28px; height: 28px; }
.gear-ring {
  position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(#ffd166 0deg, transparent 0deg);
}
.gear.pressing .gear-ring { animation: gearfill 1.5s linear forwards; }
@property --deg { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
@keyframes gearfill { from { --deg: 0deg; } to { --deg: 360deg; } }
.gear.pressing .gear-ring { background: conic-gradient(rgba(255,209,102,.85) var(--deg), transparent var(--deg)); }

main { max-width: 1240px; margin: 0 auto; padding: 1rem 1.4rem 3rem; }
h2 { font-size: 1.15rem; margin: 0.6rem 0; }
.empty-note { padding: 1.5rem; text-align: center; color: var(--ink-soft); background: var(--card); border-radius: var(--radius); border: 2px dashed var(--line); }
main > h2 { color: var(--night-ink); }

/* ---------- ホーム（夜空の上。文字は明るい色） ---------- */
.home { color: var(--night-ink); }
.home h2 { color: var(--night-ink); display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 0.8rem; font-size: 1.25rem; }
.home h2::before {
  content: ''; flex: none; align-self: center; width: 0.6em; height: 0.6em; margin-right: -0.25rem;
  background: var(--gold); border-radius: 2px; transform: rotate(45deg); box-shadow: 0 0 10px rgba(255, 211, 77, .8);
}
.sec-note { font-size: 0.85rem; font-weight: normal; color: var(--night-soft); }
.sec-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 0.5rem; }
.legend { display: flex; flex-wrap: wrap; gap: 0.9rem; font-size: 0.8rem; color: var(--night-soft); }
.legend-item { display: inline-flex; align-items: center; gap: 0.35em; }
.legend-dot { width: 0.9em; height: 0.9em; border-radius: 50%; background: var(--su-glow); box-shadow: 0 0 6px var(--su-glow); }
.su-1 { --su: var(--su-1); --su-glow: var(--su-1-glow); } .su-2 { --su: var(--su-2); --su-glow: var(--su-2-glow); }
.su-3 { --su: var(--su-3); --su-glow: var(--su-3-glow); } .su-4 { --su: var(--su-4); --su-glow: var(--su-4-glow); }

/* 第1〜10時：星の旅の航路（カードの間を点線の航路でつなぐ） */
.lesson-grid { --lg-gap: 1.3rem; display: grid; grid-template-columns: repeat(5, 1fr); gap: 1rem var(--lg-gap); }
@media (max-width: 1100px) { .lesson-grid { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 800px) { .lesson-grid { grid-template-columns: repeat(2, 1fr); } }
.lesson-card {
  position: relative;
  display: flex; flex-direction: column; gap: 0.25rem;
  min-height: 136px;
  padding: 0.65rem 0.85rem 0.5rem;
  color: var(--night-ink);
  background: linear-gradient(165deg, rgba(56, 66, 150, .82) 0%, rgba(30, 26, 86, .9) 100%);
  border-radius: 16px;
  border: 1.5px solid rgba(255, 255, 255, .17);
  text-decoration: none;
  box-shadow: 0 6px 16px rgba(4, 6, 30, .38), inset 0 1px 0 rgba(255, 255, 255, .14);
  transition: transform .1s, border-color .15s, box-shadow .15s;
  touch-action: manipulation;
}
.lesson-card:hover { border-color: var(--su-glow); }
.lesson-card:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
.lesson-card:active { transform: scale(0.98); }
.lesson-card::after { /* 次のカードへの航路 */
  content: ''; position: absolute; pointer-events: none;
  top: 1.75rem; left: calc(100% + 1px); width: calc(var(--lg-gap) - 2px);
  border-top: 3px dotted rgba(255, 211, 77, .75);
}
.lesson-card:last-child::after, .lesson-card:nth-child(5n)::after { display: none; }
@media (max-width: 1100px) {
  .lesson-card:nth-child(5n)::after { display: block; }
  .lesson-card:nth-child(4n)::after, .lesson-card:last-child::after { display: none; }
}
@media (max-width: 800px) {
  .lesson-card:nth-child(n)::after { display: block; }
  .lesson-card:nth-child(2n)::after, .lesson-card:last-child::after { display: none; }
}
.lesson-card.lc-done { border-color: rgba(255, 211, 77, .7); box-shadow: 0 6px 16px rgba(4, 6, 30, .38), 0 0 14px rgba(255, 211, 77, .35), inset 0 1px 0 rgba(255,255,255,.14); }
.lc-no { display: flex; align-items: center; gap: 0.5rem; font-weight: bold; font-size: 1.05rem; color: var(--su-glow); }
.lc-node { /* 航路の上の星（番号） */
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: 2.1rem; height: 2.1rem; border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #ffffff 0 10%, var(--su-glow) 42%, var(--su) 100%);
  color: #0f1438; font-family: var(--num-font); font-size: 1.05rem; font-weight: bold;
  box-shadow: 0 0 0 3px rgba(255, 255, 255, .14), 0 0 12px var(--su-glow);
}
.lc-title { flex: 1; font-size: 0.95rem; line-height: 1.4; color: var(--night-ink); }
.lc-foot { display: flex; justify-content: space-between; align-items: center; }
.lc-page { font-size: 0.78rem; color: var(--night-soft); }
.stars { display: inline-flex; gap: 2px; font-size: 1.2rem; }
.star { display: inline-block; width: 1.3em; height: 1.3em; filter: grayscale(1) brightness(1.5) opacity(.32); }
.star.on { filter: drop-shadow(0 0 4px rgba(255, 211, 77, .65)); }

.home-review { margin-top: 1rem; }
.review-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 0.7rem; }
.review-btn {
  display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 0.6rem;
  min-height: 64px; padding: 0.5rem 1rem 0.5rem 0.8rem;
  color: var(--night-ink);
  background: linear-gradient(160deg, rgba(52, 60, 140, .7), rgba(28, 26, 84, .85));
  border: 1.5px solid rgba(255, 255, 255, .16); border-left: 6px solid var(--lavender); border-radius: 14px;
  text-decoration: none; font-weight: bold; touch-action: manipulation;
}
.review-btn:hover { border-color: var(--lavender); }
.rv-icon { grid-row: span 2; display: inline-flex; color: var(--lavender); }
.rv-icon .ic { width: 1.7rem; height: 1.7rem; }
.rv-title { grid-column: 2; }
.rv-count { grid-column: 2; font-weight: normal; font-size: 0.8rem; color: var(--night-soft); }
.home-extra { margin-top: 1.2rem; }
.extra-link {
  display: inline-flex; align-items: center; gap: 0.4em; min-height: 52px; padding: 0.3rem 1.2rem; border-radius: 999px;
  background: rgba(255, 255, 255, .1); border: 1.5px solid rgba(255, 255, 255, .25); color: var(--night-ink); text-decoration: none;
}
.extra-link:hover { border-color: var(--gold); }
.extra-link .ic { width: 1.3em; height: 1.3em; }

/* ---------- 各時 ---------- */
.meate {
  display: flex; align-items: center; gap: 0.8rem; color: var(--ink);
  background: var(--card); border: 3px solid var(--su, var(--primary)); border-radius: var(--radius);
  box-shadow: 0 4px 14px rgba(4, 6, 30, .3);
  padding: 0.6rem 1rem; font-size: 1.1rem;
}
.meate-label {
  flex: none; background: var(--su, var(--primary)); color: #fff; font-weight: bold;
  padding: 0.15em 0.7em; border-radius: 6px;
}
.tabs { display: flex; gap: 0.5rem; margin: 0.9rem 0 0; border-bottom: 3px solid var(--su, var(--primary)); }
button.tab {
  border-radius: 12px 12px 0 0; border-bottom: none; min-width: 9em; font-size: 1.1rem; font-weight: bold;
  background: #dfe2f4; border-color: #dfe2f4; color: #343d63;
}
button.tab:hover { background: #eef0fb; }
button.tab.on { background: var(--su, var(--primary)); border-color: var(--su, var(--primary)); color: #fff; }
.panel { background: var(--card); color: var(--ink); border-radius: 0 0 var(--radius) var(--radius); padding: 1rem; min-height: 300px; box-shadow: 0 8px 22px rgba(4, 6, 30, .35); }
.panel-foot { display: flex; justify-content: flex-end; margin-top: 1rem; }
.demo-holder { min-height: 200px; overflow-x: auto; }
.demo-head { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.demo-title { margin: 0 0 4px; font-size: 1.15rem; }

/* 問題を順に解く */
.set-progress { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.6rem; }
.set-progress .dot {
  width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: #fff;
  font-family: inherit; font-size: 0.85rem; color: var(--ink-soft); cursor: pointer; padding: 0;
}
.set-progress .dot.cur { border-color: var(--primary); border-width: 3px; color: var(--ink); font-weight: bold; }
.set-progress .dot.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.set-progress .dot.ng { background: var(--ng-bg); border-color: var(--ng); color: var(--ng); }
.set-nav { display: flex; align-items: center; justify-content: space-between; margin-top: 1rem; gap: 1rem; }
.set-count { color: var(--ink-soft); }

.matome-wrap { text-align: center; padding: 1rem; }
.done-msg { font-size: 1.5rem; font-weight: bold; color: var(--good); }
.summary-score { font-size: 1.1rem; margin: 0.4rem 0 1rem; }
.matome {
  text-align: left; margin: 1rem auto; max-width: 860px;
  border: 3px solid var(--su, var(--primary)); border-radius: var(--radius); padding: 0.8rem 1.2rem; background: #fffdf6;
}
.matome-label { display: inline-block; background: var(--su, var(--primary)); color: #fff; font-weight: bold; padding: 0.1em 0.8em; border-radius: 6px; margin-bottom: 0.4rem; }
.matome-text { font-size: 1.15rem; white-space: pre-line; }
.matome-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 0.8rem; margin-top: 1rem; }
.more-head { font-weight: bold; color: var(--su, var(--primary)); margin-bottom: 0.4rem; }

/* ---------- 問題 ---------- */
.problem { position: relative; padding: 0.4rem 0.2rem; }
.p-q { font-size: 1.2rem; margin-bottom: 0.6rem; padding-right: 110px; white-space: pre-line; }
.p-fig { margin: 0.4rem 0 0.8rem; max-width: 860px; }
.p-fig svg { max-width: 100%; height: auto; }
.p-body { margin: 0.4rem 0; }
.p-status { min-height: 1.6em; margin: 0.6rem 0; font-size: 1.1rem; }
.p-status.good .msg.praise { color: var(--ok); font-weight: bold; font-size: 1.3rem; }
.p-status.bad .msg { color: var(--ng); font-weight: bold; }
.p-status.warn .msg, .p-status.warn { color: #8a6500; }
.p-status .msg.tip { color: #8a5a00; font-weight: bold; font-size: 1.05rem; }
.p-actions { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
.p-actions .next { margin-left: auto; }
.p-hints { margin-top: 0.6rem; display: flex; flex-direction: column; gap: 0.4rem; }
.hint-item { background: #fff8e1; border-left: 6px solid #f0b400; padding: 0.4rem 0.8rem; border-radius: 6px; }
.hint-no { font-weight: bold; color: #a07000; margin-right: 0.6em; }
.p-explain:not(:empty) { margin-top: 0.6rem; background: #eef6ff; border-left: 6px solid #5a8fd0; padding: 0.4rem 0.8rem; border-radius: 6px; white-space: pre-line; }
.explain-label { font-weight: bold; color: #2f5f9a; margin-right: 0.6em; }
.p-memo { margin-top: 0.8rem; }
.p-note { margin-top: 0.6rem; font-size: 0.8rem; color: var(--ink-soft); }

/* 読み取った答え */
.read { display: inline-flex; align-items: baseline; gap: 0.4em; flex-wrap: wrap; }
.read-label { color: var(--ink-soft); font-size: 0.95rem; }
.read-value { font-family: var(--num-font); font-size: 1.6rem; font-weight: bold; letter-spacing: 0.05em; color: var(--ink); }
.rc.unsure { background: var(--warn-bg); outline: 2px solid #e2b500; border-radius: 4px; padding: 0 0.1em; }

/* 大きな ○ × */
.p-mark {
  position: absolute; top: -0.2rem; right: 0.2rem; width: 96px; height: 96px; pointer-events: none;
  opacity: 0; transform: scale(0.4); transition: opacity .2s, transform .25s cubic-bezier(.3,1.6,.6,1);
}
.p-mark.show { opacity: 1; transform: scale(1); }
.p-mark.ok { border: 12px solid var(--ok); border-radius: 50%; }
.p-mark.ng::before, .p-mark.ng::after {
  content: ''; position: absolute; left: 50%; top: 50%; width: 100px; height: 12px; margin: -6px 0 0 -50px;
  background: var(--ng); border-radius: 6px; transform: rotate(45deg);
}
.p-mark.ng::after { transform: rotate(-45deg); }

/* 答えの表示と自己採点 */
.answer-box { margin-top: 0.8rem; border: 2px solid #9db3d6; background: #f5f8fd; border-radius: var(--radius); padding: 0.6rem 1rem; }
.answer-title { font-weight: bold; color: #2f5f9a; }
.answer-main { font-size: 1.2rem; margin: 0.2rem 0; }
.answer-num { font-family: var(--num-font); font-size: 1.5rem; font-weight: bold; color: var(--ok); margin: 0 0.25em; }
.answer-note { font-size: 0.9rem; color: var(--ink-soft); margin-left: 0.4em; }
.answer-ask { color: var(--ink-soft); }
.self-row { display: flex; gap: 0.8rem; margin-top: 0.4rem; flex-wrap: wrap; }
.btn.self-ok { border-color: var(--ok); color: var(--ok); font-weight: bold; min-width: 10em; }
.btn.self-ng { border-color: var(--ng); color: var(--ng); font-weight: bold; min-width: 10em; }
.btn.misread { border-style: dashed; color: var(--ink-soft); }
.btn.hint { border-color: #e0b400; background: #fffbe8; }

/* fill */
.fill-line { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem 0.3rem; font-size: 1.35rem; line-height: 1.5; }
.fill-text { white-space: pre-wrap; }
.slot { display: inline-flex; align-items: flex-start; gap: 4px; padding: 0 0.2rem; }
.print-dot {
  font-family: var(--num-font); font-size: 3rem; font-weight: bold; line-height: 1;
  align-self: flex-start; margin-top: calc(var(--box, 76px) - 2.4rem); width: 0.4em; text-align: center;
}
.print-ch { font-size: 1.6rem; align-self: center; }

/* 手書きマス */
.digit-cell { display: inline-flex; flex-direction: column; align-items: center; gap: 3px; }
.digit-box {
  position: relative; background: #fff; border: 2.5px solid #7c879e; border-radius: 6px;
  box-shadow: inset 0 1px 3px rgba(0,0,0,.06); overflow: hidden;
}
.digit-box::before, .digit-box::after { content: ''; position: absolute; pointer-events: none; }
.digit-box::before { left: 50%; top: 8%; bottom: 8%; border-left: 1px dashed #e1e4ea; }
.digit-box::after { top: 50%; left: 8%; right: 8%; border-top: 1px dashed #e1e4ea; }
.digit-canvas { display: block; position: relative; z-index: 1; touch-action: none; cursor: crosshair; }
.digit-box.mark-ok { border-color: var(--good); background: var(--good-bg); }
.digit-box.mark-ng { border-color: var(--ng); background: var(--ng-bg); }
.digit-box.mark-unsure { border-color: #e2b500; background: var(--warn-bg); box-shadow: 0 0 0 3px rgba(226,181,0,.35); }
.db-clear {
  font-family: inherit; font-size: 0.75rem; height: 34px; border: 1.5px solid var(--line); border-radius: 8px;
  background: #f7f8fa; color: var(--ink-soft); cursor: pointer; touch-action: manipulation; padding: 0;
}
.db-clear:active { background: #e6e9ef; }

/* けいさんメモ */
.memo { border: 2px dashed #b8c0cf; border-radius: var(--radius); background: #fcfcf8; overflow: hidden; }
.memo-bar { display: flex; align-items: center; gap: 0.4rem; padding: 0.3rem 0.5rem; background: #f0f1ec; flex-wrap: wrap; }
.memo-label { font-weight: bold; color: var(--ink-soft); margin-right: auto; font-size: 0.9rem; }
.memo .tool { font-family: inherit; font-size: 0.85rem; min-height: 44px; min-width: 64px; border-radius: 8px; border: 2px solid var(--line); background: #fff; cursor: pointer; }
.memo .tool.on { border-color: var(--primary); background: #e7edf6; font-weight: bold; }
.memo-area { width: 100%; line-height: 0; }
.memo-canvas { display: block; touch-action: none; background-image: linear-gradient(#eceee6 1px, transparent 1px), linear-gradient(90deg, #eceee6 1px, transparent 1px); background-size: 24px 24px; }
.memo.memo-plain { border: 1px dashed #c9cfda; border-radius: 6px; background: #fbfbf7; }
.memo.memo-plain .memo-canvas { background-image: none; }

/* choice */
.choice-row { display: flex; flex-wrap: wrap; gap: 1rem; margin: 0.6rem 0; }
.choice-btn { min-width: 110px; min-height: 80px; font-size: 1.8rem; font-weight: bold; border-radius: 16px; border-width: 3px; }
.choice-btn.ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.choice-btn.ng { border-color: var(--ng); background: var(--ng-bg); color: var(--ng); }
.choice-btn:disabled { opacity: 0.4; }
.choice-btn.ok:disabled { opacity: 1; }

/* order */
.order-guide { color: var(--ink-soft); margin-bottom: 0.4rem; }
.order-pool, .order-answer { display: flex; flex-wrap: wrap; align-items: center; gap: 0.6rem; min-height: 76px; }
.order-answer { margin-top: 0.8rem; padding: 0.6rem; background: #f4f6fa; border-radius: var(--radius); }
.order-item { font-family: var(--num-font); font-size: 1.5rem; min-height: 64px; min-width: 90px; border-radius: 12px; border-width: 3px; font-weight: bold; }
.order-item.used { visibility: hidden; }
.order-item.placed { background: #fff; border-color: #8ea3c4; }
.order-item.placed.ok { border-color: var(--ok); color: var(--ok); }
.order-item.placed.ng { border-color: var(--ng); background: var(--ng-bg); color: var(--ng); }
.order-slot { display: inline-flex; align-items: center; justify-content: center; min-width: 90px; min-height: 64px; border: 2px dashed #b8c0cf; border-radius: 12px; color: #b8c0cf; font-size: 1rem; }
.order-sign { font-size: 1.6rem; font-weight: bold; color: var(--ink-soft); }

/* hissan（筆算） */
.hissan-wrap { display: flex; flex-wrap: wrap; gap: 1rem 2rem; align-items: flex-end; }
.hissan-grid {
  display: grid; align-items: end; column-gap: 0; row-gap: 4px;
  padding: 0.6rem 1rem 0.4rem; background: #fff; border: 2px solid var(--line); border-radius: var(--radius);
}
.carry-label { font-size: 0.7rem; color: var(--ink-soft); align-self: center; text-align: center; }
.carry-memo { height: 40px; }
.h-digit, .h-op, .h-dot {
  font-family: var(--num-font); font-size: calc(var(--cell) * 0.62); line-height: 1.15; text-align: center; font-weight: bold;
}
.h-digit { height: calc(var(--cell) * 0.8); border-radius: 6px; }
.h-digit.faint, .h-dot.faint { color: #c3c8d2; font-weight: normal; }
.h-op { color: var(--ink); }
.h-dot { align-self: end; line-height: 1; }
.h-line { height: 0; border-top: 4px solid var(--ink); margin: 2px 0 6px; }
.dot-zone {
  position: relative; align-self: stretch; margin: 0 1px; padding: 0; min-height: calc(var(--cell) + 36px);
  border: none; border-radius: 8px; background: transparent; cursor: pointer; touch-action: manipulation;
}
.dot-zone:hover, .dot-zone:focus-visible { background: rgba(61,90,128,.08); }
.dot-zone .dot-mark {
  position: absolute; left: 50%; top: calc(var(--cell) - 18px); width: 16px; height: 16px; margin-left: -8px;
  border-radius: 50%; border: 2px dashed #c9cfda;
}
.dot-zone.on .dot-mark { background: var(--ink); border: none; width: 18px; height: 18px; margin-left: -9px; }
.dot-zone.ng { background: var(--ng-bg); }
.hissan-tools { display: flex; flex-direction: column; gap: 0.5rem; align-items: flex-start; max-width: 320px; }
.hissan-tip { font-size: 0.9rem; color: var(--ink-soft); }

/* ---------- 先生メニュー ---------- */
.tcard { background: var(--card); color: var(--ink); border-radius: var(--radius); border: 2px solid var(--line); padding: 0.8rem 1.2rem; margin-bottom: 1rem; box-shadow: 0 6px 18px rgba(4, 6, 30, .3); }
.seg { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.seg-btn.on { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: bold; }
.tnote { font-size: 0.9rem; color: var(--ink-soft); }
.tnote.warn { color: #8a5a00; }
.rec-table { border-collapse: collapse; width: 100%; margin: 0.5rem 0 1rem; font-size: 0.9rem; }
.rec-table th, .rec-table td { border-bottom: 1px solid var(--line); padding: 0.35rem 0.6rem; text-align: center; }
.rec-table th.rec-label { text-align: left; font-weight: normal; }
.rec-table tr:first-child th { background: #eef1f6; font-weight: bold; }
.tcard .btn + .btn { margin-left: 0.6rem; }

/* ---------- 手書き練習 ---------- */
.practice .lead { font-size: 1.1rem; }
.pw-grid { display: grid; grid-template-columns: repeat(5, max-content); gap: 1rem 1.6rem; justify-content: start; }
.pw-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.pw-target { font-family: var(--num-font); font-size: 1.4rem; font-weight: bold; color: var(--ink-soft); }
.pw-res { min-height: 1.6em; font-weight: bold; }
.pw-res.ok { color: var(--good); }
.pw-res.ng { color: var(--ng); }
.pw-res.unsure { color: #8a6500; }
.pw-actions { display: flex; gap: 0.8rem; margin: 1rem 0 0.5rem; }
.pw-score { font-size: 1.05rem; min-height: 1.6em; }
.pw-tips { margin-top: 1rem; background: var(--card); border-radius: var(--radius); padding: 0.6rem 1rem; border: 2px solid var(--line); max-width: 640px; }
.pw-tips h3 { margin: 0 0 0.3rem; font-size: 1rem; }

/* ---------- トースト・ダイアログ ---------- */
.toast {
  position: fixed; left: 50%; bottom: 2rem; transform: translate(-50%, 20px); opacity: 0;
  background: rgba(20, 22, 70, .95); color: #fff; padding: 0.6rem 1.4rem; border-radius: 999px; z-index: 100;
  border: 1.5px solid rgba(255, 211, 77, .6); box-shadow: 0 4px 16px rgba(4, 6, 30, .4);
  transition: opacity .25s, transform .25s; pointer-events: none;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.modal-back { position: fixed; inset: 0; background: rgba(8, 10, 40, .6); display: flex; align-items: center; justify-content: center; z-index: 90; }
.modal { background: #fff; color: var(--ink); border-radius: 16px; border: 2px solid rgba(255, 211, 77, .7); padding: 1.4rem 1.6rem; max-width: 520px; width: 90%; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
.modal-msg { font-size: 1.1rem; margin-bottom: 1rem; }
.modal-row { display: flex; justify-content: flex-end; gap: 0.8rem; }

/* ---------- 位の色（汎用クラス） ---------- */
.pv-hundreds { --pv: var(--c-hundreds); }
.pv-tens { --pv: var(--c-tens); }
.pv-ones { --pv: var(--c-ones); }
.pv-tenths { --pv: var(--c-tenths); }
.pv-hundredths { --pv: var(--c-hundredths); }
.pv-thousandths { --pv: var(--c-thousandths); }
.pv-bg { background: var(--pv); }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* 書いている途中で画面がずれないように */
html, body { overflow-anchor: none; }

/* ---------- 星と称号のバッジ（中身は css/stars.css：担当H） ---------- */
.topbar-stars { flex: none; display: inline-flex; align-items: center; min-width: 0; max-width: 42vw; overflow: hidden; }
.topbar .topbar-stars + .gear, .topbar .topbar-stars + .btn { margin-left: 0.2rem; }
.pr-stars { color: var(--ink); }

/* ---------- とちゅうから ---------- */
.resume {
  max-width: 760px; margin: 1.2rem auto; padding: 1.6rem 1.6rem 1.4rem; color: var(--ink);
  background: #fffdf3; border: 3px solid #f0b400; border-radius: 18px;
  text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.08);
}
.resume-msg { font-size: 1.6rem; font-weight: bold; line-height: 1.4; }
.resume-sub { margin-top: 0.3rem; color: var(--ink-soft); font-size: 1.05rem; }
.resume-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 1rem; margin-top: 1.2rem; }
.resume-row .btn { min-height: 72px; min-width: 220px; font-size: 1.3rem; font-weight: bold; }
.resume-extra { margin-top: 1rem; }

/* ---------- ホーム：まとめモード・星のずかん ---------- */
.home-matome { margin-top: 1.1rem; display: grid; grid-template-columns: 1fr auto; gap: 0.8rem; align-items: stretch; }
@media (max-width: 800px) { .home-matome { grid-template-columns: 1fr; } }
.matome-entry {
  display: flex; align-items: center; gap: 1rem; min-height: 104px; padding: 0.8rem 1.4rem;
  border-radius: 18px; text-decoration: none; color: #fff;
  background:
    radial-gradient(1.5px 1.5px at 62% 22%, #fff 60%, transparent), radial-gradient(1px 1px at 78% 70%, #fff 60%, transparent),
    radial-gradient(1.5px 1.5px at 40% 82%, #ffe9a0 60%, transparent),
    linear-gradient(120deg, #23307a 0%, #4a3fa8 55%, #7a52c0 100%);
  border: 1.5px solid rgba(255, 211, 77, .55);
  box-shadow: 0 6px 18px rgba(4, 6, 30, .45), 0 0 18px rgba(140, 110, 255, .25); touch-action: manipulation; transition: transform .1s;
}
.matome-entry:hover { border-color: var(--gold); }
.matome-entry:active { transform: scale(0.99); }
.matome-entry-icon { flex: none; width: 64px; height: 64px; }
.matome-entry-text { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.matome-entry-title { font-size: 1.6rem; font-weight: bold; letter-spacing: 0.05em; }
.matome-entry-sub { font-size: 0.92rem; opacity: 0.9; }
.matome-entry-go { flex: none; display: inline-flex; align-items: center; gap: 0.35em; font-weight: bold; background: linear-gradient(180deg, #ffe27a, #f5b81c); color: #2a1a00; border-radius: 999px; padding: 0.5em 1.3em; box-shadow: 0 0 14px rgba(255, 211, 77, .45); }
.stars-entry {
  display: flex; flex-direction: column; justify-content: center; gap: 0.2rem; min-width: 240px; padding: 0.7rem 1.2rem;
  border-radius: 18px; text-decoration: none; color: var(--night-ink);
  background: linear-gradient(160deg, rgba(70, 46, 140, .85), rgba(24, 22, 78, .92));
  border: 1.5px solid rgba(199, 182, 255, .55); box-shadow: 0 6px 18px rgba(4, 6, 30, .4);
  touch-action: manipulation;
}
.stars-entry:hover { border-color: var(--gold); }
.stars-entry-title { display: inline-flex; align-items: center; gap: 0.4em; font-size: 1.3rem; font-weight: bold; color: var(--gold-soft); }
.stars-entry-title .ic { width: 1.5em; height: 1.5em; color: var(--night-ink); }
.stars-entry-sub { font-size: 0.85rem; color: var(--night-soft); }
.stars-entry-title-now { font-size: 0.95rem; font-weight: bold; color: var(--night-ink); }

/* ---------- まとめモード ---------- */
.mm-setup { max-width: 980px; margin: 0 auto; background: var(--card); color: var(--ink); box-shadow: 0 8px 22px rgba(4, 6, 30, .35); border-radius: 18px; padding: 1.2rem 1.6rem 1.4rem; border: 2px solid var(--line); }
.mm-lead { font-size: 1.1rem; margin: 0 0 0.4rem; }
.mm-h { font-size: 1.2rem; margin: 0.9rem 0 0.5rem; }
.mm-choices { display: grid; gap: 0.8rem; }
.mm-levels { grid-template-columns: repeat(3, 1fr); }
.mm-times { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 700px) { .mm-levels, .mm-times { grid-template-columns: repeat(2, 1fr); } }
.btn.mm-choice {
  flex-direction: column; gap: 0; min-height: 88px; border-radius: 16px; border-width: 3px;
  font-size: 1.4rem; font-weight: bold;
}
.btn.mm-choice.on { background: linear-gradient(135deg, #3a3796, #5a3fae); border-color: #3a3796; color: #fff; box-shadow: 0 0 0 4px rgba(255, 211, 77, .65); }
.mm-choice-sub { font-size: 0.9rem; font-weight: normal; opacity: 0.85; min-height: 1.3em; }
.mm-foot { display: flex; justify-content: center; margin-top: 1.4rem; }
.btn.mm-start { min-height: 76px; min-width: 300px; font-size: 1.6rem; }
.mm-note { color: var(--ink-soft); text-align: center; margin: 0.8rem 0 0; }

.mm-status {
  position: sticky; top: 64px; z-index: 15;
  display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap;
  margin: -0.2rem 0 0.8rem; padding: 0.5rem 1rem;
  background: linear-gradient(100deg, #141a4a, #34226e); color: #fff; border-radius: 14px;
  border: 1px solid rgba(255, 211, 77, .4); box-shadow: 0 4px 14px rgba(4, 6, 30, .4);
}
.mm-st-level { font-size: 0.95rem; opacity: 0.85; }
.mm-st-time, .mm-st-left { font-size: 1.6rem; font-weight: bold; font-family: var(--num-font); font-variant-numeric: tabular-nums; }
.mm-st-time.soon { color: #ffd166; }
.mm-st-time.over { color: #ffb4a8; font-size: 1.3rem; }
.mm-st-left { margin-right: auto; }
.mm-status .btn.mm-st-end { background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.45); color: #fff; }
.mm-area { background: var(--card); color: var(--ink); border-radius: var(--radius); padding: 1rem; box-shadow: 0 8px 22px rgba(4, 6, 30, .35); }
.mm-timeup { text-align: center; }
.mm-timeup-msg { font-size: 1.8rem; font-weight: bold; margin-bottom: 0.4rem; }
.mm-timeup-row { justify-content: center; }
.mm-timeup-row .btn { min-height: 64px; min-width: 180px; font-size: 1.2rem; }

.mm-result { max-width: 900px; margin: 0 auto; background: var(--card); color: var(--ink); box-shadow: 0 8px 22px rgba(4, 6, 30, .35); border-radius: 18px; padding: 1.2rem 1.6rem 1.4rem; text-align: center; }
.mm-score { margin: 0.4rem 0; }
.mm-score-big { font-size: 3rem; font-weight: bold; color: var(--ok); font-family: var(--num-font); }
.mm-score-of { font-size: 1.4rem; color: var(--ink-soft); }
.mm-meta { display: flex; justify-content: center; flex-wrap: wrap; gap: 0.4rem 1.4rem; color: var(--ink-soft); }
.mm-tags { text-align: left; margin-top: 0.6rem; }
.mm-tag { display: grid; grid-template-columns: 11em 1fr 5em; align-items: center; gap: 0.8rem; padding: 0.3rem 0; }
.mm-tag-name { font-weight: bold; }
.mm-tag-meter { height: 16px; background: #eceef2; border-radius: 999px; overflow: hidden; }
.mm-tag-fill { display: block; height: 100%; background: #4e9a68; border-radius: 999px; }
.mm-tag.weak .mm-tag-fill { background: #d27a2c; }
.mm-tag.weak .mm-tag-name { color: #b0581a; }
.mm-tag-num { text-align: right; font-family: var(--num-font); }
.mm-weak { margin-top: 0.8rem; font-size: 1.1rem; font-weight: bold; }
.mm-got { margin-top: 0.6rem; }
.mm-got-list { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 0.5rem; }
.mm-got-list li { background: #fff6d6; border: 2px solid #f0b400; border-radius: 999px; padding: 0.2em 1em; font-weight: bold; }

/* ======================================================================
   宇宙のデザイン（担当K）
   夜空の背景・ロゴ・アイコン。問題を解く部分は明るいパネルの上に置く。
   ====================================================================== */

/* 夜空：深い紺〜紫のグラデーションと、小さな星のドット（画像ファイルは使わない） */
body::before {
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(circle at 23px 41px, rgba(255,255,255,.9) 0 1px, transparent 1.6px),
    radial-gradient(circle at 141px 97px, rgba(255,255,255,.75) 0 1.2px, transparent 1.8px),
    radial-gradient(circle at 87px 163px, rgba(255,233,160,.9) 0 1.3px, transparent 2px),
    radial-gradient(circle at 201px 23px, rgba(207,214,255,.8) 0 .9px, transparent 1.5px),
    radial-gradient(circle at 57px 229px, rgba(255,255,255,.6) 0 .8px, transparent 1.4px),
    radial-gradient(circle at 263px 187px, rgba(255,255,255,.85) 0 1.5px, transparent 2.2px),
    radial-gradient(ellipse 60% 45% at 12% 8%, rgba(128, 96, 230, .35), transparent 70%),
    radial-gradient(ellipse 50% 40% at 92% 30%, rgba(70, 140, 235, .22), transparent 70%),
    radial-gradient(ellipse 70% 50% at 60% 105%, rgba(150, 80, 200, .3), transparent 70%),
    linear-gradient(180deg, var(--night-0) 0%, var(--night-1) 40%, var(--night-2) 75%, var(--night-3) 100%);
  background-size: 173px 211px, 229px 181px, 251px 263px, 307px 239px, 193px 283px, 331px 293px, 100% 100%, 100% 100%, 100% 100%, 100% 100%;
}

/* アイコン（js/icons.js） */
.ic { display: inline-block; width: 1.2em; height: 1.2em; flex: none; vertical-align: -0.22em; overflow: visible; }
.ic.matome-entry-icon { width: 64px; height: 64px; filter: drop-shadow(0 0 8px rgba(255, 209, 102, .5)); }
.ic-wrap { display: inline-flex; align-items: center; justify-content: center; flex: none; line-height: 0; }
.has-ic { gap: 0.4em; }
.btn .ic-wrap .ic, .sd-btn .ic-wrap .ic { width: 1.15em; height: 1.15em; }

/* ホームの見出し（ロゴ） */
.topbar.topbar-home { min-height: 76px; padding-top: 0.4rem; padding-bottom: 0.4rem; }
.topbar-home .topbar-title { align-items: center; gap: 1.1rem; }
.topbar h1.logo { display: flex; align-items: center; gap: 0.7rem; font-size: 1rem; overflow: visible; min-width: 0; }
.logo-mark .ic { width: 52px; height: 52px; filter: drop-shadow(0 0 8px rgba(160, 130, 255, .55)); }
.logo-words { display: flex; flex-direction: column; line-height: 1.12; min-width: 0; }
.logo-main {
  font-size: 1.85rem; font-weight: bold; letter-spacing: 0.08em;
  color: var(--gold);
  background: linear-gradient(180deg, #fffbe6 0%, #ffe27a 45%, #f5b81c 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 10px rgba(255, 211, 77, .35));
}
.logo-tag { font-size: 0.95rem; letter-spacing: 0.12em; color: #dfe2ff; margin-top: 0.1rem; }
.topbar-home .topbar-sub {
  align-self: center; font-size: 0.78rem; padding: 0.15em 0.8em; border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, .25); color: var(--night-soft);
}
@media (max-width: 1200px) { .topbar-home .topbar-sub { display: none; } }
.gear:hover { border-color: var(--gold); }

/* ホーム：もんだいづくりのカード */
.make-card .make-icon { display: inline-flex; align-items: center; justify-content: center; width: 2.8rem; height: 2.8rem; border-radius: 50%; background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .22); }
.make-card .make-icon .ic { width: 1.75rem; height: 1.75rem; }

/* 夜空の上に直接おく文字 */
.q-error, .q-loading { color: var(--night-ink); }
.q-error .tnote { color: var(--night-soft); }

/* ふくしゅう・手書き練習：問題は明るいパネルの上に */
.review > .set, .review > .matome-wrap, .review > .resume { background: var(--card); color: var(--ink); border-radius: 16px; padding: 1rem; box-shadow: 0 8px 22px rgba(4, 6, 30, .35); }
.review > .resume { padding: 1.6rem 1.6rem 1.4rem; }
main.practice { margin-top: 1rem; background: var(--card); color: var(--ink); border-radius: 18px; box-shadow: 0 8px 22px rgba(4, 6, 30, .35); }
main.practice .pw-tips { background: var(--bg); }

/* 結果の中の○の数のバッジなど、明るいパネルの中は今までどおり */
.matome { background: #fffdf6; color: var(--ink); }

/* 明るいパネルの上のふちに、細い夜空の帯（まとめモード・先生メニューなど） */
.mm-setup, .mm-result, .tcard {
  background-image: linear-gradient(90deg, #26307e, #5a3fae 60%, #8a5cc8);
  background-size: 100% 8px; background-repeat: no-repeat; background-position: top;

<style>/* css/maker.css */

}

/* ---------- 作る ---------- */

/* 数の入力欄 */

/* 大小 */

/* 数字キー */

.mk-keypad .sd-key { min-height: 58px; font-size: 28px; }

.mk-bs { display: block; line-height: 1.1; }

/* ますの図 */

@media (max-width: 1100px) {

<style>/* css/present.css */

  border-radius: 16px; padding: 0.4rem 0.8rem; box-shadow: 0 6px 18px rgba(4, 6, 30, .3);
}
.rf-name-label { font-size: 0.85rem; color: var(--ink-soft); font-weight: bold; }
.rf-name-first {
  display: grid; grid-template-columns: 1fr auto; grid-template-areas: "label tools" "area area"; align-items: center;
  width: 380px; gap: 0.2rem 0.4rem; border-color: var(--gold-deep); padding: 0.3rem 0.7rem 0.5rem;
}
.rf-name-first .rf-name-label { grid-area: label; color: #7a5200; line-height: 1.3; }
.rf-name-first .rf-pad-name { display: contents; }
.rf-name-first .rf-pad-area { grid-area: area; }
.rf-name-first .rf-pad-tools { grid-area: tools; }
.rf-tag-plan { color: #2f4f86; background: #e6eefb; border-color: #8aa6d6; }

/* 3つの列 */
.rf-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0.8rem; align-items: start; }
@media (max-width: 1000px) { .rf-cols { grid-template-columns: 1fr; } .rf-top { flex-direction: column; } .rf-name-first { width: auto; } }
.rf-col {
  background: var(--card); border-radius: 18px; padding: 0.6rem 0.8rem 0.8rem; border: 2px solid var(--line);
  border-top: 6px solid var(--rf-c); box-shadow: 0 8px 22px rgba(4, 6, 30, .35); min-width: 0;
}
.rf-y { --rf-c: var(--rf-y); --rf-bg: #eaf2fd; }
.rf-w { --rf-c: var(--rf-w); --rf-bg: #e9f6ec; }
.rf-t { --rf-c: var(--rf-t); --rf-bg: #fdf0e3; }
.rf-col-head { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.3rem; }
.rf-letter {
  flex: none; width: 2.4rem; height: 2.4rem; border-radius: 50%; background: var(--rf-c); color: #fff;
  display: inline-flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.35rem; font-family: var(--num-font);
}
.rf-col-title { display: flex; flex-direction: column; min-width: 0; }
.rf-col-title h2 { margin: 0; font-size: 1.15rem; line-height: 1.3; color: var(--ink); }
.rf-col-sub { font-size: 0.8rem; color: var(--ink-soft); line-height: 1.3; }
.rf-sub { font-size: 0.82rem; color: var(--ink-soft); font-weight: bold; margin: 0.45rem 0 0.25rem; }
.rf-empty { color: var(--ink-soft); font-size: 0.9rem; padding: 0.5rem; background: var(--bg); border-radius: 10px; }
.rf-list { display: flex; flex-direction: column; gap: 0.35rem; }
.rf-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.35rem; }

/* 大きなトグル */
.rf-chip {
  position: relative; display: flex; align-items: center; gap: 0.5rem; width: 100%; min-height: 48px;
  padding: 0.3rem 0.6rem; border: 2px solid var(--line); border-radius: 12px; background: #fff; color: var(--ink);
  font-family: inherit; font-size: 0.95rem; line-height: 1.35; text-align: left; cursor: pointer; touch-action: manipulation;
  transition: background .12s, border-color .12s;
}
.rf-chip:active { transform: scale(0.985); }
.rf-chip:focus-visible { outline: 3px solid #f0a500; outline-offset: 2px; }
.rf-chip.on { background: var(--rf-bg, #eef1fb); border-color: var(--rf-c, var(--primary)); font-weight: bold; }
.rf-chip-text { flex: 1; min-width: 0; }
.rf-check { flex: none; width: 26px; height: 26px; }
.rf-check-box { fill: #fff; stroke: #aab2cc; stroke-width: 2; }
.rf-check-mark { fill: none; stroke: transparent; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.rf-chip.on .rf-check-box { fill: var(--rf-c, var(--primary)); stroke: var(--rf-c, var(--primary)); }
.rf-chip.on .rf-check-mark { stroke: #fff; }
.rf-chip.rf-extra { font-size: 0.9rem; padding: 0.3rem 0.45rem; gap: 0.35rem; }
.rf-tag {
  flex: none; font-size: 0.72rem; font-weight: bold; color: #7a5200; background: var(--gold-soft); border: 1px solid var(--gold-deep);
  border-radius: 999px; padding: 0 0.5em;
}

/* W：めあての引用と ◎○△ */
.rf-quote { display: flex; flex-wrap: wrap; align-items: center; gap: 0.2rem 0.4rem; background: #fffaf0; border-left: 5px solid var(--gold-deep); border-radius: 8px; padding: 0.3rem 0.6rem; font-size: 0.95rem; }
.rf-quote-pre { font-size: 0.78rem; font-weight: bold; color: #7a5200; }
.rf-quote-text { font-weight: bold; }
.rf-evals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.45rem; margin-top: 0.5rem; border-radius: 14px; }
.rf-eval {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.1rem; min-height: 84px;
  border: 3px solid var(--line); border-radius: 14px; background: #fff; color: var(--ink); font-family: inherit; font-size: 0.9rem;
  cursor: pointer; touch-action: manipulation; padding: 0.3rem;
}
.rf-eval:focus-visible { outline: 3px solid #f0a500; outline-offset: 2px; }
.rf-eval-svg { width: 46px; height: 46px; }
.rf-eval.on { font-weight: bold; box-shadow: 0 0 0 3px rgba(255, 211, 77, .7); }
.rf-eval-double.on { border-color: #d23c3c; background: #fdeeee; }
.rf-eval-single.on { border-color: #e0702a; background: #fff1e6; }
.rf-eval-triangle.on { border-color: #3a6fb0; background: #e8f0fb; }
.rf-need { outline: 3px solid #e0702a; outline-offset: 3px; animation: rf-shake .35s; }
@keyframes rf-shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

/* 手書き欄 */
.rf-pad { display: flex; flex-direction: column; gap: 0.25rem; border-radius: 12px; }
.rf-pad-area { position: relative; width: 100%; background: #fff; border: 2px dashed #b9c0d8; border-radius: 12px; overflow: hidden;
  background-image: linear-gradient(transparent calc(50% - 1px), #eef0f7 calc(50% - 1px), #eef0f7 50%, transparent 50%); }
.rf-pad-canvas { position: absolute; inset: 0; display: block; cursor: crosshair; }
.rf-pad-ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #9aa3c0; pointer-events: none; font-size: 0.95rem; }
.rf-pad-tools { display: flex; justify-content: flex-end; gap: 0.4rem; }
.rf-tool { min-height: 48px; font-size: 0.85rem; padding: 0.2em 0.9em; }

/* ほぞん・先生に送る */
.rf-bar {
  position: sticky; bottom: 0; z-index: 10; display: flex; align-items: center; justify-content: flex-end; gap: 0.8rem;
  margin-top: 0.8rem; padding: 0.6rem 1rem; background: rgba(255, 255, 255, .97); border: 2px solid var(--gold-deep);
  border-radius: 16px; box-shadow: 0 -4px 18px rgba(4, 6, 30, .35);
}
.rf-msg { flex: 1; font-size: 0.95rem; color: var(--ink-soft); min-height: 1.4em; }
.rf-msg.good { color: var(--good); font-weight: bold; }
.rf-msg.warn { color: #a34800; font-weight: bold; }
.rf-save, .rf-send { min-height: 56px; font-size: 1.15rem; padding: 0.4em 1.6em; }
.rf-codebox { margin-top: 0.6rem; background: #fff; border-radius: 12px; padding: 0.6rem 0.8rem; border: 2px solid var(--line); }
.rf-code-msg { font-size: 0.95rem; margin-bottom: 0.3rem; }
.rf-code-ta, .rf-paste { width: 100%; font-family: monospace; font-size: 0.85rem; border: 2px solid var(--line); border-radius: 10px; padding: 0.5rem; }

/* 縮小した手書き（おすと大きく） */
.rf-ink-thumb { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 48px; padding: 2px 6px;
  border: 1.5px solid var(--line); border-radius: 8px; background: #fff; cursor: zoom-in; }
.rf-ink-thumb:focus-visible { outline: 3px solid #f0a500; outline-offset: 2px; }
.rf-big { max-width: 1080px; width: auto; }
.rf-big canvas { display: block; margin: 0 auto 1rem; background: #fff; }
.rf-big-label { font-weight: bold; margin-bottom: 0.6rem; }

/* 先生：ふりかえりボックス */
.rf-panel { background: var(--card); color: var(--ink); border-radius: 16px; border: 2px solid var(--line); padding: 0.8rem 1.2rem; margin-bottom: 1rem; box-shadow: 0 6px 18px rgba(4, 6, 30, .3); }
.rf-panel h2 { margin: 0.2rem 0 0.4rem; color: var(--ink); }
.rf-note { font-size: 0.9rem; color: var(--ink-soft); margin: 0.2rem 0 0.5rem; }
.rf-paste { min-height: 90px; resize: vertical; }
.rf-row { display: flex; align-items: center; gap: 0.8rem; margin-top: 0.5rem; }
.rf-box-head { display: flex; align-items: center; justify-content: space-between; gap: 0.8rem; flex-wrap: wrap; }
.rf-filter { display: flex; flex-wrap: wrap; align-items: center; gap: 0.4rem; margin: 0.4rem 0 0.6rem; }
.rf-filter-label { font-size: 0.85rem; color: var(--ink-soft); font-weight: bold; margin-right: 0.2rem; }
.rf-filter .btn { min-height: 48px; }
.rf-filter .btn.on { background: var(--primary); border-color: var(--primary); color: #fff; font-weight: bold; }
.rf-table-wrap { overflow-x: auto; }
.rf-table { border-collapse: collapse; width: 100%; font-size: 0.85rem; }
.rf-table th { background: #eef1f6; text-align: left; padding: 0.4rem 0.5rem; white-space: nowrap; border-bottom: 2px solid var(--line); }
.rf-table td { border-bottom: 1px solid var(--line); padding: 0.4rem 0.5rem; vertical-align: top; }
.rf-c-date { white-space: nowrap; }
.rf-c-meate { max-width: 200px; }
.rf-c-meate .rf-meate-chip { font-size: 0.85rem; }
.rf-c-eval { text-align: center; }
.rf-eval-mini .rf-eval-svg { width: 36px; height: 36px; }
.rf-eval-cap { font-size: 0.75rem; color: var(--ink-soft); }
.rf-cell-list { margin: 0 0 0.3rem; padding-left: 1.1em; }
.rf-cell-list li { line-height: 1.4; }
.rf-cell-extra li { color: #6a3fa0; }
.rf-cell-extra li::marker { content: '+ '; }
.rf-muted { color: #9aa3c0; }

</style>

 *
 *   Shosu.Icons.get(name, {size, cls, title}) → SVG文字列

(function (root) {

  var S = root.Shosu = root.Shosu || {};
  var GOLD = '#ffd34d';

  // 4方向にきらめく星（へこんだ4角星）

    var d = 'M' + cx + ' ' + (cy - r) +
      'C' + (cx + k * 0.3) + ' ' + (cy - k) + ' ' + (cx + k) + ' ' + (cy - k * 0.3) + ' ' + (cx + r) + ' ' + cy +
      'C' + (cx + k) + ' ' + (cy + k * 0.3) + ' ' + (cx + k * 0.3) + ' ' + (cy + k) + ' ' + cx + ' ' + (cy + r) +

  // 流れ星の矢印（左向き）。右向きは左右反転して使う

    // まとめモードの入口：わっかの惑星ときらめく星
    saturn:
      '<circle cx="30" cy="34" r="15" fill="#ffd166"/>' +
      '<path d="M19 30c6-3 15-3 22 1" stroke="#ffb02e" stroke-width="3" fill="none" stroke-linecap="round"/>' +
      '<ellipse cx="30" cy="34" rx="26" ry="7" fill="none" stroke="#fff" stroke-width="3" transform="rotate(-18 30 34)"/>' +
      '<path d="M16.4 30.5a14 14 0 0 1 27.4-2.2" fill="none" stroke="#ffd166" stroke-width="3.4"/>' +
      spark(52, 12, 8, 'fill="#fff"') +

    label: label,

<script>/* js/store.js */
/* Shosu.Store — 記録と設定の保存（localStorage、キー接頭辞 'shosu.'） */
(function (S) {
  'use strict';
  var PREFIX = 'shosu.';
  var DEFAULT_SETTINGS = { checkMode: 'auto', bigText: false };

  // localStorage が使えない環境（一部の file:// やプライベートモード）ではメモリに保存する
  var mem = {};
  var ls = null;
  try {
    ls = window.localStorage;
    var t = PREFIX + '__test';
    ls.setItem(t, '1');
    ls.removeItem(t);
  } catch (e) { ls = null; }

  function rawGet(k) {
    try { return ls ? ls.getItem(PREFIX + k) : (mem[k] === undefined ? null : mem[k]); }
    catch (e) { return null; }
  }
  function rawSet(k, v) {
    try { if (ls) ls.setItem(PREFIX + k, v); else mem[k] = v; } catch (e) { mem[k] = v; }
  }
  function getJSON(k, def) {
    var v = rawGet(k);
    if (v == null) return def;
    try { return JSON.parse(v); } catch (e) { return def; }
  }
  function setJSON(k, v) { rawSet(k, JSON.stringify(v)); }

  function getSettings() {
    var s = getJSON('settings', {});
    var out = {};
    for (var k in DEFAULT_SETTINGS) out[k] = DEFAULT_SETTINGS[k];
    for (var j in s) out[j] = s[j];
    return out;
  }
  function setSettings(obj) {
    var s = getSettings();
    for (var k in obj) s[k] = obj[k];
    setJSON('settings', s);
    return s;
  }

  // 記録は問題IDごとに「最新の結果」を持つ。読みまちがいの自己採点などで上書きできる。
  // rec.<key> = { entries: { pid: {correct, method, hints, n, t, at} } }
  //   t = 記録した時刻（ms）、at = 同じ時刻の ISO 文字列（日ごとの履歴用。追加4）
  function record(key, pid, r) {
    if (!key) return;
    pid = String(pid == null ? 'p' + Date.now() : pid);
    var data = getJSON('rec.' + key, { entries: {} });
    if (!data.entries) data.entries = {};
    var prev = data.entries[pid];
    data.entries[pid] = {
      correct: !!(r && r.correct),
      method: (r && r.method) === 'self' ? 'self' : 'auto',
      hints: Math.max(prev ? prev.hints || 0 : 0, (r && r.hints) || 0),
      n: (prev ? prev.n || 1 : 0) + 1, // 結果を受け取った回数
      t: Date.now(),
      at: new Date().toISOString()
    };
    setJSON('rec.' + key, data);
    var keys = getJSON('keys', []);
    if (keys.indexOf(key) < 0) { keys.push(key); setJSON('keys', keys); }
  }

  function stats(key) {
    var data = getJSON('rec.' + key, { entries: {} });
    var st = { tried: 0, correct: 0, auto: 0, self: 0, hints: 0, done: {} };
    var e = data.entries || {};
    for (var pid in e) {
      var r = e[pid];
      st.tried++;
      st.hints += r.hints || 0;
      st.done[pid] = !!r.correct;
      if (r.correct) {
        st.correct++;
        if (r.method === 'self') st.self++; else st.auto++;
      }
    }
    return st;
  }

  function keys() { return getJSON('keys', []).slice(); }

  function resetAll() {
    var ks = keys();
    for (var i = 0; i < ks.length; i++) {
      try { if (ls) ls.removeItem(PREFIX + 'rec.' + ks[i]); else delete mem['rec.' + ks[i]]; } catch (e) {}
    }
    // 念のため接頭辞 shosu.rec. のものをすべて消す（設定は残す）
    if (ls) {
      try {
        for (var j = ls.length - 1; j >= 0; j--) {
          var k = ls.key(j);
          if (k && k.indexOf(PREFIX + 'rec.') === 0) ls.removeItem(k);
        }
      } catch (e) {}
    } else {
      for (var m in mem) if (m.indexOf('rec.') === 0) delete mem[m];
    }
    setJSON('keys', []);
  }

  /* ---------- もんだいづくり：つくった問題（'shosu.my'）・もんだいボックス（'shosu.box'） ---------- */
  // 保存に失敗したとき（容量超過など）は例外を投げず false を返す。
  function trySetJSON(k, v) {
    var s;
    try { s = JSON.stringify(v); } catch (e) { return false; }
    if (!ls) { mem[k] = s; return true; }
    try { ls.setItem(PREFIX + k, s); return true; } catch (e) { return false; }
  }
  function getList(k) {
    var v = getJSON(k, []);
    return Array.isArray(v) ? v : [];
  }
  // 手書きの座標を小数第1位までにして容量を節約する（元の up は変えない）
  function compactInk(ink) {
    if (!ink || !Array.isArray(ink.strokes)) return ink || null;
    return {
      w: ink.w, h: ink.h,
      strokes: ink.strokes.map(function (st) {
        return (st || []).map(function (p) { return { x: Math.round(p.x * 10) / 10, y: Math.round(p.y * 10) / 10 }; });
      })
    };
  }
  function compactUp(up) {
    if (!up || typeof up !== 'object') return up;
    var o = {};
    for (var k in up) if (Object.prototype.hasOwnProperty.call(up, k)) o[k] = up[k];
    if (o.author) o.author = compactInk(o.author);
    if (o.hint) o.hint = compactInk(o.hint);
    if (o.q) o.q = compactInk(o.q);
    return o;
  }

  function myList() { return getList('my'); }
  function mySave(up, id) {
    var list = getList('my');
    var now = Date.now();
    var item = null;
    if (id) for (var i = 0; i < list.length; i++) if (list[i] && list[i].id === id) { item = list[i]; break; }
    if (item) {
      item.up = compactUp(up);
      item.updated = now;

<script>/* js/session.js */
/* Shosu.Session — 「とちゅうから」の保存と復元（担当J）
 * localStorage 'shosu.session.<key>' に JSON で保存する。
 *   Session.save(key, state)   Session.load(key) -> state | null   Session.clear(key)
 *   Session.clearAll()         （先生メニューの「記録をすべて消す」用）
 *   Session.deviceId()         端末ごとのID（'shosu.deviceId'、英数字10文字）
 * key 例：'lesson-3'（各時のれんしゅう）, 'more-3'（もっとれんしゅう）, 'review-daisho', 'matome'
 * 書きかけの手書きは保存しない。答えた問題の結果と、出した問題そのもの（自動で作る問題）だけを保存する。
 */
(function (S) {
  'use strict';
  var PREFIX = 'shosu.session.';
  var mem = {};
  var ls = null;
  try {
    ls = window.localStorage;
    ls.setItem(PREFIX + '__t', '1');
    ls.removeItem(PREFIX + '__t');
  } catch (e) { ls = null; }

  function save(key, state) {
    if (!key) return false;
    var s;
    try { s = JSON.stringify({ v: 1, t: Date.now(), state: state }); } catch (e) { return false; }
    if (!ls) { mem[key] = s; return true; }
    try { ls.setItem(PREFIX + key, s); return true; }
    catch (e) { mem[key] = s; return false; } // 容量がいっぱいのときはメモリだけ
  }
  function load(key) {
    if (!key) return null;
    var s = null;
    try { s = ls ? ls.getItem(PREFIX + key) : null; } catch (e) { s = null; }
    if (s == null && mem[key] != null) s = mem[key];
    if (s == null) return null;
    try {
      var o = JSON.parse(s);
      return o && o.state != null ? o.state : null;
    } catch (e) { return null; }
  }
  function clear(key) {
    delete mem[key];
    try { if (ls) ls.removeItem(PREFIX + key); } catch (e) {}
  }
  function clearAll() {
    mem = {};
    if (!ls) return;
    try {
      for (var i = ls.length - 1; i >= 0; i--) {
        var k = ls.key(i);
        if (k && k.indexOf(PREFIX) === 0) ls.removeItem(k);
      }
    } catch (e) {}
  }

  // 端末ごとのID（初回に作って 'shosu.deviceId' に保存。clearAll では消さない）。
  // 作った問題に aid として入れ、ともだちの問題の「作った人」の区別と、自分の問題かどうかの判定に使う。
  var devId = null;
  function deviceId() {
    if (devId) return devId;
    var v = null;
    try { v = ls ? ls.getItem('shosu.deviceId') : null; } catch (e) { v = null; }
    if (!v || !/^[A-Za-z0-9]{8,16}$/.test(v)) {
      var c = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      var r = new Uint8Array(10);
      try { (window.crypto || window.msCrypto).getRandomValues(r); } catch (e) { for (var j = 0; j < r.length; j++) r[j] = Math.floor(Math.random() * 256); }
      v = '';
      for (var i = 0; i < r.length; i++) v += c.charAt(r[i] % c.length);
      try { if (ls) ls.setItem('shosu.deviceId', v); } catch (e) {}
    }
    devId = v;
    return v;
  }

  S.Session = { save: save, load: load, clear: clear, clearAll: clearAll, deviceId: deviceId };

</script>

<script>/* js/share.js */
/* Shosu.Share — 子どもが作った問題（UserProblem）をリンク用のトークンにする・もどす
 *
 * トークンの形： <版の文字 '1'> <本体 base64url> <チェック 5文字>
 *   本体 = deflate-raw( [インクの有無ビット 1byte][JSONの長さ varint][JSON(UTF-8)][インク…] )
 *   インク = [w varint][h varint][画数 varint] { [点数 varint] { dx, dy (zigzag varint) } }
 *     座標は欄の長い辺を 0..1023 に量子化し、直前の点（画をまたいで連続）からの差分で持つ。
 *   チェック = FNV-1a(版の文字+本体) の下位30ビットを base64url 5文字で。
 *     → 貼りつけた文章からトークンの終わりを見つける・こわれを見つけるのに使う。
 * 数は浮動小数を使わず、文字列と「1000倍した整数」で扱う。
 *
 * 追加4：トークン先頭の版の文字で種類を見分ける。
 *   '1' = 問題（UserProblem、今までどおり）  'g' = ゴール（Goal）  'r' = ふりかえり（Reflection）
 *   ゴール・ふりかえりの本体も同じ形（[インクの有無ビット][JSONの長さ][JSON][インク…] を deflate-raw）。
 *   リンクは '#/q/' '#/g/' '#/r/'。
 */

  var EPS_RATIO = 0.002;      // 間引きの許容誤差（長い辺に対して。800px なら 1.6px）
  var CHECK_LEN = 5;

  var UNITS = ['L', 'm', 'km', 'kg', 'g', 'mL', 'cm', 'mm', 'こ', '倍', ''];
  var STEPS = ['1', '0.1', '0.01', '0.001'];
  var ARROW_LABELS = ['あ', 'い', 'う'];
  var B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';

      var level = opts.level === 3 ? 3 : 2;
      var unit = opts.unit || 'L';
      // 位ごとの個数  [1L, 0.1L, 0.01L, 0.001L]
      var units = level === 3 ? ['1', '0.1', '0.01', '0.001'] : ['1', '0.1', '0.01'];
      var places = level === 3 ? [0, -1, -2, -3] : [0, -1, -2];
      var init = opts.init || (level === 3 ? [1, 2, 3, 6] : [1, 2, 6]);
      var cnt = init.slice();
      var divided = false;
      var timer = null;

      var lead = h('div', { 'class': 'sd-lead' });
      var figBox = h('div', { 'class': 'sd-figbox sd-masu-fig' });
      var note = h('div', { 'class': 'sd-msg', 'aria-live': 'polite' });
      var steppers = [];
      var rowEls = [];
      var table = h('table', { 'class': 'sd-table sd-masu-table' });
      var tbody = h('tbody');
      table.appendChild(tbody);
      units.forEach(function (u, i) {
        var st = ui.stepper({
          value: cnt[i], min: 0, max: i === 0 ? 4 : 9, color: ui.placeColor(places[i]), allowOver: i > 0,
          onTry: function (v) { return tryChange(i, v); },
          onChange: function (v) { cnt[i] = v; update(); }
        });
        steppers.push(st);
        var valCell = h('td', { 'class': 'sd-masu-val' });
        var tr = h('tr', null, [
          h('td', { 'class': 'sd-masu-unit', style: { background: ui.placeColor(places[i]) } }, u + unit + 'が'),
          h('td', null, st.el),
          h('td', null, 'こで'),
          valCell
        ]);
        rowEls.push({ tr: tr, val: valCell });
        tbody.appendChild(tr);
      });
      var totalCell = h('td', { colspan: 4, 'class': 'sd-masu-total' });
      tbody.appendChild(h('tr', null, totalCell));
      var readEl = h('div', { 'class': 'sd-masu-read' });

      var divLabel = level === 3 ? '0.01' + unit + 'を10等分する' : '0.1' + unit + 'を10等分する';
      var divBtn = ui.button(divLabel, function () {
        divided = !divided;
        render(true);
      }, { kind: 'main' });
      var resetBtn = ui.button('はじめにもどす', function () {
        cnt = init.slice(); divided = false;
        steppers.forEach(function (st, i) { st.set(cnt[i]); });
        update();
      }, { kind: 'sub' });

      lead.textContent = level === 3
        ? '0.01' + unit + 'より少ないはしたは、0.01' + unit + 'を10等分して考えよう。'
        : '0.1' + unit + 'より少ないはしたは、0.1' + unit + 'を10等分して考えよう。';

      el.appendChild(lead);
      el.appendChild(h('div', { 'class': 'sd-cols' }, [
        h('div', { 'class': 'sd-col-main' }, [figBox, h('div', { 'class': 'sd-row sd-center' }, [divBtn, resetBtn]), note]),
        h('div', { 'class': 'sd-col-side' }, [table, readEl])
      ]));

      function tryChange(i, v) {
        if (v > 9 && i > 0) { // 10こで くり上がり
          if (i === 1 && cnt[0] >= 4) return false;
          cnt[i] = 0; cnt[i - 1]++;
          steppers[i].set(0); steppers[i - 1].set(cnt[i - 1]);
          update();
          note.textContent = units[i] + unit + 'が10こで ' + units[i - 1] + unit + 'になるよ！';
          note.classList.add('sd-msg-pop');
          return false;
        }
        return v;
      }
      function lastIdx() { return units.length - 1; }

      function update() { render(false); }

      function render(animate) {
        var spec = { kind: 'masu', unit: unit, level: level, L: cnt[0], d1: cnt[1], d2: cnt[2] || 0, d3: cnt[3] || 0 };

        if (divided) spec.partial = true;
        figBox.innerHTML = '';
        figBox.appendChild(S.Figures.render(spec));
        divBtn.textContent = divided ? '目もりをけす' : divLabel;

        var sc = level === 3 ? 3 : 2, total = 0;
        units.forEach(function (u, i) {

          rowEls[i].val.textContent = num.fromInt(v, sc) + unit;
        });
        var hidden = !divided; // 最後の行（はした）は目もりをつけてから
        rowEls[lastIdx()].tr.classList.toggle('sd-dim', hidden);
        var totStr = num.fromInt(total, sc);
        totalCell.innerHTML = '';
        totalCell.appendChild(document.createTextNode('合わせて '));
        totalCell.appendChild(h('b', { 'class': 'sd-big' }, hidden && cnt[lastIdx()] ? '?' : totStr));
        totalCell.appendChild(document.createTextNode(' ' + unit));
        readEl.innerHTML = '';
        if (!(hidden && cnt[lastIdx()])) {
          readEl.appendChild(h('span', null, ['読み方：', h('b', null, num.read(totStr) + (unit === 'L' ? 'リットル' : '')), '（' + totStr + unit + '）']));
        }
        note.classList.remove('sd-msg-pop');
        var small = units[lastIdx()], prev = units[lastIdx() - 1];
        if (!divided) {
          note.textContent = 'はしたの水は ' + prev + unit + 'より少ないね。何' + unit + 'かな？「10等分する」をおしてみよう。';
        } else {
          note.innerHTML = '';
          note.appendChild(document.createTextNode(prev + unit + 'を10等分した1こ分のかさは '));
          note.appendChild(h('b', null, small + unit));
          note.appendChild(document.createTextNode('（' + num.read(small) + (unit === 'L' ? 'リットル' : '') + '）。目もり ' + cnt[lastIdx()] + 'こ分で ' + num.fromInt(num.toInt(small, sc) * cnt[lastIdx()], sc) + unit + '。'));
        }
      }
      render(false);
      return { destroy: function () { if (timer) clearTimeout(timer); } };
    }
  });
})(window.Shosu = window.Shosu || {});

</script>

          g.appendChild(s('rect', { x: zx0, y: zy - 46, width: zl, height: 34, fill: 'none', stroke: '#333', 'stroke-width': 2 }));
          for (var j = 0; j <= 10; j++) {
            var zx = zx0 + j * zp, end = j === 0 || j === 10, half = j === 5;
            g.appendChild(s('line', { x1: zx, y1: zy - 12, x2: zx, y2: zy - 12 + (end ? 20 : half ? 15 : 10), stroke: '#333', 'stroke-width': end ? 2.4 : 1.5 }));
            if (end) g.appendChild(txt(zx, zy + 34, num.fromInt(a + j, 2), { 'font-size': 24, 'font-weight': 'bold' }));
                      }
          g.appendChild(txt(zx1 + 34, zy + 34, 'm', { 'font-size': 24 }));

          g.appendChild(txt(zx0 + zp / 2, zy - 72, '0.01m', { 'font-size': 18, fill: '#1971c2' }));

(function (S) {
  'use strict';
  var D = S.Demos, ui = D.ui, h = ui.h, num = D.num;

  D.register('units', {
    title: '単位のかんさん',
    mount: function (el, opts) {

      var seg = ui.segmented(Object.keys(KINDS).map(function (k) { return { value: k, label: KINDS[k].label }; }), kind, function (k) {
        kind = k; val = KINDS[k].presets[0]; render();

      var tableBox = h('div', { 'class': 'sd-units-table' });

      var note = h('div', { 'class': 'sd-msg' });

      el.appendChild(h('div', { 'class': 'sd-lead' }, '位取り表にならべると、小さい単位の数を 大きい単位の小数で表せるよ。'));

  D.register('blocks', {

<script>/* js/demos/compare.js */
/* demos/compare.js : くらべっこ（位取り表で上の位からくらべる＋数直線） */
(function (S) {
  'use strict';
  var D = S.Demos, ui = D.ui, h = ui.h, num = D.num;
  var F = S.Figures.util;
  var LABELS = ['あ', 'い', 'う'];
  var COLORS = ['#d9480f', '#1971c2', '#2b8a3e'];

  function digitAt(str, p) { return F.digitAt(str, p); }
  function pName(p) { return F.placeName(p); }

  D.register('compare', {
    title: 'くらべっこ',
    mount: function (el, opts) {
      var nums = (opts.numbers || ['0.43', '0.425', '0.432']).slice();
      var step = -1; // -1: まだ、0..: くらべている列
      var plan = null;

      var tableBox = h('div', { 'class': 'sd-cmp-table' });
      var msg = h('div', { 'class': 'sd-msg', 'aria-live': 'polite' });
      var lineBox = h('div', { 'class': 'sd-figbox' });
      var goBtn = ui.button('上の位からくらべる', function () { next(); }, { kind: 'main', cls: 'sd-btn-big' });
      var resetBtn = ui.button('はじめから', function () { step = -1; render(); }, { kind: 'sub' });
      var presetRow = h('div', { 'class': 'sd-row' }, [
        [['0.43', '0.425', '0.432']], [['0.43', '0.425']], [['0.5', '0.05', '0.005']], [['2.4', '2.38', '2.415']], [['0.7', '0.69', '0.701']]
      ].map(function (p) {
        return ui.button(p[0].join(' / '), function () { nums = p[0].slice(); step = -1; render(); }, { cls: 'sd-chip' });
      }));

      el.appendChild(h('div', { 'class': 'sd-lead' }, '数の大小は、上の位から順にくらべるよ。数をタップすると かえられるよ。'));
      el.appendChild(presetRow);
      el.appendChild(h('div', { 'class': 'sd-cols' }, [
        h('div', { 'class': 'sd-col-main' }, [tableBox]),
        h('div', { 'class': 'sd-col-side' }, [h('div', { 'class': 'sd-row' }, [goBtn, resetBtn]), msg])
      ]));
      el.appendChild(lineBox);

      function cols() {
        var top = 0;
        nums.forEach(function (n) { var ip = n.split('.')[0]; if (ip.length - 1 > top) top = ip.length - 1; });
        var bot = -1;
        nums.forEach(function (n) { var sc = num.scale(n); if (-sc < bot) bot = -sc; });
        bot = Math.min(bot, -3) ;
        var out = []; for (var p = Math.min(top, 1); p >= bot; p--) out.push(p);
        if (top > 1) out.unshift(2);
        return out;
      }
      function makePlan() {
        var ps = cols();
        var groups = [nums.map(function (n, i) { return i; })];
        var stepsOut = [];
        for (var c = 0; c < ps.length; c++) {
          var p = ps[c];
          if (!groups.some(function (g) { return g.length > 1; })) break;
          var info = { p: p, col: c, lines: [], zeros: [] };
          var ng = [];
          groups.forEach(function (g) {
            if (g.length < 2) { ng.push(g); return; }
            var byD = {};
            g.forEach(function (i) {
              var d = digitAt(nums[i], p);
              if (d === '') { d = '0'; if (p < 0) info.zeros.push(i); }
              (byD[d] = byD[d] || []).push(i);
            });
            var ds = Object.keys(byD).sort(function (a, b) { return b - a; });
            if (ds.length === 1) {
              info.lines.push(g.map(function (i) { return nums[i]; }).join(' と ') + ' は どれも ' + ds[0] + '。同じだから つぎの位へ。');
              ng.push(g);
            } else {
              info.lines.push(ds.map(function (d) { return byD[d].map(function (i) { return nums[i]; }).join(' と ') + ' は ' + d; }).join('、') + '。');
              info.lines.push(ds.join(' ＞ ') + ' だから ' + ds.map(function (d) { return byD[d].length > 1 ? '（' + byD[d].map(function (i) { return nums[i]; }).join(' と ') + '）' : nums[byD[d][0]]; }).join(' ＞ '));
              info.decided = true;
              ds.forEach(function (d) { ng.push(byD[d]); });
            }
          });
          groups = ng;
          stepsOut.push(info);
        }
        var sorted = nums.map(function (n, i) { return i; }).sort(function (a, b) { return num.cmp(nums[b], nums[a]); });
        var fin = '';
        sorted.forEach(function (i, k) {
          if (k) fin += num.cmp(nums[sorted[k - 1]], nums[i]) === 0 ? ' ＝ ' : ' ＞ ';
          fin += nums[i];
        });
        return { ps: ps, steps: stepsOut, final: fin, sorted: sorted };
      }
      function next() {
        if (step < plan.steps.length) step++;
        render();
      }
      function edit(i) {
        ui.askNumber({
          title: LABELS[i] + ' の数', value: nums[i], maxLen: 6,
          validate: function (v) {
            if (num.scale(v) > 3) return '小数第三位までにしてね';
            if (+v >= 100) return '100より小さい数にしてね';
            return null;
          },
          onOK: function (v) { nums[i] = num.trim(v); step = -1; render(); }
        });
      }
      function render() {
        plan = makePlan();
        var ps = plan.ps;
        var cur = step >= 0 && step < plan.steps.length ? plan.steps[step] : null;
        var done = step >= plan.steps.length;
        var shownZeros = {};
        plan.steps.forEach(function (st, k) { if (k <= step) st.zeros.forEach(function (i) { shownZeros[i + ',' + st.p] = 1; }); });
        var lastCol = plan.steps.length ? plan.steps[plan.steps.length - 1].col : -1;
        function passed(c) { return step >= 0 && cur && c < cur.col; }
        var t = h('table', { 'class': 'sd-table sd-ptable sd-cmp' });
        var hr = h('tr', null, h('th', { 'class': 'sd-rowhead' }, ''));
        ps.forEach(function (p, c) {
          hr.appendChild(h('th', { style: { background: ui.placeColor(p) }, 'class': cur && cur.col === c ? 'sd-hl' : '' }, ui.placeNameEl(p)));
        });
        t.appendChild(hr);
        nums.forEach(function (n, i) {
          var rank = done ? plan.sorted.indexOf(i) + 1 : 0;
          var lab = ui.button(h('span', null, [h('span', { 'class': 'sd-cmp-lab', style: { background: COLORS[i] } }, LABELS[i]), ' ' + n]), function () { edit(i); }, { cls: 'sd-cmp-num', aria: LABELS[i] + ' の数をかえる' });
          var tr = h('tr', null, h('th', { 'class': 'sd-rowhead' }, lab));
          ps.forEach(function (p, c) {
            var d = digitAt(n, p);
            var cls = 'sd-digitcell' + (p === 0 ? ' sd-dot-after' : '') + (cur && cur.col === c ? ' sd-hl' : '') + (passed(c) ? ' sd-done' : '');
            if (p === 0 && num.scale(n) === 0) cls = cls.replace(' sd-dot-after', '');
            var cell = h('td', { 'class': cls });
            if (d === '' && shownZeros[i + ',' + p]) cell.appendChild(h('span', { 'class': 'sd-faint' }, '0'));
            else if (d !== '') cell.appendChild(document.createTextNode(d));
            tr.appendChild(cell);
          });
          if (done) tr.appendChild(h('td', { 'class': 'sd-rank' }, rank + 'ばん'));
          t.appendChild(tr);
        });
        tableBox.innerHTML = '';
        tableBox.appendChild(t);

        msg.innerHTML = '';
        if (step < 0) msg.appendChild(h('div', null, 'どれがいちばん大きいかな？「上の位からくらべる」をおそう。'));
        else if (cur) {
          msg.appendChild(h('div', { 'class': 'sd-msg-head' }, [ui.placeNameEl(cur.p), ' でくらべる']));
          cur.zeros.forEach(function (i) { msg.appendChild(h('div', { 'class': 'sd-note' }, nums[i] + ' の ' + pName(cur.p) + ' は 0 と考えるよ。')); });
          cur.lines.forEach(function (l) { msg.appendChild(h('div', null, l)); });
        } else {
          msg.appendChild(h('div', { 'class': 'sd-msg-head' }, 'けっか'));
          msg.appendChild(h('div', { 'class': 'sd-big' }, plan.final));
        }
        goBtn.textContent = step < 0 ? '上の位からくらべる' : done ? 'おわり' : 'つぎの位へ';
        goBtn.disabled = done;

        // 数直線
        var vals = nums.map(Number);
        var mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
        var lo, hi, st;
        var lo1 = Math.floor(mn * 10 + 1e-9) / 10, hi1 = Math.ceil(mx * 10 - 1e-9) / 10;
        if (hi1 <= lo1) hi1 = lo1 + 0.1;
        if (Math.round((hi1 - lo1) * 10) <= 1) { lo = lo1; hi = +(lo1 + 0.1).toFixed(1); st = 0.001; }
        else if (Math.floor(mn) === Math.floor(mx - 1e-9) || mx - mn <= 1) { lo = Math.floor(mn); hi = lo + 1; st = 0.01; if (mx > hi) { hi = lo + 2; st = 0.1; } }
        else { lo = Math.floor(mn); hi = Math.ceil(mx); st = 0.1; }
        lineBox.innerHTML = '';
        lineBox.appendChild(S.Figures.render({
          kind: 'numberline', min: lo, max: hi, step: st, labelEvery: 10,
          arrows: nums.map(function (n, i) { return { v: Number(n), label: n, color: COLORS[i] }; })
        }));
      }
      render();
      return { destroy: function () {} };
    }
  });
})(window.Shosu = window.Shosu || {});

</script>
<script>/* js/demos/shift.js */
/* demos/shift.js : 10倍・1/10マシン（位取り表の数字が左右の位へ動く） */
(function (S) {
  'use strict';
  var D = S.Demos, ui = D.ui, h = ui.h, num = D.num;
  var F = S.Figures.util;
  var PL = [3, 2, 1, 0, -1, -2, -3];
  var NC = PL.length;

  function colOf(p) { return 3 - p; }
  function leftPct(p) { return (colOf(p) * 100 / NC) + '%'; }

  D.register('shift', {
    title: '10倍・1/10マシン',
    mount: function (el, opts) {
      var start = opts.number || '0.58';
      var cur = start;
      var items = []; // {d, p, el}
      var fillers = [];
      var timers = [];
      var busy = false;

      var board = h('div', { 'class': 'sd-shift-board' });
      var head = h('div', { 'class': 'sd-shift-head' });
      PL.forEach(function (p) { head.appendChild(h('div', { 'class': 'sd-shift-th', style: { background: ui.placeColor(p) } }, ui.placeNameEl(p))); });
      var arrowBox = h('div', { 'class': 'sd-shift-arrows' });
      var row = h('div', { 'class': 'sd-shift-row' });
      PL.forEach(function (p) { row.appendChild(h('div', { 'class': 'sd-shift-td', style: { left: leftPct(p), width: (100 / NC) + '%' } })); });
      var dot = h('div', { 'class': 'sd-shift-dot', style: { left: leftPct(-1) } });
      row.appendChild(dot);
      board.appendChild(head);
      board.appendChild(arrowBox);
      board.appendChild(row);

      var exprEl = h('div', { 'class': 'sd-shift-expr', 'aria-live': 'polite' });
      var msg = h('div', { 'class': 'sd-msg' });
      var opBtns = h('div', { 'class': 'sd-row sd-center' }, [
        ui.button('10倍', function () { op(1); }, { kind: 'main', cls: 'sd-btn-big' }),
        ui.button('100倍', function () { op(2); }, { kind: 'main', cls: 'sd-btn-big' }),
        ui.button('1000倍', function () { op(3); }, { kind: 'main', cls: 'sd-btn-big' }),
        ui.button(h('span', null, [ui.fracEl(1, 10)]), function () { op(-1); }, { kind: 'warm', cls: 'sd-btn-big', aria: '10分の1' }),
        ui.button(h('span', null, [ui.fracEl(1, 100)]), function () { op(-2); }, { kind: 'warm', cls: 'sd-btn-big', aria: '100分の1' })
      ]);
      var numRow = h('div', { 'class': 'sd-row sd-center' }, ['0.58', '3.92', '0.74', '1.58', '26.95'].map(function (n) {
        return ui.button(n, function () { setNum(n); }, { cls: 'sd-chip' });
      }).concat([
        ui.button('じぶんで入れる', function () {
          ui.askNumber({
            title: '数を入れよう', value: '', maxLen: 7,
            validate: function (v) {
              if (num.scale(v) > 3) return '小数第三位までにしてね';
              if (+v >= 10000) return '10000より小さい数にしてね';
              if (+v === 0) return '0より大きい数にしてね';
              return null;
            },
            onOK: function (v) { setNum(num.trim(v)); }
          });
        }, { kind: 'sub' }),
        ui.button('もとにもどす', function () { setNum(start); }, { kind: 'sub' })
      ]));

      el.appendChild(h('div', { 'class': 'sd-lead' }, '10倍、100倍、1/10 にすると、数字は位取り表の上で どう動くかな？'));
      el.appendChild(numRow);
      el.appendChild(board);
      el.appendChild(exprEl);
      el.appendChild(opBtns);
      el.appendChild(msg);

      function later(fn, ms) { timers.push(setTimeout(fn, ms)); }

      function parse(str) {
        var sc = num.scale(str), n = String(num.toInt(str, sc));
        var out = [];
        for (var i = 0; i < n.length; i++) out.push({ d: n.charAt(i), p: n.length - 1 - i - sc });
        // 先頭と末尾の0（の位置）はつめる
        while (out.length > 1 && out[0].d === '0') out.shift();
        while (out.length > 1 && out[out.length - 1].d === '0' && out[out.length - 1].p < 0) out.pop();
        return out;
      }
      function digitEl(d, p, filler) {
        var e = h('div', { 'class': 'sd-shift-digit' + (filler ? ' sd-filler' : ''), style: { left: leftPct(p), width: (100 / NC) + '%' } }, d);
        return e;
      }
      function placeFillers(anim) {
        fillers.forEach(function (f) { if (f.parentNode) f.parentNode.removeChild(f); });
        fillers = [];
        var hi = items[0].p, lo = items[items.length - 1].p, p;
        var add = [];
        if (hi < 0) for (p = 0; p > hi; p--) add.push(p);
        if (lo > 0) for (p = lo - 1; p >= 0; p--) add.push(p);
        add.forEach(function (pp) {
          var f = digitEl('0', pp, true);
          if (anim) f.classList.add('sd-fadein');
          row.appendChild(f); fillers.push(f);
        });
        dot.style.visibility = lo < 0 ? 'visible' : 'hidden';
      }
      function setNum(n) {
        timers.forEach(clearTimeout); timers = []; busy = false;
        cur = n; start = start || n;
        items.forEach(function (it) { if (it.el.parentNode) it.el.parentNode.removeChild(it.el); });
        items = parse(n).map(function (it) { it.el = digitEl(it.d, it.p); row.appendChild(it.el); return it; });
        placeFillers(false);
        arrowBox.innerHTML = '';
        exprEl.innerHTML = '';
        exprEl.appendChild(h('span', { 'class': 'sd-big' }, n));
        msg.textContent = 'ボタンをおして、数字の動きを見よう。';
      }
      function op(k) {
        if (busy) return;
        var hi = items[0].p, lo = items[items.length - 1].p;
        if (hi + k > 3 || lo + k < -3) { msg.textContent = '表からはみ出してしまうよ。ほかのボタンをためそう。'; return; }
        busy = true;
        var before = cur;
        var after = num.shift(cur, k);
        // 矢印
        var svg = F.s('svg', { viewBox: '0 0 700 70', 'class': 'sd-shift-svg', preserveAspectRatio: 'none' });
        var color = k > 0 ? '#e8590c' : '#1971c2';
        items.forEach(function (it) {
          var x1 = colOf(it.p) * 100 + 50, x2 = colOf(it.p + k) * 100 + 50;
          var dy = 14 + Math.abs(k) * 14;
          svg.appendChild(F.s('path', { d: 'M' + x1 + ' 66 Q' + ((x1 + x2) / 2) + ' ' + (66 - dy * 2) + ' ' + x2 + ' 66', fill: 'none', stroke: color, 'stroke-width': 3, 'class': 'sd-shift-arc', 'vector-effect': 'non-scaling-stroke' }));
          svg.appendChild(F.s('circle', { cx: x2, cy: 64, r: 5, fill: color }));
        });
        arrowBox.innerHTML = '';
        arrowBox.appendChild(svg);
        fillers.forEach(function (f) { f.classList.add('sd-fadeout'); });
        items.forEach(function (it) { it.p += k; it.el.style.left = leftPct(it.p); it.el.classList.add('sd-moving'); });
        dot.classList.add('sd-dot-pulse');
        var label = k > 0 ? Math.pow(10, k) + '倍' : null;
        exprEl.innerHTML = '';
        if (k > 0) exprEl.appendChild(h('span', null, [before + ' を ' + label + ' すると ']));
        else exprEl.appendChild(h('span', null, [before + ' の ', ui.fracEl(1, Math.pow(10, -k)), ' は ']));
        var res = h('b', { 'class': 'sd-big sd-hidden' }, after);
        exprEl.appendChild(res);
        msg.innerHTML = '';
        later(function () {
          items.forEach(function (it) { it.el.classList.remove('sd-moving'); });
          dot.classList.remove('sd-dot-pulse');
          placeFillers(true);
          res.classList.remove('sd-hidden');
          var n = Math.abs(k), word = n === 1 ? '1つ' : n === 2 ? '2つ' : '3つ';
          msg.appendChild(h('div', null, k > 0
            ? ['どの数字も 位が ', h('b', null, word + '上がる'), '。小数点は ' + (n === 1 ? '右へ1けた' : '右へ' + n + 'けた') + ' うつったように見えるね。']
            : ['どの数字も 位が ', h('b', null, word + '下がる'), '。小数点は 左へ' + n + 'けた うつったように見えるね。']));
          cur = after;
          busy = false;
        }, 950);
      }
      setNum(start);
      return { destroy: function () { timers.forEach(clearTimeout); } };
    }
  });
})(window.Shosu = window.Shosu || {});

</script>
<script>/* js/demos/hissan.js */
/* demos/hissan.js : 筆算ステップ（opts.op '+'|'-', opts.presets ['2.25+1.34', ...]） */
(function (S) {
  'use strict';
  var D = S.Demos, ui = D.ui, h = ui.h, num = D.num;
  var F = S.Figures.util;

  function intDigits(str) { return String(str).split('.')[0].replace(/^0+(?=\d)/, '').length; }
  function digitOf(str, p) { var d = F.digitAt(str, p); return d === '' ? null : +d; }

  /* 計算の流れをすべて作る */
  function build(a, b, op) {
    var sa = num.scale(a), sb = num.scale(b), sc = Math.max(sa, sb);
    var A = num.toInt(a, sc), B = num.toInt(b, sc);
    var R = op === '+' ? A + B : A - B;
    var rs = num.fromInt(R, sc, true);
    var top = Math.max(intDigits(a), intDigits(b), intDigits(rs)) - 1;
    var ps = []; for (var p = top; p >= -sc; p--) ps.push(p);
    var cols = [];
    var work = {}; ps.forEach(function (p) { work[p] = digitOf(a, p) || 0; });
    var marks = {}; // 繰り下がりで変わった上の数
    var carry = 0;
    var ans = {};
    for (var i = ps.length - 1; i >= 0; i--) {
      p = ps[i];
      var da = digitOf(a, p), db = digitOf(b, p);
      var info = { p: p, da: da, db: db };
      if (op === '+') {
        var sum = (da || 0) + (db || 0) + carry;
        info.carryIn = carry;
        info.sum = sum;
        ans[p] = sum % 10;
        carry = Math.floor(sum / 10);
        info.carryOut = carry;
      } else {
        var bb = db || 0;
        info.top = work[p];
        if (work[p] < bb) {
          var k = p + 1;
          while (work[k] === 0) k++;
          info.borrowFrom = k;
          info.chain = [];
          work[k]--; marks[k] = work[k];
          for (var q = k - 1; q > p; q--) { work[q] = 9; marks[q] = 9; info.chain.push(q); }
          work[p] += 10; marks[p] = work[p];
          info.borrowed = true;
        }
        info.topNow = work[p];
        ans[p] = work[p] - bb;
      }
      info.ans = ans[p];
      info.marks = JSON.parse(JSON.stringify(marks));
      cols.push(info);
    }
    // 答えの先頭の0（一の位より上）はかかない
    var lead = {};
    for (i = 0; i < ps.length; i++) { p = ps[i]; if (p > 0 && ans[p] === 0) lead[p] = true; else break; }
    // 末尾の0（小数部分）
    var trail = [];
    for (i = ps.length - 1; i >= 0; i--) { p = ps[i]; if (p < 0 && ans[p] === 0) trail.push(p); else break; }
    return { a: a, b: b, op: op, sa: sa, sb: sb, sc: sc, ps: ps, cols: cols, ans: ans, lead: lead, trail: trail, result: num.fromInt(R, sc) };
  }

  function stepList(m) {
    var st = [{ kind: 'start' }, { kind: 'align' }];
    m.cols.forEach(function (c, i) {
      // 一の位より上で、上も下も数がない列はとばす
      if (c.p > 0 && c.da == null && c.db == null && !c.carryIn) return;
      st.push({ kind: 'col', idx: i });
    });
    if (m.sc > 0) st.push({ kind: 'point' });
    if (m.trail.length) st.push({ kind: 'zero' });
    st.push({ kind: 'done' });
    return st;
  }

  D.register('hissan', {
    title: '筆算ステップ',
    mount: function (el, opts) {
      var op = opts.op === '-' ? '-' : '+';
      var presets = opts.presets || (op === '+' ? ['2.25+1.34', '4.25+2.18', '9.23+0.47', '4.05+3.1'] : ['3.46-2.14', '1.25-0.67', '6-0.52', '5.03-4.25']);
      var model, steps, si = 0;
      var OPS = op === '+' ? '＋' : '−';

      var exprEl = h('div', { 'class': 'sd-hs-expr' });
      var gridBox = h('div', { 'class': 'sd-hs-gridbox' });
      var msg = h('div', { 'class': 'sd-msg sd-hs-msg', 'aria-live': 'polite' });
      var prevBtn = ui.button('もどる', function () { if (si > 0) { si--; render(); } }, { kind: 'sub' });
      var nextBtn = ui.button('つぎへ ▶', function () { if (si < steps.length - 1) { si++; render(); } }, { kind: 'main', cls: 'sd-btn-big' });
      var againBtn = ui.button('はじめから', function () { si = 0; render(); }, { kind: 'sub' });
      var presetRow = h('div', { 'class': 'sd-row' });
      var chips = [];
      presets.forEach(function (p) {
        var b = ui.button(p.replace('+', ' ＋ ').replace('-', ' − '), function () { load(p); }, { cls: 'sd-chip' });
        b._p = p; chips.push(b); presetRow.appendChild(b);
      });
      presetRow.appendChild(ui.button('じぶんで式をつくる', function () {
        ui.askNumbers({
          title: '式をつくろう（' + OPS + '）', maxLen: 6,
          fields: [{ label: op === '+' ? 'たされる数' : 'ひかれる数', value: '' }, { label: op === '+' ? 'たす数' : 'ひく数', value: '' }],
          validate: function (v) {
            if (num.scale(v[0]) > 3 || num.scale(v[1]) > 3) return '小数第三位までにしてね';
            if (+v[0] >= 1000 || +v[1] >= 1000) return '1000より小さい数にしてね';
            if (op === '-' && num.cmp(v[0], v[1]) < 0) return 'ひかれる数を大きくしてね';
            return null;
          },
          onOK: function (v) { load(num.trim(v[0]) + op + num.trim(v[1])); }
        });
      }, { kind: 'sub' }));

      el.appendChild(presetRow);
      el.appendChild(h('div', { 'class': 'sd-cols sd-hs-cols' }, [
        h('div', { 'class': 'sd-col-main' }, [exprEl, gridBox]),
        h('div', { 'class': 'sd-col-side' }, [msg, h('div', { 'class': 'sd-row' }, [prevBtn, nextBtn, againBtn])])
      ]));

      function load(p) {
        var parts = p.split(op === '+' ? '+' : '-');
        model = build(parts[0], parts[1], op);
        steps = stepList(model);
        si = 0;
        chips.forEach(function (c) { c.classList.toggle('on', c._p === p); });
        render();
      }

      /* マス目を作る。rows: [{cells:{p:{d, faint, cross, small, dot, slash, hl}}, op, cls}] */
      function grid(ps, rows, extraCls) {
        var g = h('div', { 'class': 'sd-hs-grid ' + (extraCls || '') });
        g.style.gridTemplateColumns = 'var(--hs-opw) repeat(' + ps.length + ', var(--hs-cw))';
        rows.forEach(function (r) {
          g.appendChild(h('div', { 'class': 'sd-hs-cell sd-hs-op ' + (r.cls || '') }, r.op || ''));
          ps.forEach(function (p) {
            var c = r.cells[p] || {};
            var cell = h('div', { 'class': 'sd-hs-cell ' + (r.cls || '') + (c.hl ? ' sd-hl' : '') + (p === 0 ? ' sd-hs-ones' : '') });
            if (c.small != null) cell.appendChild(h('span', { 'class': 'sd-hs-small' + (c.smallNew ? ' sd-pop' : '') }, String(c.small)));
            if (c.d != null) cell.appendChild(h('span', { 'class': 'sd-hs-d' + (c.faint ? ' sd-faint' : '') + (c.cross ? ' sd-cross' : '') + (c.slash ? ' sd-slash' : '') + (c.isNew ? ' sd-pop' : '') }, String(c.d)));
            if (c.dot) cell.appendChild(h('span', { 'class': 'sd-hs-dot' + (c.dotFaint ? ' sd-faint' : '') + (c.dotNew ? ' sd-drop' : '') + (c.dotSlash ? ' sd-slash-dot' : '') }));
            g.appendChild(cell);
          });
        });
        return g;
      }

      function render() {
        var m = model, s = steps[si];
        exprEl.innerHTML = '';
        exprEl.appendChild(h('span', null, m.a + ' ' + OPS + ' ' + m.b + ' ＝ ' + (s.kind === 'done' ? m.result : '')));
        gridBox.innerHTML = '';
        msg.innerHTML = '';
        prevBtn.disabled = si === 0;
        nextBtn.disabled = si === steps.length - 1;
        againBtn.disabled = si === 0;

        if (s.kind === 'start') {
          msg.appendChild(h('div', { 'class': 'sd-msg-head' }, '筆算でしよう'));
          msg.appendChild(h('div', null, '「つぎへ」をおして、1つずつ進めよう。'));
          gridBox.appendChild(h('div', { 'class': 'sd-hs-placeholder' }, m.a + ' ' + OPS + ' ' + m.b));
          return;
        }
        var colDone = {}; // idx -> true（計算ずみ）
        var curCol = null;
        var colIdxShown = -1;
        for (var k = 0; k <= si; k++) if (steps[k].kind === 'col') colIdxShown = steps[k].idx;
        var allCols = si > 0 && steps.slice(si).every(function (x) { return x.kind !== 'col'; });
        if (allCols) colIdxShown = m.cols.length - 1;
        m.cols.forEach(function (c, i) { if (i <= colIdxShown) colDone[c.p] = c; });
        if (s.kind === 'col') curCol = m.cols[s.idx];
        var pointShown = steps.slice(0, si + 1).some(function (x) { return x.kind === 'point'; }) || (m.sc === 0);
        var zeroShown = steps.slice(0, si + 1).some(function (x) { return x.kind === 'zero'; });
        var lastMarks = {};
        if (op === '-') {
          var lc = null; m.cols.forEach(function (c, i) { if (i <= colIdxShown) lc = c; });
          if (lc) lastMarks = lc.marks;
        }
        var considerZeros = op === '-' && m.sa < m.sc; // 6 → 6.00

        var rowBorrow = { cells: {}, cls: 'sd-hs-mini' };
        var rowA = { cells: {} }, rowB = { cells: {}, op: OPS }, rowC = { cells: {}, cls: 'sd-hs-mini' }, rowR = { cells: {}, cls: 'sd-hs-ans' };
        m.ps.forEach(function (p) {
          var da = digitOf(m.a, p), db = digitOf(m.b, p);
          var hl = curCol && curCol.p === p;
          if (da != null) rowA.cells[p] = { d: da, hl: hl };
          else if (p < 0 && considerZeros) rowA.cells[p] = { d: 0, faint: true, hl: hl };
          else rowA.cells[p] = { hl: hl };
          if (db != null) rowB.cells[p] = { d: db, hl: hl };
          else rowB.cells[p] = { hl: hl };
          if (op === '-' && lastMarks[p] != null) {
            rowA.cells[p].cross = true;
            rowBorrow.cells[p] = { small: lastMarks[p], smallNew: curCol && curCol.borrowed && (curCol.p === p || curCol.borrowFrom === p || curCol.chain.indexOf(p) >= 0) };
          }
          var c = colDone[p];
          if (c) {
            if (!(m.lead[p])) rowR.cells[p] = { d: c.ans, isNew: curCol === c, slash: zeroShown && m.trail.indexOf(p) >= 0, hl: hl };
            else rowR.cells[p] = { hl: hl };
          } else rowR.cells[p] = { hl: hl };
        });
        // くり上がり
        if (op === '+') m.cols.forEach(function (c, i) {
          if (i <= colIdxShown && c.carryOut) rowC.cells[c.p + 1] = { small: c.carryOut, smallNew: curCol === c };
        });
        // 小数点
        var one = 0;
        if (m.sa > 0 || considerZeros) { rowA.cells[one].dot = true; rowA.cells[one].dotFaint = considerZeros; }
        if (m.sb > 0) rowB.cells[one].dot = true;
        if (pointShown && m.sc > 0) {
          rowR.cells[one] = rowR.cells[one] || {};
          rowR.cells[one].dot = true;
          rowR.cells[one].dotNew = s.kind === 'point';
          if (zeroShown && m.trail.length === m.sc) rowR.cells[one].dotSlash = true; // 小数部分がすべて0
        }
        var rows = [];
        if (op === '-') rows.push(rowBorrow);
        rows.push(rowA, rowB);
        if (op === '+') rows.push(rowC);
        rows.push({ cells: {}, cls: 'sd-hs-line' });
        rows.push(rowR);
        var main = grid(m.ps, rows);
        var wrap = h('div', { 'class': 'sd-hs-pair' });
        var mainWrap = h('div', { 'class': 'sd-hs-ok' }, [main]);
        wrap.appendChild(mainWrap);

        var head = '', lines = [];
        if (s.kind === 'align') {
          head = '① 位をそろえて書く';
          lines.push('小数点の位置をそろえて、同じ位どうしを たてにならべて書くよ。');
          if (considerZeros) lines.push(m.a + ' は ' + num.fromInt(num.toInt(m.a, m.sc), m.sc, true) + ' と考えると、計算しやすいね。');
          if (m.sa !== m.sb) {
            mainWrap.insertBefore(h('div', { 'class': 'sd-hs-tag sd-ok' }, '○ 小数点をそろえる'), main);
            wrap.appendChild(wrongExample(m));
            lines.push('右はしをそろえて書くのは まちがい。ちがう位どうしを 計算してしまうよ。');
          }
        } else if (s.kind === 'col') {
          head = '② 下の位から計算する';
          lines = colText(m, curCol);
        } else if (s.kind === 'point') {
          head = '③ 小数点をうつ';
          lines.push('答えの小数点は、上の小数点に そろえてうつよ。');
        } else if (s.kind === 'zero') {
          head = '④ 終わりの0を消す';
          lines.push('小数点より右の 終わりの0は、/ で消しておこう。');
          if (m.trail.length === m.sc) lines.push('小数部分がぜんぶ0なので、小数点も消すよ。');
        } else if (s.kind === 'done') {
          head = 'できた！';
          lines.push('答えは ' + m.result + '。');
          if (op === '+') lines.push('整数のたし算と同じように、位ごとに計算できたね。');
          else lines.push('整数のひき算と同じように、位ごとに計算できたね。');
        }
        gridBox.appendChild(wrap);
        msg.appendChild(h('div', { 'class': 'sd-msg-head' }, head));
        lines.forEach(function (l) { msg.appendChild(h('div', null, l)); });
      }

      function wrongExample(m) {
        var la = m.a.replace('.', '').length, lb = m.b.replace('.', '').length;
        var n = Math.max(la, lb);
        var ps = []; for (var i = n - 1; i >= 0; i--) ps.push(i);
        function rowOf(str) {
          var ds = str.replace('.', ''), cells = {};
          var dotIdx = str.indexOf('.');
          for (var j = 0; j < ds.length; j++) {
            var p = ds.length - 1 - j;
            cells[p] = { d: ds.charAt(j) };
            if (dotIdx >= 0 && j === dotIdx - 1) cells[p].dot = true;
          }
          return cells;
        }
        var g = grid(ps, [{ cells: rowOf(m.a) }, { cells: rowOf(m.b), op: OPS }, { cells: {}, cls: 'sd-hs-line' }, { cells: {}, cls: 'sd-hs-ans' }], 'sd-hs-small-grid');
        return h('div', { 'class': 'sd-hs-ng' }, [h('div', { 'class': 'sd-hs-tag sd-ng' }, '× 右はしをそろえる'), g]);
      }

      function colText(m, c) {
        var name = F.placeName(c.p), out = [];
        if (op === '+') {
          var terms = [c.da || 0, c.db || 0];
          var expr = terms.join('＋') + (c.carryIn ? '＋' + c.carryIn + '（くり上がり）' : '');
          out.push(name + '：' + expr + '＝' + c.sum);
          if (c.carryOut) out.push(c.ans + ' を書いて、1 を ' + F.placeName(c.p + 1) + ' にくり上げる。');
        } else {
          var bb = c.db || 0;
          if (c.borrowed) {
            out.push(name + '：' + c.top + ' から ' + bb + ' はひけないね。');
            if (c.chain.length) out.push(F.placeName(c.p + 1) + ' が 0 なので、' + F.placeName(c.borrowFrom) + ' から くり下げるよ。');
            else out.push(F.placeName(c.borrowFrom) + ' から 1 くり下げて、');
            out.push(c.topNow + '−' + bb + '＝' + c.ans);
          } else {
            out.push(name + '：' + c.topNow + '−' + bb + '＝' + c.ans);
          }
        }
        if (c.p === 0 && c.ans === 0 && m.ps[0] === 0) out.push('一の位の 0 は 書いておくよ。');
        return out;
      }

      load(opts.start || presets[0]);
      return { destroy: function () {} };
    }
  });
})(window.Shosu = window.Shosu || {});

</script>
<script>/* js/demos/laws.js */
/* demos/laws.js : 計算のきまり（交換のきまり・結合のきまり） */
(function (S) {
  'use strict';
  var D = S.Demos, ui = D.ui, h = ui.h, num = D.num;
  var SHAPES = [
    { key: 'sq', ch: '□', name: '□', color: '#ffd8a8' },
    { key: 'tr', ch: '△', name: '△', color: '#b2f2bb' },
    { key: 'ci', ch: '○', name: '○', color: '#a5d8ff' }
  ];

  D.register('laws', {
    title: '計算のきまり',
    mount: function (el, opts) {
      var vals = (opts.values || ['3.7', '6.4', '3.6']).slice();
      var shown = { k: false, a: false };

      var slots = h('div', { 'class': 'sd-row sd-center sd-laws-slots' });
      var lawK = h('div', { 'class': 'sd-law' });
      var lawA = h('div', { 'class': 'sd-law' });
      var tip = h('div', { 'class': 'sd-msg', 'aria-live': 'polite' });
      var presets = h('div', { 'class': 'sd-row sd-center' }, [['3.7', '6.4', '3.6'], ['3.48', '0.75', '1.25'], ['8.62', '2.5', '1.38'], ['1.6', '2.7', '0.4']].map(function (p) {
        return ui.button(p.join(', '), function () { vals = p.slice(); shown = { k: false, a: false }; render(); }, { cls: 'sd-chip' });
      }));

      el.appendChild(h('div', { 'class': 'sd-lead' }, '□、△、○ に数を入れて、きまりが小数でも なりたつか たしかめよう。'));
      el.appendChild(slots);
      el.appendChild(presets);
      el.appendChild(lawK);
      el.appendChild(lawA);
      el.appendChild(tip);

      function chip(i, v) {
        var sh = SHAPES[i];
        return h('span', { 'class': 'sd-shape sd-shape-' + sh.key, style: { background: sh.color } }, v == null ? sh.ch : v);
      }
      function sum(a, b) { return num.add(a, b); }

      function render() {
        slots.innerHTML = '';
        SHAPES.forEach(function (sh, i) {
          slots.appendChild(ui.button(h('span', { 'class': 'sd-slot-inner' }, [chip(i), h('span', { 'class': 'sd-slot-eq' }, '＝'), h('b', null, vals[i])]), function () {
            ui.askNumber({
              title: sh.ch + ' に入れる数', value: vals[i], maxLen: 6,
              validate: function (v) { if (num.scale(v) > 3) return '小数第三位までにしてね'; if (+v >= 1000) return '1000より小さい数にしてね'; return null; },
              onOK: function (v) { vals[i] = num.trim(v); shown = { k: false, a: false }; render(); }
            });
          }, { cls: 'sd-slot', aria: sh.ch + 'の数をかえる' }));
        });

        var a = vals[0], b = vals[1], c = vals[2];
        // 交換のきまり
        lawK.innerHTML = '';
        lawK.appendChild(h('div', { 'class': 'sd-law-title' }, ['交換のきまり　', chip(0), ' ＋ ', chip(1), ' ＝ ', chip(1), ' ＋ ', chip(0)]));
        var kl = sum(a, b), kr = sum(b, a);
        var kBody = h('div', { 'class': 'sd-law-body' }, [
          h('div', { 'class': 'sd-law-side' }, [chip(0, a), ' ＋ ', chip(1, b), ' ＝ ', shown.k ? h('b', { 'class': 'sd-pop' }, kl) : '?']),
          h('div', { 'class': 'sd-law-side' }, [chip(1, b), ' ＋ ', chip(0, a), ' ＝ ', shown.k ? h('b', { 'class': 'sd-pop' }, kr) : '?']),
          shown.k ? h('div', { 'class': 'sd-law-ok sd-pop' }, num.cmp(kl, kr) === 0 ? '同じ！' : 'ちがう') : ui.button('計算する', function () { shown.k = true; render(); }, { kind: 'main' })
        ]);
        lawK.appendChild(kBody);

        // 結合のきまり
        lawA.innerHTML = '';
        lawA.appendChild(h('div', { 'class': 'sd-law-title' }, ['結合のきまり　(', chip(0), ' ＋ ', chip(1), ') ＋ ', chip(2), ' ＝ ', chip(0), ' ＋ (', chip(1), ' ＋ ', chip(2), ')']));
        var ab = sum(a, b), bc = sum(b, c), l = sum(ab, c), r = sum(a, bc);
        var aBody = h('div', { 'class': 'sd-law-body' }, [
          h('div', { 'class': 'sd-law-side' }, ['(', chip(0, a), ' ＋ ', chip(1, b), ') ＋ ', chip(2, c), ' ＝ ', shown.a ? h('span', { 'class': 'sd-pop' }, [h('span', { 'class': 'sd-paren' }, ab), ' ＋ ' + c + ' ＝ ', h('b', null, l)]) : '?']),
          h('div', { 'class': 'sd-law-side' }, [chip(0, a), ' ＋ (', chip(1, b), ' ＋ ', chip(2, c), ') ＝ ', shown.a ? h('span', { 'class': 'sd-pop' }, [a + ' ＋ ', h('span', { 'class': 'sd-paren' }, bc), ' ＝ ', h('b', null, r)]) : '?']),
          shown.a ? h('div', { 'class': 'sd-law-ok sd-pop' }, num.cmp(l, r) === 0 ? '同じ！' : 'ちがう') : ui.button('計算する', function () { shown.a = true; render(); }, { kind: 'main' })
        ]);
        lawA.appendChild(aBody);

        tip.innerHTML = '';
        tip.appendChild(h('div', null, 'たし算では、たす順番をかえても、どこを先に計算しても、答えは同じになるよ。'));
        var easy = [];
        if (num.scale(bc) === 0) easy.push([1, 2, bc]);
        if (num.scale(ab) === 0) easy.push([0, 1, ab]);
        var ac = sum(a, c);
        if (num.scale(ac) === 0) easy.push([0, 2, ac]);
        if (easy.length && (shown.a || shown.k)) {
          var e = easy[0];
          tip.appendChild(h('div', null, ['くふう：', chip(e[0], vals[e[0]]), ' ＋ ', chip(e[1], vals[e[1]]), ' ＝ ' + e[2] + ' のように、整数になる組を先に計算すると かんたん！']));
        }
      }
      render();
      return { destroy: function () {} };
    }
  });
})(window.Shosu = window.Shosu || {});

</script>
<script>/* js/demos/furikaeri.js */
/* demos/furikaeri.js : ふりかえり（2.81 の3つの見方と、10倍・1/10 の関係） */
(function (S) {
  'use strict';
  var D = S.Demos, ui = D.ui, h = ui.h, num = D.num;
  var F = S.Figures.util, s = F.s, txt = F.txt;

  /* 100マスの正方形(1)・10マスの列(0.1)・1マス(0.01) で表す */
  function gridPic(n100, mode) {
    var ones = Math.floor(n100 / 100), tenths = Math.floor(n100 / 10) % 10, hund = n100 % 10;
    var c = 11, gap = 34;
    var parts = [];
    var i;
    for (i = 0; i < ones; i++) parts.push({ type: 1 });
    for (i = 0; i < tenths; i++) parts.push({ type: 0.1 });
    if (hund) parts.push({ type: 0.01, n: hund });
    var x = 20, y0 = 50;
    var g = s('g');
    var segs = { 1: [], 0.1: [], 0.01: [] };
    var count = 0;
    parts.forEach(function (pt, k) {
      var prev = parts[k - 1];
      if (prev && prev.type !== pt.type) x += gap;
      var col = mode === 3 ? '#ffe3a3' : pt.type === 1 ? F.placeColor(0) : pt.type === 0.1 ? F.placeColor(-1) : F.placeColor(-2);
      if (mode === 1) col = pt.type === 1 ? '#ffd8a8' : '#a5d8ff';
      var startX = x;
      var w = pt.type === 1 ? 10 * c : c;
      var cells = pt.type === 1 ? 100 : pt.type === 0.1 ? 10 : pt.n;
      g.appendChild(s('rect', { x: x, y: y0 + (pt.type === 0.01 ? (10 - cells) * c : 0), width: w, height: pt.type === 0.01 ? cells * c : 10 * c, fill: col, stroke: '#555', 'stroke-width': 1.6 }));
      var gl = s('g', { stroke: 'rgba(0,0,0,0.25)', 'stroke-width': 0.8 });
      if (pt.type === 1) for (i = 1; i < 10; i++) {
        gl.appendChild(s('line', { x1: x + i * c, y1: y0, x2: x + i * c, y2: y0 + 10 * c }));
        gl.appendChild(s('line', { x1: x, y1: y0 + i * c, x2: x + 10 * c, y2: y0 + i * c }));
      } else {
        var top = pt.type === 0.01 ? (10 - cells) : 0;
        for (i = top + 1; i < 10; i++) gl.appendChild(s('line', { x1: x, y1: y0 + i * c, x2: x + c, y2: y0 + i * c }));
      }
      g.appendChild(gl);
      count += cells;
      segs[pt.type].push([startX, x + w]);
      x += w + (pt.type === 1 ? 10 : 4);
      var lastOfType = !parts[k + 1] || parts[k + 1].type !== pt.type;
      if (mode === 3 && (pt.type === 1 || lastOfType)) g.appendChild(txt(x - (w + (pt.type === 1 ? 10 : 4)) / 2 - 2, y0 + 10 * c + (pt.type === 0.01 ? 48 : 26), String(count), { 'font-size': 18, fill: '#b35c00' }));
    });
    var W = x + 20, H = y0 + 10 * c + 90;
    function brace(a, b, label, y, color) {
      g.appendChild(s('path', { d: 'M' + a + ' ' + (y - 8) + ' v8 H' + b + ' v-8', fill: 'none', stroke: color || '#333', 'stroke-width': 2.2 }));
      g.appendChild(txt((a + b) / 2, y + 26, label, { 'font-size': 22, 'font-weight': 'bold', fill: color || '#333' }));
    }
    var by = y0 + 10 * c + 14;
    function span(t) { var l = segs[t]; return l.length ? [l[0][0], l[l.length - 1][1]] : null; }
    if (mode === 1) {
      var sp1 = span(1), rest = [span(0.1), span(0.01)].filter(Boolean);
      if (sp1) brace(sp1[0], sp1[1], String(ones), by, '#d9480f');
      if (rest.length) brace(rest[0][0], rest[rest.length - 1][1], num.fromInt(n100 % 100, 2), by, '#1971c2');
    } else if (mode === 2) {
      [[1, ones, '1'], [0.1, tenths, '0.1'], [0.01, hund, '0.01']].forEach(function (q) {
        var sp = span(q[0]); if (sp) brace(sp[0], sp[1], q[2] + 'が' + q[1] + 'こ', by + (q[0] === 0.01 ? 34 : 0));
      });
    }
    var svg = F.root(W, H, 'sd-furi-pic', 1.0);
    svg.appendChild(g);
    return svg;
  }

  function chainTable(n100) {
    var base = String(n100);
    var rows = [base, num.shift(base, -1), num.shift(base, -2), num.shift(base, -3)];
    var cols = ['100', '10', '1', '0.1', '0.01', '0.001'];
    var svg = S.Figures.render({ kind: 'placeTable', cols: cols, rows: rows });
    var cw = 100, hh = 66, rh = 72, W = cw * cols.length + 4, H = hh + rh * rows.length + 4;
    var hlRow = 2;
    svg.insertBefore(s('rect', { x: 2, y: 2 + hh + rh * hlRow, width: W - 4, height: rh, fill: '#fff3bf', opacity: 0.9 }), svg.childNodes[cols.length * 2] || null);
    var ext = 290;
    svg.setAttribute('viewBox', '0 0 ' + (W + ext) + ' ' + H);
    svg.style.maxWidth = Math.round((W + ext) * 0.8) + 'px';
    for (var i = 0; i < rows.length - 1; i++) {
      var y1 = 2 + hh + rh * i + rh / 2, y2 = y1 + rh;
      var x = W + 12;
      svg.appendChild(s('path', { d: 'M' + x + ' ' + (y1 + 6) + ' Q' + (x + 50) + ' ' + ((y1 + y2) / 2) + ' ' + x + ' ' + (y2 - 6), fill: 'none', stroke: '#1971c2', 'stroke-width': 3 }));
      svg.appendChild(s('path', { d: 'M' + x + ' ' + (y2 - 6) + ' l12 -4 l-5 -10 z', fill: '#1971c2' }));
      svg.appendChild(F.frac(x + 66, (y1 + y2) / 2 + 2, '1', '10', 22, { fill: '#1971c2' }));
      var x2 = W + 120;
      svg.appendChild(s('path', { d: 'M' + x2 + ' ' + (y2 - 6) + ' Q' + (x2 + 50) + ' ' + ((y1 + y2) / 2) + ' ' + x2 + ' ' + (y1 + 6), fill: 'none', stroke: '#e8590c', 'stroke-width': 3 }));
      svg.appendChild(s('path', { d: 'M' + x2 + ' ' + (y1 + 6) + ' l12 4 l-5 10 z', fill: '#e8590c' }));
      svg.appendChild(txt(x2 + 100, (y1 + y2) / 2 + 8, '10倍', { 'font-size': 24, 'font-weight': 'bold', fill: '#e8590c' }));
    }
    return svg;
  }

  D.register('furikaeri', {
    title: 'ふりかえり',
    mount: function (el, opts) {
      var n100 = Math.round(Number(opts.number || '2.81') * 100);
      var view = 1;
      var picBox = h('div', { 'class': 'sd-figbox' });
      var viewText = h('div', { 'class': 'sd-msg sd-furi-text', 'aria-live': 'polite' });
      var tableBox = h('div', { 'class': 'sd-figbox' });
      var tableText = h('div', { 'class': 'sd-msg' });
      var seg = ui.segmented([
        { value: 1, label: '見方1' }, { value: 2, label: '見方2' }, { value: 3, label: '見方3' }
      ], view, function (v) { view = v; render(); });
      var numSeg = ui.segmented(['2.81', '1.36', '4.07'].map(function (n) { return { value: Math.round(Number(n) * 100), label: n }; }), n100, function (v) { n100 = v; render(); });

      el.appendChild(h('div', { 'class': 'sd-row' }, [h('span', { 'class': 'sd-lead' }, 'いろいろな見方をしてみよう'), numSeg.el]));
      el.appendChild(h('div', { 'class': 'sd-cols' }, [
        h('div', { 'class': 'sd-col-main' }, [seg.el, picBox]),
        h('div', { 'class': 'sd-col-side' }, [viewText])
      ]));
      el.appendChild(h('div', { 'class': 'sd-cols' }, [
        h('div', { 'class': 'sd-col-main' }, [tableBox]),
        h('div', { 'class': 'sd-col-side' }, [tableText])
      ]));

      function render() {
        var str = num.fromInt(n100, 2);
        var ones = Math.floor(n100 / 100), t = Math.floor(n100 / 10) % 10, hd = n100 % 10;
        picBox.innerHTML = '';
        picBox.appendChild(gridPic(n100, view));
        viewText.innerHTML = '';
        var texts = {
          1: [h('b', null, str), ' は、', h('b', null, String(ones)), ' と ', h('b', null, num.fromInt(n100 % 100, 2)), ' を合わせた数'],
          2: [h('b', null, str), ' は、1を' + ones + 'こ、0.1を' + t + 'こ、0.01を' + hd + 'こ 合わせた数'],
          3: [h('b', null, str), ' は、0.01を ', h('b', { 'class': 'sd-big' }, n100 + 'こ'), ' 集めた数']
        };
        viewText.appendChild(h('div', null, texts[view]));
        viewText.appendChild(h('div', { 'class': 'sd-note' }, '図の 大きな正方形が1、たての1列が0.1、1マスが0.01'));
        tableBox.innerHTML = '';
        tableBox.appendChild(chainTable(n100));
        tableText.innerHTML = '';
        tableText.appendChild(h('div', null, [String(n100) + ' → ' + num.shift(String(n100), -1) + ' → ' + str + ' → ' + num.shift(String(n100), -3)]));
        tableText.appendChild(h('div', null, ['1/10 にすると、どの数字も位が1つ下がる。10倍すると、位が1つ上がる。']));
      }
      render();
      return { destroy: function () {} };
    }
  });
})(window.Shosu = window.Shosu || {});

</script>
<script>/* js/lessons.js */
/* lessons.js — 第1〜10時の内容（担当D）
 * Shosu.Lessons, Shosu.ReviewTopics
 * 問題の id は「L時-番号」（例 L3-05）を自動でつける。
 */
(function (S) {
  'use strict';

  var G = S.Generators;
  function hHints(op, a, b) {
    if (G && G.hissanHints) return G.hissanHints(op, a, b);
    return ['小数点の位置をたてにそろえて書こう。', '整数のときと同じように、右の位から計算しよう。', '答えの小数点は、上の小数点にそろえて打とう。'];
  }

  // ---------- 問題を作る道具 ----------
  function assign(o, opt) {
    if (opt) for (var k in opt) if (Object.prototype.hasOwnProperty.call(opt, k)) o[k] = opt[k];
    return o;
  }
  function fill(tag, parts, hints, opt) {
    return assign({ type: 'fill', tag: tag, parts: parts, hints: hints }, opt);
  }
  function choice(tag, q, options, a, hints, opt) {
    return assign({ type: 'choice', tag: tag, q: q, options: options, a: a, hints: hints }, opt);
  }
  function order(tag, q, items, dir, hints, opt) {
    return assign({ type: 'order', tag: tag, q: q, items: items, dir: dir, hints: hints }, opt);
  }
  function hissan(op, a, b, opt) {
    return assign({ type: 'hissan', tag: op === '+' ? 'tashizan' : 'hikizan', op: op, a: a, b: b, hints: hHints(op, a, b) }, opt);
  }
  function A(a) { return { a: a }; }
  function masu(L, d1, d2, d3, level) {
    var f = { kind: 'masu', unit: 'L', L: L, d1: d1, d2: d2, level: level || 2 };
    if (level === 3) f.d3 = d3 || 0;
    return f;
  }

  var PLACE_NAMES = ['一の位', '小数第一位', '小数第二位', '小数第三位'];
  var INEQ = ['>', '<', '='];
  var Q_FILL = '□にあてはまる数を書きましょう。';
  var Q_MASU = 'かさは何Lですか。';
  var CMP_HINTS = [
    '小数点の位置をそろえて、たてにならべて書いてみよう。',
    '上の位（一の位→小数第一位→小数第二位…）から順にくらべよう。',
    'はじめて数字がちがう位で、数字が大きいほうが大きい数だよ。'
  ];
  var T10_HINTS = [
    '10倍すると、どの数字も位が1つ上がるよ。1/10にすると、位が1つ下がるよ。',
    '位の表に書いて、数字を動かしてみよう。',
    '100倍は10倍の10倍、1000倍は100倍の10倍だね。'
  ];

  // ---------- 第1時 ----------
  var L1 = [
    fill('hyoshikata', ['0.1Lを10等分した1つ分（小さい目もり1つ分）は', A('0.01'), 'Lです。'], [
      '1Lを10等分した1つ分は、0.1Lだったね。',
      '同じように、0.1Lを10等分した1つ分を考えよう。小数第二位の数になるよ。'
    ], { q: Q_FILL, fig: masu(0, 0, 1) }),
    fill('hyoshikata', ['1Lが1こ、0.1Lが2こ、0.01Lが6こで', A('1.26'), 'L'], [
      'いちばん右のますは、0.1Lを10等分しているね。目もりはいくつ分かな？',
      '小さい目もり1つ分は0.01L。6こ分で何Lかな？',
      '1Lと0.2Lと0.06Lを合わせよう。'
    ], { q: 'さらさんの水とうに入っていた水のかさを調べました。', fig: masu(1, 2, 6) }),
    choice('hyoshikata', '1.26L の読み方はどれですか。', ['一点二六リットル', '一点二十六リットル'], '一点二六リットル', [
      '小数点より右の数字は、1つずつ読むよ。',
      '「1.5」は「一点五」と読んだね。'
    ], { explain: '小数点より右は、数字を1つずつ読みます。1.26Lは「一点二六リットル」です。' }),
    fill('hyoshikata', ['はるとさんの水のかさは', A('1.3'), 'Lです。'], [
      '0.1Lが3こで何Lかな？',
      '1Lと合わせよう。'
    ], { q: 'はるとさんは、1Lますが1こと、0.1Lますが3こでした。', fig: masu(1, 3, 0) }),
    fill('hyoshikata', [A('2.45'), 'L'], [
      '1Lますが何こ、0.1Lますが何こあるかな？',
      'いちばん右のますの目もりを数えよう。小さい目もり1つ分は0.01Lだよ。',
      '1Lの分、0.1Lの分、0.01Lの分を合わせよう。'
    ], { q: Q_MASU, fig: masu(2, 4, 5) }),
    fill('hyoshikata', [A('0.07'), 'L'], [
      '1Lますも0.1Lますもないね。一の位と小数第一位には0を書こう。',
      '小さい目もり（0.01L）が何こ分かな？'
    ], { q: Q_MASU, fig: masu(0, 0, 7) }),
    fill('hyoshikata', [A('0.38'), 'L'], [
      '1Lますはないね。一の位は0だよ。',
      '0.1Lが何こ、0.01Lが何こあるかな？'
    ], { q: Q_MASU, fig: masu(0, 3, 8) }),
    fill('hyoshikata', ['0.01Lを26こ集めたかさは', A('0.26'), 'Lです。'], [
      '0.01Lが10こで0.1Lになるね。',
      '26こは、10こが2つと、のこり6こだね。'
    ], { q: Q_FILL })
  ];

  // ---------- 第2時 ----------
  var NL2 = { kind: 'numberline', min: 2.9, max: 3.2, step: 0.01, labelEvery: 10, unit: 'm',
    arrows: [{ v: 2.91, label: 'あ' }, { v: 2.98, label: 'い' }, { v: 3.05, label: 'う' }, { v: 3.08, label: 'え' }, { v: 3.16, label: 'お' }] };
  var NL2_HINTS = [
    '数が書いてある目もりの間は、10こに分かれているね。小さい目もり1つ分はいくつかな？',
    '小さい目もり1つ分は0.01mだよ。',
    'すぐ左の、数が書いてある目もりから、目もりいくつ分進んでいるかな？'
  ];
  function nl2(label, ans) {
    return fill('hyoshikata', [label + 'の目もりは', A(ans), 'mです。'], NL2_HINTS, { q: '数直線の' + label + 'の目もりが表す長さを書きましょう。', fig: NL2 });
  }
  var L2 = [
    fill('hyoshikata', ['1mが2つで2、0.1m（10cm）が', A('8'), 'つで0.8、0.01m（1cm）が', A('3'), 'つで0.03'], [
      '10cmは、1mを10等分した1つ分だから0.1mだね。',
      '80cmは10cmが何こ分かな？　3cmは1cmが何こ分かな？'
    ], { q: '2m83cmが何mになるかを考えます。□にあてはまる数を書きましょう。' }),
    fill('hyoshikata', ['2m83cm＝', A('2.83'), 'm'], [
      '2mと0.8mと0.03mを合わせよう。',
      'かさのときと同じように、はしたを小数で表そう。'
    ], { q: Q_FILL }),
    fill('hyoshikata', ['10cm＝', A('0.1'), 'm'], [
      '1m＝100cmだね。',
      '10cmは、1mを10等分した1つ分だよ。'
    ], { q: Q_FILL }),
    fill('hyoshikata', ['1cm＝', A('0.01'), 'm'], [
      '1cmは、10cmを10等分した1つ分だね。',
      '0.1mを10等分した1つ分は、何mかな？'
    ], { q: Q_FILL }),
    fill('hyoshikata', [A('1.19'), 'L'], [
      '1Lが1こ、0.1Lが1こあるね。',
      'あと0.01Lが何こ分あるかな？　目もりを数えよう。'
    ], { q: Q_MASU, fig: masu(1, 1, 9) }),
    fill('hyoshikata', [A('1.02'), 'L'], [
      '0.1Lますはないね。小数第一位には何を書けばいいかな？',
      '0.01Lが何こ分あるかな？',
      '数字がない位には0を書こう。'
    ], { q: Q_MASU, fig: masu(1, 0, 2) }),
    nl2('あ', '2.91'), nl2('い', '2.98'), nl2('う', '3.05'), nl2('え', '3.08'), nl2('お', '3.16')
  ];

  // ---------- 第3時 ----------
  var NL3 = { kind: 'numberline', min: 2.39, max: 2.41, step: 0.001, labelEvery: 10,
    arrows: [{ v: 2.391, label: 'あ' }, { v: 2.395, label: 'い' }, { v: 2.399, label: 'う' }, { v: 2.401, label: 'え' }] };
  var NL3_HINTS = [
    '2.39と2.4の間は、10こに分かれているね。',
    '小さい目もり1つ分は、0.01を10等分した0.001だよ。',
    'すぐ左の、数が書いてある目もりから、目もりいくつ分かな？'
  ];
  function nl3(label, ans) {
    return fill('hyoshikata', [label + 'の目もりは', A(ans), 'です。'], NL3_HINTS, { q: '数直線の' + label + 'の目もりが表す数を書きましょう。', fig: NL3 });
  }
  function conv(from, ans, to, hints) {
    return fill('hyoshikata', [from + '＝', A(ans), to], hints, { q: Q_FILL });
  }
  var KM_H = ['1000m＝1km、1m＝0.001km だよ。', '1kmが何こと、0.001kmが何こ分かな？', '位の表に数字をあてはめて考えよう。'];
  var M_H = ['1000mm＝1m、1mm＝0.001m だよ。', '1mが何こと、0.001mが何こ分かな？'];
  var KG_H = ['1000g＝1kg、1g＝0.001kg だよ。', 'gの分は、0.001kgが何こ分かな？', 'kgの分と合わせよう。'];
  var L3 = [
    fill('hyoshikata', ['0.01Lを10等分した1つ分は', A('0.001'), 'Lです。'], [
      '0.1Lを10等分した1つ分が0.01Lだったね。',
      '同じように、0.01Lを10等分した1つ分を考えよう。小数第三位の数になるよ。'
    ], { q: Q_FILL, fig: masu(0, 0, 0, 1, 3) }),
    fill('hyoshikata', [A('1.236'), 'L'], [
      '1Lます、0.1Lます、0.01Lますはそれぞれ何こかな？',
      'いちばん右のますの小さい目もり1つ分は0.001Lだよ。',
      '1L、0.2L、0.03L、0.006Lを合わせよう。'
    ], { q: Q_MASU, fig: masu(1, 2, 3, 6, 3) }),
    choice('hyoshikata', '0.001L の読み方はどれですか。', ['れい点れいれい一リットル', 'れい点一リットル', 'れい点れい一リットル'], 'れい点れいれい一リットル', [
      '小数点より右の数字は、0も1つずつ読むよ。',
      '小数点より右には、数字がいくつあるかな？'
    ], { explain: '0.001は、小数点より右の「0」「0」「1」を1つずつ読んで「れい点れいれい一」です。' }),
    fill('hyoshikata', ['1kmが', A('1'), 'こで1、0.1kmが', A('4'), 'こで0.4、0.01kmが', A('2'), 'こで0.02、0.001kmが', A('5'), 'こで0.005'], [
      '0.1kmは100m、0.01kmは10m、0.001kmは1mだよ。',
      '1425mを、1000mと400mと20mと5mに分けて考えよう。'
    ], { q: '長さ1425mの橋があります。何kmかを考えます。□にあてはまる数を書きましょう。' }),
    conv('1425m', '1.425', 'km', KM_H),
    fill('hyoshikata', ['1kg264g＝', A('1.264'), 'kg'], KG_H, { q: 'みかんの重さは1kg264gでした。何kgですか。' }),
    conv('1435mm', '1.435', 'm', M_H),
    conv('42195m', '42.195', 'km', KM_H),
    conv('875g', '0.875', 'kg', ['1g＝0.001kg だよ。', '875gは、0.001kgが何こ分かな？', '1kgより軽いから、一の位は0だね。']),
    conv('1067mm', '1.067', 'm', M_H.concat(['0.1mの位に入る数字はあるかな？　ないときは0を書こう。'])),
    conv('852mm', '0.852', 'm', M_H),
    conv('3776m', '3.776', 'km', KM_H),
    conv('80273m', '80.273', 'km', KM_H.slice(0, 2).concat(['0.1kmの位に入る数字はあるかな？'])),
    conv('2kg368g', '2.368', 'kg', KG_H),
    conv('36kg705g', '36.705', 'kg', KG_H.slice(0, 2).concat(['0.01kgの位に入る数字はあるかな？'])),
    nl3('あ', '2.391'), nl3('い', '2.395'), nl3('う', '2.399'), nl3('え', '2.401')
  ];

  // ---------- 第4時 ----------
  var REL_H = ['1、0.1、0.01、0.001 は、10倍するごとに位が1つ上がるよ。', '0.1を10こ集めると1、0.01を10こ集めると0.1だね。'];
  var L4 = [

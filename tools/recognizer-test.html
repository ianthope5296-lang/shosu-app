<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数字認識テスト</title>
<style>
  body { font-family: "UD デジタル 教科書体 N-R", "UD Digi Kyokasho N-R", "メイリオ", Meiryo, sans-serif; margin: 20px; color: #222; }
  .row { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  #box { width: 240px; height: 240px; border: 3px solid #333; border-radius: 6px; touch-action: none; background: #fff;
         background-image: linear-gradient(#ddd 1px, transparent 1px), linear-gradient(90deg, #ddd 1px, transparent 1px);
         background-size: 120px 120px; background-position: -1px -1px; cursor: crosshair; }
  #pre { width: 168px; height: 168px; image-rendering: pixelated; border: 1px solid #999; background: #000; }
  #result { font-size: 72px; font-weight: bold; min-width: 80px; text-align: center; }
  #top div { font-size: 20px; margin: 4px 0; }
  .bar { display: inline-block; height: 12px; background: #4a90d9; vertical-align: middle; margin-left: 8px; }
  button { font-size: 20px; padding: 8px 20px; margin-top: 10px; min-height: 48px; }
  #status { color: #a00; }
  small { color: #666; }
</style>
</head>
<body>
<h1>数字認識テスト <small id="status"></small></h1>
<p>マスに数字を1つ書いてください（マウス・ペン・タッチ）。書くたびに読み取ります。</p>
<div class="row">
  <div>
    <canvas id="box" width="240" height="240"></canvas><br>
    <button id="clear">けす</button>
  </div>
  <div>
    <div>読み取り</div>
    <div id="result">-</div>
    <div id="conf"></div>
  </div>
  <div>
    <div>上位3候補</div>
    <div id="top"></div>
  </div>
  <div>
    <div>前処理後 28x28</div>
    <canvas id="pre" width="28" height="28"></canvas>
    <div><small id="time"></small></div>
  </div>
</div>

<script src="../model/digit-model.js"></script>
<script src="../js/recognizer.js"></script>
<script>
(function () {
  var R = window.Shosu.Recognizer;
  var box = document.getElementById('box'), ctx = box.getContext('2d');
  var pre = document.getElementById('pre'), pctx = pre.getContext('2d');
  var strokes = [], cur = null;
  document.getElementById('status').textContent = R.isReady() ? '' : '（モデルを読み込めません）';

  function pos(e) {
    var r = box.getBoundingClientRect();
    return { x: (e.clientX - r.left) * box.width / r.width, y: (e.clientY - r.top) * box.height / r.height };
  }
  function redraw() {
    ctx.clearRect(0, 0, box.width, box.height);
    ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111';
    strokes.forEach(function (s) {
      ctx.beginPath(); ctx.moveTo(s[0].x, s[0].y);
      if (s.length === 1) ctx.lineTo(s[0].x + 0.1, s[0].y);
      for (var i = 1; i < s.length; i++) ctx.lineTo(s[i].x, s[i].y);
      ctx.stroke();
    });
  }
  function run() {
    var t0 = performance.now();
    var res = R.recognize(strokes, box.width, box.height);
    var dt = performance.now() - t0;
    var img = R.preprocess(strokes, box.width, box.height);
    document.getElementById('result').textContent = res.digit === null ? '（空）' : res.digit;
    document.getElementById('conf').textContent = res.digit === null ? '' : '自信 ' + Math.round(res.conf * 100) + '%';
    document.getElementById('top').innerHTML = res.top.map(function (t) {
      return '<div>' + t.digit + '：' + (t.conf * 100).toFixed(1) + '%<span class="bar" style="width:' + Math.round(t.conf * 120) + 'px"></span></div>';
    }).join('');
    document.getElementById('time').textContent = '認識 ' + dt.toFixed(1) + ' ms';
    var id = pctx.createImageData(28, 28);
    for (var i = 0; i < 784; i++) {
      var v = img ? Math.round(img[i] * 255) : 0;
      id.data[i * 4] = id.data[i * 4 + 1] = id.data[i * 4 + 2] = v; id.data[i * 4 + 3] = 255;
    }
    pctx.putImageData(id, 0, 0);
    window.lastResult = res;
  }
  box.addEventListener('pointerdown', function (e) {
    e.preventDefault(); box.setPointerCapture(e.pointerId);
    cur = [pos(e)]; strokes.push(cur); redraw();
  });
  box.addEventListener('pointermove', function (e) {
    if (!cur) return; cur.push(pos(e)); redraw();
  });
  function end() { if (!cur) return; cur = null; run(); }
  box.addEventListener('pointerup', end);
  box.addEventListener('pointercancel', end);
  document.getElementById('clear').addEventListener('click', function () { strokes = []; redraw(); run(); });
  window.getStrokes = function () { return strokes; };
  run();
})();
</script>
</body>
</html>
